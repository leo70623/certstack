<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertStack — 全球法規追蹤 / Global Regulatory Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #FAF1C4;
    --surface: #FFFFFF;
    --blue: #1A5FA8;
    --blue-dark: #12497F;
    --blue-soft: #EAF2FA;
    --blue-hair: #C4D8EC;
    --radius-sm: 8px;
    --radius-lg: 12px;
    --gap: 1rem;
    --pad: 1rem;
    --row-pad: 15px;
    --low-red: #B3261E;
    --stub-amber: #8A5A00;
    --muted: #4B5A66;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--canvas);
    color: #1F2A33;
    font-family: "Public Sans", "Noto Sans TC", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }

  body.density-compact {
    --gap: 0.5rem;
    --pad: 0.55rem;
    --row-pad: 9px;
  }

  a { color: var(--blue); }

  button, select, input {
    font-family: inherit;
  }

  button {
    cursor: pointer;
  }

  :focus-visible {
    outline: 3px solid var(--blue-dark);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--surface);
    color: var(--blue-dark);
    padding: 0.5rem 1rem;
    z-index: 100;
    border-radius: 0 0 var(--radius-sm) 0;
  }
  .skip-link:focus {
    left: 0;
  }

  /* ---- 標題區：直接放在柔黃底上，不加白色面板 ---- */

  header.site-header {
    padding: 1.25rem 1rem 0.75rem;
  }

  .site-header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .site-title {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .site-title h1 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--blue-dark);
  }

  .site-title p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .header-controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-self: flex-start;
  }

  /* 次要按鈕：透明底、1px 藍框、13px */
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--blue);
    color: var(--blue-dark);
    border-radius: var(--radius-sm);
    padding: 0.3rem 0.7rem;
    font-size: 13px;
    font-weight: 600;
  }
  .btn-ghost:hover { background: var(--blue-soft); }
  .btn-ghost[aria-pressed="true"] {
    background: var(--blue);
    color: #fff;
  }

  /* ---- 倒數區塊：整頁唯一重點元素 ---- */

  .countdown-hero {
    background: var(--blue);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: 0.85rem 1.4rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 220px;
    flex: 0 1 auto;
  }
  .countdown-hero .cd-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: 0.85;
  }
  .countdown-hero .cd-days {
    font-size: 36px;
    font-weight: 700;
    line-height: 1.1;
  }
  .countdown-hero .cd-days .unit {
    font-size: 14px;
    font-weight: 600;
    margin-left: 0.3rem;
  }
  .countdown-hero .cd-name {
    font-size: 14px;
    font-weight: 600;
    margin-top: 0.2rem;
  }
  .countdown-hero .cd-date {
    font-size: 12px;
    opacity: 0.85;
  }
  .countdown-hero.is-empty {
    padding: 0.7rem 1.4rem;
  }
  .countdown-hero.is-empty .cd-name {
    font-size: 14px;
    font-weight: 600;
    margin-top: 0;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--blue-hair);
    border-radius: var(--radius-lg);
  }

  /* ---- 篩選面板：預設收合 ---- */

  details.filter-panel {
    background: var(--surface);
    border: 1px solid var(--blue-hair);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  details.filter-panel > summary {
    list-style: none;
    cursor: pointer;
    padding: 0.7rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 14px;
  }
  details.filter-panel > summary::-webkit-details-marker { display: none; }
  details.filter-panel > summary::before {
    content: "▸";
    color: var(--blue);
    font-weight: 700;
    transition: transform 0.15s ease;
  }
  details.filter-panel[open] > summary::before {
    transform: rotate(90deg);
  }

  .filter-title {
    font-weight: 700;
    color: var(--blue-dark);
  }

  .filter-summary-text {
    color: var(--muted);
    flex: 1 1 auto;
  }

  #entry-count {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .filter-body {
    padding: 0 1rem 1rem;
    border-top: 1px solid var(--blue-hair);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .search-field {
    flex: 1 1 260px;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding-top: 0.8rem;
  }

  .search-field input[type="search"] {
    width: 100%;
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--blue-hair);
    border-radius: var(--radius-sm);
    background: var(--blue-soft);
    font-size: 14px;
  }

  .filter-groups-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: flex-start;
  }

  fieldset.filter-group {
    border: 1px solid var(--blue-hair);
    border-radius: var(--radius-sm);
    padding: 0.5rem 0.7rem;
    min-width: 200px;
  }

  fieldset.filter-group legend {
    font-weight: 600;
    color: var(--blue-dark);
    padding: 0 0.3rem;
    font-size: 13px;
  }

  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .chip {
    border: 1px solid var(--blue-hair);
    background: var(--blue-soft);
    color: var(--blue-dark);
    border-radius: 999px;
    padding: 0.25rem 0.7rem;
    font-size: 14px;
    font-weight: 600;
  }
  .chip[aria-pressed="true"] {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue-dark);
  }

  select {
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--blue-hair);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 14px;
  }

  .sort-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .field-label {
    font-weight: 600;
    color: var(--blue-dark);
    font-size: 13px;
  }

  /* ---- 條目列表：單一白色面板，內含多列 ---- */

  .entry-table {
    overflow: hidden;
  }

  details.entry-row {
    display: block;
    border-bottom: 1px solid var(--blue-hair);
    position: relative;
  }
  details.entry-row:last-child {
    border-bottom: none;
  }

  details.entry-row.is-child {
    background: var(--blue-soft);
  }
  details.entry-row.is-child::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 1.7rem;
    width: 2px;
    background: var(--blue-hair);
  }

  details.entry-row > summary {
    list-style: none;
    cursor: pointer;
    display: grid;
    grid-template-columns: 56px 1fr auto auto;
    align-items: center;
    column-gap: 0.85rem;
    padding: var(--row-pad) 1rem;
  }
  details.entry-row.is-child > summary {
    padding-left: calc(1rem + 44px);
  }
  details.entry-row > summary::-webkit-details-marker { display: none; }

  .juris-code {
    display: block;
    text-align: center;
    background: var(--blue-soft);
    color: var(--blue-dark);
    border-radius: 6px;
    padding: 0.3rem 0.2rem 0.4rem;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border-bottom: 3px solid var(--blue);
  }

  .row-name-wrap {
    min-width: 0;
  }
  .row-name {
    font-size: 17px;
    font-weight: 500;
    color: var(--blue-dark);
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-citation {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-top: 0.1rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-parent-hint {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-top: 0.1rem;
  }

  .row-status-text {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .row-markers {
    display: flex;
    gap: 0.3rem;
    flex-wrap: nowrap;
  }

  .marker {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 0.15rem 0.55rem;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    background: transparent;
  }
  .marker-countdown {
    background: var(--blue);
    color: #fff;
  }
  .marker-stub {
    border: 1px solid var(--stub-amber);
    color: var(--stub-amber);
  }
  .marker-pending {
    border: 1px solid #C9C9C9;
    color: #6B6B6B;
  }
  .marker-low {
    border: 1px solid var(--low-red);
    color: var(--low-red);
  }
  .marker-more {
    border: 1px solid var(--blue-hair);
    color: var(--muted);
  }

  details.entry-row > summary::after {
    content: "▸";
    color: var(--blue);
    font-weight: 700;
    transition: transform 0.15s ease;
    grid-column: 4;
    grid-row: 1;
    justify-self: end;
    margin-left: 0.4rem;
    display: none;
  }

  .expand-marker {
    color: var(--blue);
    font-weight: 700;
    transition: transform 0.15s ease;
  }
  details.entry-row[open] .expand-marker {
    transform: rotate(90deg);
  }

  .entry-body {
    padding: 0 1rem 1.1rem;
    padding-left: calc(56px + 0.85rem + 1rem);
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  details.entry-row.is-child .entry-body {
    padding-left: calc(1rem + 44px + 56px + 0.85rem);
  }

  .section h3 {
    margin: 0 0 0.35rem;
    font-size: 0.95em;
    color: var(--blue-dark);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .kv-list {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.25rem 0.7rem;
    margin: 0;
  }
  .kv-list dt { font-weight: 600; color: var(--muted); }
  .kv-list dd { margin: 0; }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .tag {
    background: var(--blue-soft);
    border: 1px solid var(--blue-hair);
    border-radius: var(--radius-sm);
    padding: 0.15rem 0.5rem;
    font-size: 0.85em;
  }

  ul.plain-list, ol.plain-list {
    margin: 0;
    padding-left: 1.2rem;
  }

  .info-btn {
    background: none;
    border: 1px solid var(--blue-hair);
    color: var(--blue-dark);
    border-radius: 50%;
    width: 1.2rem;
    height: 1.2rem;
    line-height: 1;
    font-size: 0.75em;
    padding: 0;
    position: relative;
  }
  .info-btn .tooltip {
    display: none;
    position: absolute;
    bottom: 130%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--blue-dark);
    color: #fff;
    padding: 0.4rem 0.6rem;
    border-radius: var(--radius-sm);
    width: 220px;
    font-weight: 400;
    font-size: 0.9em;
    z-index: 10;
    text-align: left;
  }
  .info-btn:hover .tooltip,
  .info-btn:focus .tooltip {
    display: block;
  }

  .verify-dates {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    font-size: 0.9em;
  }

  .verify-dates strong {
    color: var(--blue-dark);
  }

  .notice-box {
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.8rem;
    font-size: 0.9em;
    background: #FFF8E8;
    border: 1px solid var(--stub-amber);
    color: #5A3D00;
  }

  .source-list {
    margin: 0;
    padding-left: 1.2rem;
  }

  .empty-state, .error-state {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
  }
  .error-state {
    color: var(--low-red);
    font-weight: 600;
  }

  footer.site-footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: var(--gap);
    font-size: 0.8em;
    color: var(--muted);
  }
  footer.site-footer p {
    margin: 0 0 0.5rem;
  }
  footer.site-footer .source-note {
    font-style: italic;
    opacity: 0.8;
  }

  @media print {
    :root { --canvas: #fff; }
    body { background: #fff; }
    details.filter-panel, .header-controls, .countdown-hero { display: none !important; }
    details.entry-row {
      break-inside: avoid;
    }
  }
</style>
</head>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-title">
        <h1 data-i18n="siteTitle">CertStack</h1>
        <p data-i18n="siteSubtitle">消費性電子產品全球法規追蹤</p>
      </div>
      <div id="countdown-hero" class="countdown-hero" role="status"></div>
      <div class="header-controls">
        <button id="lang-toggle" class="btn-ghost" type="button" aria-pressed="false"></button>
        <button id="density-toggle" class="btn-ghost" type="button" aria-pressed="false"></button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <details class="filter-panel" id="filter-panel">
      <summary>
        <span class="filter-title" data-i18n="filterToggleLabel">篩選</span>
        <span id="filter-summary-text" class="filter-summary-text"></span>
        <span id="entry-count"></span>
      </summary>
      <div class="filter-body">
        <div class="search-field">
          <label class="field-label" for="search-input" data-i18n="searchLabel">搜尋</label>
          <input id="search-input" type="search">
        </div>
        <div class="filter-groups-row">
          <fieldset class="filter-group">
            <legend data-i18n="filterJurisdiction">法域</legend>
            <div id="jurisdiction-chips" class="chip-list"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend data-i18n="filterTags">產品類別</legend>
            <div id="tag-chips" class="chip-list"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend data-i18n="filterStatus">狀態</legend>
            <div id="status-chips" class="chip-list"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend data-i18n="filterEntryStatus">條目狀態</legend>
            <div id="entry-status-chips" class="chip-list"></div>
          </fieldset>
        </div>
        <div class="sort-row">
          <label class="field-label" for="sort-select" data-i18n="sortLabel">排序</label>
          <select id="sort-select">
            <option value="date" data-i18n="sortByDate">依最近生效日</option>
            <option value="verified" data-i18n="sortByVerified">依最近查核日</option>
          </select>
        </div>
      </div>
    </details>

    <section class="panel entry-table" aria-label="法規條目列表 / Regulation entries">
      <div id="entry-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-disclaimer"></p>
    <p class="source-note" id="footer-source-note"></p>
  </footer>

      sortByDate: "By nearest application date",
      sortByVerified: "By most recent verification",
      entryCount: function (n) { return n + " entries"; },
      emptyState: "No entries match the current filters.",
      errorState: "Failed to load data. Please refresh the page or try again later.",
      loading: "Loading…",
      stubBadge: "Entry in progress",
      pendingBadge: "Pending human review",
      countdownBadge: "Countdown",
      confidenceLowBadge: "Low confidence",
      moreMarkers: function (n) { return "+" + n; },
      confidenceLabel: "Confidence",
      confidence: { high: "High", medium: "Medium", low: "Low" },
      parentHint: function (name) { return "Parent entry: " + name; },
      childrenTitle: "Child entries",
      appliesInTitle: "Applies in (member states)",
      productScopeTitle: "Product scope",
      tagsTitle: "Product / component tags",
      requirementsTitle: "Requirements",
      obligationsTitle: "Obligations",
      enforcementTitle: "Enforcement",
      sourcesTitle: "Sources",
      notesTitle: "Notes",
      datesTitle: "Key dates",
      lastVerifiedLabel: "Last verified",
      lastReviewedLabel: "Last reviewed",
      lastVerifiedTip: "Link reachable, status unchanged",
      lastReviewedTip: "Content checked word-for-word against the official source",
      citationLabel: "Citation",
      localTypeLabel: "Local instrument type",
      instrumentTypeLabel: "Instrument type",
      statusLabel: "Status",
      countdownPrefix: "Next application date in",
      countdownDays: "days",
      countdownNone: "No entries with an upcoming application date.",
      yes: "Yes",
      no: "No",
      publisherLabel: "Publisher",
      instrumentType: { regulation: "Regulation", directive: "Directive", mandatory_standard: "Mandatory standard", administrative_measure: "Administrative measure", guidance: "Guidance", statute: "Statute" },
      status: { draft: "Draft", adopted: "Adopted", in_force: "In force", superseded: "Superseded", withdrawn: "Withdrawn" },
      entryStatus: { stub: "Entry in progress", complete: "Complete" },
      appliesTo: { producer: "Producer", seller: "Seller", importer: "Importer", manufacturer: "Manufacturer" },
      conformity: { none: "None", sdoc: "Self-declaration (SDoC)", ccc: "CCC certification", type_approval: "Type approval", third_party: "Third-party assessment" },
      penaltyBasis: { in_instrument: "Set out in the instrument itself", national_law: "Set by national implementing law", none_specified: "Not specified" },
      requirementFields: { marking: "Marking required", local_representative: "Local representative required", local_testing: "Local testing required", registration: "Registration required" }
    }
  };

  var STATUS_VALUES = ["draft", "adopted", "in_force", "superseded", "withdrawn"];
  var ENTRY_STATUS_VALUES = ["stub", "complete"];

  var state = {
    lang: "zh",
    density: "comfortable",
    search: "",
    jurisdictions: new Set(),
    tags: new Set(),
    statuses: new Set(),
    entryStatuses: new Set(),
    sort: "date"
  };

  var raw = null; // { vocab, entries }
  var entries = []; // real entries only (example- excluded)
  var byId = {};
  var countdownEntryId = null; // 目前倒數區塊對應的條目 id，用於在列表列加註「倒數中」

  function t(key) {
    return UI[state.lang][key];
  }

  function bilingual(obj) {
    if (!obj) return "";
    return obj[state.lang] || "";
  }

  function prettify(str) {
    return String(str).replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);
    });
    return node;
  }

  // ---- 資料載入 ----

  function loadData() {
    var listEl = document.getElementById("entry-list");
    listEl.innerHTML = "";
    listEl.appendChild(el("p", { class: "empty-state", text: t("loading") }));

    fetch("data.json")
      .then(function (resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(function (json) {
        raw = json;
        entries = (json.entries || []).filter(function (e) {
          return e.id.indexOf("example-") !== 0;
        });
        byId = {};
        entries.forEach(function (e) { byId[e.id] = e; });
        buildFilterControls();
        renderAll();
      })
      .catch(function (err) {
        listEl.innerHTML = "";
        listEl.appendChild(el("p", { class: "error-state", role: "alert", text: t("errorState") + " (" + err.message + ")" }));
      });
  }

  // ---- 篩選控制項：法域／產品類別僅列出資料中實際出現的值 ----

  function usedJurisdictions() {
    var used = new Set();
    entries.forEach(function (e) {
      used.add(e.jurisdiction);
      (e.applies_in || []).forEach(function (a) { used.add(a); });
    });
    return used;
  }

  function usedTags() {
    var used = new Set();
    entries.forEach(function (e) {
      (e.product_tags || []).forEach(function (tag) { used.add(tag); });
      (e.component_tags || []).forEach(function (tag) { used.add(tag); });
    });
    return used;
  }

  function buildFilterControls() {
    var jurisdictionChips = document.getElementById("jurisdiction-chips");
    jurisdictionChips.innerHTML = "";
    var usedJ = usedJurisdictions();
    Object.keys(raw.vocab.jurisdictions || {}).forEach(function (code) {
      if (!usedJ.has(code)) return;
      jurisdictionChips.appendChild(makeChip(code, bilingual(raw.vocab.jurisdictions[code]), state.jurisdictions));
    });

    var tagChips = document.getElementById("tag-chips");
    tagChips.innerHTML = "";
    var allTags = Object.assign({}, raw.vocab.product_tags || {}, raw.vocab.component_tags || {});
    var usedT = usedTags();
    Object.keys(allTags).forEach(function (code) {
      if (!usedT.has(code)) return;
      tagChips.appendChild(makeChip(code, bilingual(allTags[code]), state.tags));
    });

    var statusChips = document.getElementById("status-chips");
    statusChips.innerHTML = "";
    STATUS_VALUES.forEach(function (code) {
      statusChips.appendChild(makeChip(code, t("status")[code], state.statuses));
    });

    var entryStatusChips = document.getElementById("entry-status-chips");
    entryStatusChips.innerHTML = "";
    ENTRY_STATUS_VALUES.forEach(function (code) {
      entryStatusChips.appendChild(makeChip(code, t("entryStatus")[code], state.entryStatuses));
    });
  }

  function makeChip(value, label, set) {
    var pressed = set.has(value);
    var btn = el("button", {
      class: "chip",
      type: "button",
      "aria-pressed": pressed ? "true" : "false",
      text: label
    });
    btn.addEventListener("click", function () {
      if (set.has(value)) set.delete(value); else set.add(value);
      buildFilterControls();
      renderAll();
    });
    return btn;
  }

  // ---- 篩選／排序邏輯（與呈現無關，維持不變）----

  function matchesFilters(e) {
    if (state.search) {
      var q = state.search.toLowerCase();
      var haystacks = [
        bilingual(e.short_name),
        e.citation || "",
        bilingual(e.product_scope)
      ].join(" ").toLowerCase();
      if (haystacks.indexOf(q) === -1) return false;
    }
    if (state.jurisdictions.size > 0) {
      var applies = e.applies_in || [];
      var hit = state.jurisdictions.has(e.jurisdiction) ||
        applies.some(function (a) { return state.jurisdictions.has(a); });
      if (!hit) return false;
    }
    if (state.tags.size > 0) {
      var entryTags = (e.product_tags || []).concat(e.component_tags || []);
      var tagHit = entryTags.some(function (tag) { return state.tags.has(tag); });
      if (!tagHit) return false;
    }
    if (state.statuses.size > 0 && !state.statuses.has(e.status)) return false;
    if (state.entryStatuses.size > 0 && !state.entryStatuses.has(e.entry_status)) return false;
    return true;
  }

  function effectiveDateValue(e) {
    var d = e.dates;
    if (!d) return null;
    var val = d.application || null;
    return val ? new Date(val).getTime() : null;
  }

  function verifiedDateValue(e) {
    return e.last_verified ? new Date(e.last_verified).getTime() : 0;
  }

  function sortKey(e) {
    if (state.sort === "verified") return -verifiedDateValue(e);
    var v = effectiveDateValue(e);
    return v === null ? Infinity : v;
  }

  function visibleTree() {
    var matchedIds = new Set(entries.filter(matchesFilters).map(function (e) { return e.id; }));
    var visibleIds = new Set(matchedIds);
    matchedIds.forEach(function (id) {
      var e = byId[id];
      if (e.parent && byId[e.parent]) visibleIds.add(e.parent);
    });

    var topLevel = entries.filter(function (e) { return !e.parent && visibleIds.has(e.id); });
    topLevel.sort(function (a, b) { return sortKey(a) - sortKey(b); });

    return topLevel.map(function (parentEntry) {
      var children = entries.filter(function (e) {
        return e.parent === parentEntry.id && visibleIds.has(e.id);
      });
      children.sort(function (a, b) { return sortKey(a) - sortKey(b); });
      return { entry: parentEntry, children: children };
    });
  }

  // ---- 渲染：整體 ----

  function renderAll() {
    renderHeaderControls();
    renderCountdown();
    renderFilterSummary();
    renderList();
  }

  function renderHeaderControls() {
    document.documentElement.lang = state.lang === "zh" ? "zh-Hant" : "en";

    var langBtn = document.getElementById("lang-toggle");
    langBtn.textContent = t("langToggleTo");
    langBtn.setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");

    var densityBtn = document.getElementById("density-toggle");
    densityBtn.textContent = state.density === "comfortable" ? t("densityCompact") : t("densityComfortable");
    densityBtn.setAttribute("aria-pressed", state.density === "compact" ? "true" : "false");
    document.body.classList.toggle("density-compact", state.density === "compact");

    document.querySelectorAll("[data-i18n]").forEach(function (node) {
      var key = node.getAttribute("data-i18n");
      if (UI[state.lang][key]) node.textContent = UI[state.lang][key];
    });

    document.getElementById("search-input").placeholder = t("searchLabel");
    document.getElementById("sort-select").options[0].textContent = t("sortByDate");
    document.getElementById("sort-select").options[1].textContent = t("sortByVerified");

    document.getElementById("footer-disclaimer").textContent = DISCLAIMER[state.lang];
    document.getElementById("footer-source-note").textContent =
      (state.lang === "zh" ? "來源檔案：" : "Source file: ") + DISCLAIMER_SOURCE;

    document.title = t("siteTitle") + " — " + t("siteSubtitle");
  }

  // ---- 倒數區塊：整頁唯一重點元素 ----

  function renderCountdown() {
    var hero = document.getElementById("countdown-hero");
    var now = Date.now();
    var soonest = null; // { entry, ts, dateStr }

    entries.forEach(function (e) {
      var d = e.dates;
      if (!d) return;
      var candidate = d.labelling || d.application;
      if (!candidate) return;
      var ts = new Date(candidate).getTime();
      if (ts > now && (soonest === null || ts < soonest.ts)) {
        soonest = { entry: e, ts: ts, dateStr: candidate };
      }
    });

    hero.innerHTML = "";
    if (soonest === null) {
      countdownEntryId = null;
      hero.classList.add("is-empty");
      hero.appendChild(el("span", { class: "cd-name", text: t("countdownNone") }));
      return;
    }

    countdownEntryId = soonest.entry.id;
    hero.classList.remove("is-empty");
    var days = Math.ceil((soonest.ts - now) / 86400000);

    hero.appendChild(el("span", { class: "cd-label", text: t("countdownPrefix") }));
    var daysLine = el("span", { class: "cd-days" });
    daysLine.appendChild(document.createTextNode(String(days)));
    daysLine.appendChild(el("span", { class: "unit", text: t("countdownDays") }));
    hero.appendChild(daysLine);
    hero.appendChild(el("span", { class: "cd-name", text: bilingual(soonest.entry.short_name) }));
    hero.appendChild(el("span", { class: "cd-date", text: soonest.dateStr }));
  }

  // ---- 篩選摘要（收合時顯示的一行摘要）----

  function renderFilterSummary() {
    var count = state.jurisdictions.size + state.tags.size + state.statuses.size +
      state.entryStatuses.size + (state.search ? 1 : 0);
    var summaryEl = document.getElementById("filter-summary-text");
    summaryEl.textContent = count > 0 ? t("filterSummaryActive")(count) : t("filterSummaryNone");
  }

  // ---- 渲染：列表 ----

  function renderList() {
    var listEl = document.getElementById("entry-list");
    listEl.innerHTML = "";
    var tree = visibleTree();

    document.getElementById("entry-count").textContent = t("entryCount")(
      tree.reduce(function (n, node) { return n + 1 + node.children.length; }, 0)
    );

    if (tree.length === 0) {
      listEl.appendChild(el("p", { class: "empty-state", text: t("emptyState") }));
      return;
    }

    tree.forEach(function (node) {
      listEl.appendChild(renderEntry(node.entry, false, null));
      node.children.forEach(function (child) {
        listEl.appendChild(renderEntry(child, true, node.entry));
      });
    });
  }

  // ---- 渲染：單一條目列 ----

  function buildMarkers(e) {
    var markers = [];
    if (e.id === countdownEntryId) {
      markers.push({ cls: "marker-countdown", text: t("countdownBadge") });
    }
    if (e.entry_status === "stub") {
      markers.push({ cls: "marker-stub", text: t("stubBadge") });
    }
    if (e.review_status === "pending") {
      markers.push({ cls: "marker-pending", text: t("pendingBadge") });
    }
    if (e.confidence === "low") {
      markers.push({ cls: "marker-low", text: t("confidenceLowBadge") });
    }
    return markers;
  }

  function renderEntry(e, isChild, parentEntry) {
    var details = el("details", { class: "entry-row" + (isChild ? " is-child" : ""), "data-id": e.id });

    var summary = el("summary", {});

    var jurisdictionInfo = raw.vocab.jurisdictions[e.jurisdiction] || {};
    var jurisCode = el("span", { class: "juris-code", text: e.jurisdiction });
    if (jurisdictionInfo.color) jurisCode.style.borderBottomColor = jurisdictionInfo.color;
    summary.appendChild(jurisCode);

    var nameWrap = el("span", { class: "row-name-wrap" });
    nameWrap.appendChild(el("span", { class: "row-name", text: bilingual(e.short_name) }));
    nameWrap.appendChild(el("span", { class: "row-citation", text: e.citation || "" }));
    if (isChild && parentEntry) {
      nameWrap.appendChild(el("span", { class: "row-parent-hint", text: t("parentHint")(bilingual(parentEntry.short_name)) }));
    }
    summary.appendChild(nameWrap);

    summary.appendChild(el("span", { class: "row-status-text", text: t("status")[e.status] || e.status || "" }));

    var markersWrap = el("span", { class: "row-markers" });
    var markers = buildMarkers(e);
    var shown = markers.slice(0, 3);
    var overflow = markers.length - shown.length;
    shown.forEach(function (m) {
      markersWrap.appendChild(el("span", { class: "marker " + m.cls, text: m.text }));
    });
    if (overflow > 0) {
      markersWrap.appendChild(el("span", { class: "marker marker-more", text: t("moreMarkers")(overflow) }));
    }
    markersWrap.appendChild(el("span", { class: "expand-marker", "aria-hidden": "true", text: "▸" }));
    summary.appendChild(markersWrap);

    details.appendChild(summary);
    details.appendChild(renderEntryBody(e));
    return details;
  }

  function renderEntryBody(e) {
    var body = el("div", { class: "entry-body" });

    // 基本資訊
    var basics = el("dl", { class: "kv-list" });
    appendKv(basics, t("citationLabel"), e.citation);
    appendKv(basics, t("localTypeLabel"), e.local_type);
    if (e.instrument_type) appendKv(basics, t("instrumentTypeLabel"), t("instrumentType")[e.instrument_type] || e.instrument_type);
    if (e.confidence === "medium") appendKv(basics, t("confidenceLabel"), t("confidence")[e.confidence]);
    body.appendChild(el("div", { class: "section" }, [basics]));

    // 適用範圍
    if (e.product_scope && bilingual(e.product_scope)) {
      body.appendChild(section(t("productScopeTitle"), [el("p", { text: bilingual(e.product_scope) })]));
    }

    // 產品／零組件類別
    var tags = (e.product_tags || []).concat(e.component_tags || []);
    if (tags.length > 0) {
      var tagWrap = el("div", { class: "tag-list" });
      tags.forEach(function (tagCode) {
        var info = (raw.vocab.product_tags && raw.vocab.product_tags[tagCode]) ||
          (raw.vocab.component_tags && raw.vocab.component_tags[tagCode]);
        tagWrap.appendChild(el("span", { class: "tag", text: info ? bilingual(info) : prettify(tagCode) }));
      });
      body.appendChild(section(t("tagsTitle"), [tagWrap]));
    }

    // 超國家層級：適用會員國
    if (e.applies_in && e.applies_in.length > 0) {
      var appliesWrap = el("div", { class: "tag-list" });
      e.applies_in.forEach(function (code) {
        var info = raw.vocab.jurisdictions[code];
        appliesWrap.appendChild(el("span", { class: "tag", text: info ? bilingual(info) : code }));
      });
      body.appendChild(section(t("appliesInTitle"), [appliesWrap]));
    }

    // 重要日期
    if (e.dates) {
      var dateRows = el("dl", { class: "kv-list" });
      var dateLabels = state.lang === "zh"
        ? { published: "發布日", application: "生效日", labelling: "標示日", transition_end: "過渡期截止日" }
        : { published: "Published", application: "Application", labelling: "Labelling", transition_end: "Transition end" };
      Object.keys(dateLabels).forEach(function (key) {
        if (e.dates[key]) appendKv(dateRows, dateLabels[key], e.dates[key]);
      });
      if (dateRows.children.length > 0) body.appendChild(section(t("datesTitle"), [dateRows]));
    }

    // 要求項
    if (e.requirements) {
      var reqRows = el("dl", { class: "kv-list" });
      ["marking", "local_representative", "local_testing", "registration"].forEach(function (key) {
        if (typeof e.requirements[key] === "boolean") {
          appendKv(reqRows, t("requirementFields")[key], e.requirements[key] ? t("yes") : t("no"));
        }
      });
      var reqBlock = [reqRows];
      if (e.requirements.conformity_assessment && e.requirements.conformity_assessment.length > 0) {
        var caWrap = el("div", { class: "tag-list" });
        e.requirements.conformity_assessment.forEach(function (code) {
          caWrap.appendChild(el("span", { class: "tag", text: t("conformity")[code] || code }));
        });
        reqBlock.push(caWrap);
      }
      if (e.requirements.conformity_assessment_note && bilingual(e.requirements.conformity_assessment_note)) {
        reqBlock.push(el("p", { text: bilingual(e.requirements.conformity_assessment_note) }));
      }
      body.appendChild(section(t("requirementsTitle"), reqBlock));
    }

    // 義務
    if (e.obligations && e.obligations.length > 0) {
      var obList = el("ul", { class: "plain-list" });
      e.obligations.forEach(function (ob) {
        var actorLabel = t("appliesTo")[ob.actor] || ob.actor;
        obList.appendChild(el("li", { text: actorLabel + "：" + bilingual(ob.action) }));
      });
      body.appendChild(section(t("obligationsTitle"), [obList]));
    }

    // 執法
    if (e.enforcement) {
      var enfRows = el("dl", { class: "kv-list" });
      if (e.enforcement.authority) appendKv(enfRows, state.lang === "zh" ? "主管機關" : "Authority", e.enforcement.authority);
      if (e.enforcement.penalty_basis) appendKv(enfRows, state.lang === "zh" ? "罰則依據" : "Penalty basis", t("penaltyBasis")[e.enforcement.penalty_basis]);
      if (e.enforcement.penalty_range) appendKv(enfRows, state.lang === "zh" ? "罰則範圍" : "Penalty range", e.enforcement.penalty_range);
      var enfBlock = [enfRows];
      if (e.enforcement.penalty_summary && bilingual(e.enforcement.penalty_summary)) {
        enfBlock.push(el("p", { text: bilingual(e.enforcement.penalty_summary) }));
      }
      if (e.enforcement.mechanism && e.enforcement.mechanism.length > 0) {
        var mechWrap = el("div", { class: "tag-list" });
        e.enforcement.mechanism.forEach(function (m) {
          mechWrap.appendChild(el("span", { class: "tag", text: prettify(m) }));
        });
        enfBlock.push(mechWrap);
      }
      body.appendChild(section(t("enforcementTitle"), enfBlock));
    }

    // 父子關係：下游條目
    var children = entries.filter(function (c) { return c.parent === e.id; });
    if (children.length > 0) {
      var childList = el("ul", { class: "plain-list" });
      children.forEach(function (c) {
        childList.appendChild(el("li", { text: bilingual(c.short_name) }));
      });
      body.appendChild(section(t("childrenTitle"), [childList]));
    }

    // 來源
    if (e.sources && e.sources.length > 0) {
      var srcList = el("ul", { class: "source-list" });
      e.sources.forEach(function (src) {
        var li = el("li", {});
        var link = el("a", { href: src.url, target: "_blank", rel: "noopener noreferrer", text: src.url });
        li.appendChild(link);
        if (src.publisher) li.appendChild(el("span", { text: " — " + src.publisher }));
        srcList.appendChild(li);
      });
      body.appendChild(section(t("sourcesTitle"), [srcList]));
    }

    // stub 提示與備註
    if (e.entry_status === "stub" && e.notes && bilingual(e.notes)) {
      body.appendChild(el("div", { class: "notice-box", text: bilingual(e.notes) }));
    } else if (e.notes && bilingual(e.notes)) {
      body.appendChild(section(t("notesTitle"), [el("p", { text: bilingual(e.notes) })]));
    }

    // 查核日期
    var verifyWrap = el("div", { class: "verify-dates" });
    verifyWrap.appendChild(makeVerifyDate(t("lastVerifiedLabel"), e.last_verified, t("lastVerifiedTip")));
    verifyWrap.appendChild(makeVerifyDate(t("lastReviewedLabel"), e.last_reviewed, t("lastReviewedTip")));
    body.appendChild(verifyWrap);

    return body;
  }

  function makeVerifyDate(label, value, tip) {
    var wrap = el("span", {});
    wrap.appendChild(document.createTextNode(label + "："));
    wrap.appendChild(el("strong", { text: value || "—" }));
    var btn = el("button", { type: "button", class: "info-btn", "aria-label": tip });
    btn.appendChild(el("span", { class: "tooltip", role: "tooltip", text: tip }));
    btn.appendChild(document.createTextNode("i"));
    wrap.appendChild(document.createTextNode(" "));
    wrap.appendChild(btn);
    return wrap;
  }

  function section(title, children) {
    var s = el("div", { class: "section" });
    s.appendChild(el("h3", { text: title }));
    children.forEach(function (c) { s.appendChild(c); });
    return s;
  }

  function appendKv(dl, key, value) {
    dl.appendChild(el("dt", { text: key }));
    dl.appendChild(el("dd", { text: value }));
  }

  // ---- 事件綁定 ----

  document.getElementById("lang-toggle").addEventListener("click", function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    buildFilterControls();
    renderAll();
  });

  document.getElementById("density-toggle").addEventListener("click", function () {
    state.density = state.density === "comfortable" ? "compact" : "comfortable";
    renderAll();
  });

  document.getElementById("search-input").addEventListener("input", function (evt) {
    state.search = evt.target.value.trim();
    renderFilterSummary();
    renderList();
  });

  document.getElementById("sort-select").addEventListener("change", function (evt) {
    state.sort = evt.target.value;
    renderList();
  });

  window.addEventListener("beforeprint", function () {
    document.querySelectorAll("details.entry-row").forEach(function (d) { d.open = true; });
    document.getElementById("filter-panel").open = false;
  });

  loadData();
})();
</script>
</body>
</html>
