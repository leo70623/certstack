# ============================================================================
# CertStack tracker schema
# Schema 版本：v1.6（2026-09-13）— 新增 entry_status（stub／complete），
# 用以區分「已確認法規存在但欄位尚未齊備」與「全部必填欄位均已填寫」
# 兩種條目狀態。stub 條目僅檢查最小欄位集（見下方 entry_status
# 欄位定義），其餘欄位可省略或留空；complete 條目維持現行全欄位檢查。
# 新增此狀態的原因：部分法域（如阿聯、沙烏地、中國）的官方來源
# 無法自動擷取或需付費取得，若無中間狀態，將被迫在「為通過驗證而
# 降低資料標準」與「放棄建檔」之間二選一。
# v1.5（2026-09-13）— 釐清 *_or_null 型別中，
# `required` 判斷的是 key 是否必須存在，而非值是否可以為 null；
# 修正 validate.py 先前將必填 *_or_null 欄位中「key 存在但值為 null」
# 誤判為缺漏欄位的問題。
# v1.4（2026-09-13）— requirements.conformity_assessment
# 改為 enum 值的 list（至少 1 項），取代單一 enum 值，
# 用以表達依風險分級／類別採不同程序的法規；新增
# requirements.conformity_assessment_note。移除 sdoc_or_certification
# （改以 [sdoc, third_party] 表達）。
# v1.3（2026-09-13）— 新增 review_status，用以區分
# 自動擷取的欄位值與已人工對照來源逐字查核過的欄位值。
# v1.2（2026-09-13）— 新增超國家層級 jurisdiction 支援（GCC），
# 以及透過 applies_in 表達的會員國 jurisdiction（KW、QA、BH、OM）。
#
# id 命名規則（新增／編輯條目前請先閱讀）：
#   id 同時作為：檔案內的鍵值、URL 路徑片段，以及
#   parent／related／superseded_by 所使用的參照鍵。條目一旦發布，
#   id 絕不可變更。
#
#   格式（擇一）：
#     有官方編號時       <jurisdiction小寫>-<年份>-<編號>
#                        例如 eu-2025-1960
#     有標準編號時       <jurisdiction小寫>-<標準編號>
#                        例如 cn-gb-4943-1-2022
#     無任何編號時       <jurisdiction小寫>-<主題關鍵字>
#                        例如 sa-saber-registration
#
#   僅限小寫，字元限 a-z、0-9 與連字號。
#
#   法規被取代時：開立一筆「新」條目並給予新的 id。舊條目的
#   status 改為 "superseded"，並填入 superseded_by。舊條目的
#   URL 永久保留，不得刪除。
#
# 雙語規則：
#   雙語欄位（en 與 zh 皆為必填）：
#     short_name、product_scope、obligations[].action、
#     enforcement.penalty_summary、notes
#   單語欄位（維持原文，不翻譯）：
#     id、citation、local_type、jurisdiction、所有 enum、日期、
#     布林值、url
#   citation 一律使用該 jurisdiction 官方原文。
#
# required 與 nullable 的區別（*_or_null 型別）：
#   `required` 判斷的是該條目中「key」是否必須存在，而非其值是否
#   可以為 null。對於型別為 date_or_null、string_or_null、
#   int_or_null 或 bilingual_or_null，且 required: true 的欄位，
#   key 必須存在，但其值可以合法地為 null：
#     - key 存在，值為 null   -> 合法。代表「已查核過，該法規
#       確實沒有此項內容」（例如本法規並無公布日期）。
#     - key 整個省略           -> 不合法，一律視為錯誤。代表
#       「尚未查核／填寫」，對必填欄位而言永遠不是可接受的最終狀態。
#   對於非 `_or_null` 的必填型別（date、string、bool、enum、
#   bilingual 等），值為 null 一律視為錯誤，效果等同於省略該 key。
# ============================================================================

id:
  type: string
  required: true
  unique: true
  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

parent:
  type: string_or_null
  required: true
  default: null

superseded_by:
  type: string_or_null
  default: null

jurisdiction:
  type: enum
  values: [EU, UK, US, CN, KR, JP, SA, AE, ZA, GCC, KW, QA, BH, OM, GLOBAL]
  # GCC 為超國家層級（波斯灣合作理事會）。KW/QA/BH/OM 為會員國，
  # 目前不作為獨立追蹤的 jurisdiction，但須可作為
  # GCC/EU 條目的 applies_in 值使用。
  # GLOBAL 用於非特定法域的國際自願性互認制度（例如 IEC/IECEE CB Scheme），
  # 不代表任何國家或區域的強制性法規。

applies_in:
  type: list_of_enum
  required: false
  default: []
  values: 與 jurisdiction 相同的國家代碼，但不含 GCC 與 EU
  # 僅在超國家層級法規（jurisdiction 為 GCC 或 EU）時填寫：
  # 列出該法規實際適用的會員國。單一國家法規請留空。

citation:
  type: string
  required: true

local_type:
  type: string
  required: true

instrument_type:
  type: enum
  values: [regulation, directive, mandatory_standard, administrative_measure, guidance, statute]

short_name:
  type: bilingual
  required: true

category:
  type: list_of_string
  default: []

product_scope:
  type: bilingual
  required: true

product_tags:
  type: list_of_enum
  required: true
  min_items: 1
  source: vocab.product_tags

component_tags:
  type: list_of_enum
  default: []
  source: vocab.component_tags

applies_to:
  type: list_of_enum
  values: [producer, seller, importer, manufacturer]

status:
  type: enum
  values: [draft, adopted, in_force, superseded, withdrawn]

dates.published:
  type: date_or_null
  required: true

dates.application:
  type: date_or_null
  required: true

dates.labelling:
  type: date_or_null
  default: null

dates.transition_end:
  type: date_or_null
  default: null

requirements.marking:
  type: bool
  required: true

requirements.local_representative:
  type: bool
  required: true

requirements.local_testing:
  type: bool
  required: true
  # 嚴格定義為：測試報告必須由位於該 jurisdiction 自身境內的
  # 實驗室出具。若接受國際認證實驗室（如 ILAC、IECEE CB）出具的
  # 報告，此欄位一律為 false——僅「須有測試報告」不足以將此欄位設為 true。

requirements.registration:
  type: bool
  required: true

requirements.conformity_assessment:
  type: list_of_enum
  required: true
  min_items: 1
  values: [none, sdoc, ccc, type_approval, third_party]
  # 多個值代表該法規依產品風險分級或類別規定不同程序（例如低風險
  # 產品走自我聲明、高風險產品須經第三方驗證）。僅採單一統一程序
  # 的法規則填入單一元素的 list。

requirements.conformity_assessment_note:
  type: bilingual_or_null
  required: false
  default: null
  # 當 conformity_assessment 有一項以上的值時為必填：
  # 說明各程序分別適用於何種條件。

obligations:
  type: list_of_object
  min_items: 1
  fields:
    actor:
      type: enum
      values: [producer, seller, importer, manufacturer]
    action:
      type: bilingual
      required: true

tools:
  type: list_of_string
  default: []

related:
  type: list_of_string
  default: []

sources:
  type: list_of_object
  min_items: 1
  fields:
    url:
      type: url
      required: true
    type:
      type: enum
      values: [primary, secondary]
    publisher:
      type: string
      required: true

enforcement.authority:
  type: string
  required: true

enforcement.mechanism:
  type: list_of_string
  required: true

enforcement.penalty_basis:
  type: enum
  values: [in_instrument, national_law, none_specified]

enforcement.penalty_summary:
  type: bilingual
  required: true

enforcement.penalty_range:
  type: string_or_null
  default: null
  # 注意：僅在法規原文明確指定單一固定金額時才填寫，
  # 不得從其他來源估算或彙整。

enforcement.market_impact:
  type: list_of_string
  default: []

enforcement.source_ref:
  type: int_or_null
  default: null

enforcement.last_verified:
  type: date
  required: true

monitoring.tier:
  type: enum
  values: [A, B, C]

monitoring.method:
  type: enum
  values: [rss, api, page_diff, manual]

monitoring.endpoint:
  type: string_or_null
  default: null

monitoring.frequency:
  type: enum
  values: [daily, weekly, quarterly]

last_verified:
  type: date
  required: true
  # 淺層查核：連結可連通、狀態未變更。

last_reviewed:
  type: date
  required: true
  # 深度查核：目前內容已逐字對照來源核實。

entry_status:
  type: enum
  values: [stub, complete]
  required: true
  default: stub
  # stub     = 已確認該法規存在，但欄位尚未齊備。
  #            常見於官方來源無法擷取或需付費取得的法域。
  # complete = 全部必填欄位均已填寫。
  # entry_status 為 stub 時，僅檢查下列最小欄位集，其餘欄位可
  # 省略或留空，但仍須有至少一個一手來源（sources）：
  #   id、parent、superseded_by、jurisdiction、applies_in、
  #   citation、local_type、instrument_type、short_name、
  #   status、sources、entry_status、review_status、
  #   confidence、last_verified、last_reviewed、notes
  # entry_status 為 stub 時，confidence 不得為 high；
  # notes 為必填，且須說明哪些資訊缺漏、缺漏原因為何。
  #
  # 上述最小欄位集是 stub 條目的「必填下限」，不是「允許填寫的
  # 上限」。任何已查證的欄位都應保留，不得因為條目為 stub 而刪除。
  # stub 與 complete 的差別只在於「哪些欄位必填」，不影響任何欄位
  # 是否可以填寫；已填寫的非最小欄位集欄位，仍會依其型別／enum／
  # 參照規則正常檢查。

review_status:
  type: enum
  values: [pending, reviewed]
  required: true
  default: pending
  # pending  = 欄位值由自動化擷取產生，尚未經人工逐字對照
  #            官方來源文字查核。
  # reviewed = 已由人工逐字對照官方來源文字查核過欄位值。
  # 當 review_status 為 pending 時，last_reviewed 日期僅代表
  # 擷取日期，並非人工複核日期。

confidence:
  type: enum
  values: [high, medium, low]

notes:
  type: bilingual_or_null
  default: null
