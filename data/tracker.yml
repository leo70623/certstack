  citation: "GB 4943.1-2022《音视频、信息技术和通信技术设备 第1部分：安全要求》"
  local_type: "強制性國家標準"
  instrument_type: mandatory_standard
  short_name:
    en: "GB 4943.1-2022 — Audio/Video, Information Technology and Communication Technology Equipment — Part 1: Safety Requirements"
    zh: "GB 4943.1-2022 音視訊、資訊技術和通訊技術設備 第1部分：安全要求"

  product_scope:
    en: "Establishes safety requirements for audio/video, information technology, and communication technology equipment, consolidating the previously separate GB 4943.1-2011 (information technology equipment) and GB 8898-2011 (audio/video and similar electronic equipment) standards into a single unified safety framework. It is a modified national adoption of the international standard IEC 62368-1:2018."
    zh: "為音視訊、資訊技術及通訊技術設備訂定安全要求，將原分別適用之GB 4943.1-2011（資訊技術設備）與GB 8898-2011（音視訊及類似電子設備）整合為單一統一之安全架構。為國際標準IEC 62368-1:2018之修改採用（modified adoption）。"
