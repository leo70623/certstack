  notes:
    en: "Added at the user's request as the next item in the RoHS→GPSR→WEEE→Battery Regulation→Cyber Resilience Act batch, identified as a gap: WEEE is the extended-producer-responsibility counterpart to RoHS (both originally adopted together in 2003, recast in parallel in 2011-2012) and imposes collection/treatment/financing obligations rather than substance restrictions. Researched via the UK National Archives' retained-EU-law mirror (legislation.gov.uk/eudr/2012/19), article-by-article (Arts. 2, 5, 12, 14, 16, 22, 24 directly fetched and quoted), since EUR-Lex's plain HTML CELEX page for this particular Directive was not attempted this session (the retained-law mirror sufficed and is the same technique successfully used for RoHS); the OJ citation (L 197, 24.7.2012, pp. 38-71) was independently cross-verified via web search rather than relying on the mirror alone. requirements.conformity_assessment is set to [none] because WEEE, like GPSR and unlike RED/EMC/RoHS, has no CE-marking/declaration-of-conformity structure at all — it is a waste-management/extended-producer-responsibility regime centred on collection targets, financing guarantees and registration, not a product conformity-assessment regime; requirements.marking is nonetheless true because Art. 14(4) does mandate the crossed-out-wheeled-bin symbol (distinct from CE marking). requirements.registration is true based on the mandatory national producer-register obligation of Art. 16, which is explicitly per-Member-State (not EU-wide/centralised like ESPR's Digital Product Passport registry), consistent with a 'true' local_representative-adjacent registration reading, though requirements.local_representative itself is recorded as false because Art. 16 allows registration either directly or via an authorised representative — appointing one is a choice, not a standalone mandatory obligation (same convention as RoHS Art. 8 and GPSR Art. 10). The importer obligation is inferred from the Directive's 'producer' definition (Art. 3(1)(f), which extends to any person placing EEE on the market by any selling technique) combined with the Art. 16 registration duty, rather than from an article that names 'importer' verbatim — this inference should be checked against the primary text in human review. Confidence raised to medium under the schema's rule (entry_status complete, primary-source-traced fields, OJ citation independently cross-verified). NOT yet independently human-reviewed: the exact current consolidated text (this Directive has been amended multiple times, most recently by Directive (EU) 2024/884, not reviewed this session), the detailed Annex X Part A information list, and the collection/recovery/recycling target percentages in Annex V-VIII which are not modelled in this schema and were not transcribed."
    zh: "本條目係依你之要求，作為RoHS→GPSR→WEEE→電池法規→網路韌性法案批次之下一項新增，經辨識為缺口：WEEE為RoHS之延伸生產者責任對應法規（兩者最初於2003年同時通過，並於2011-2012年並行改編為recast版本），其課予之義務為收集／處理／財務保障，而非物質限制。本條目係逐條查考英國國家檔案館之歐盟保留法鏡像網站（legislation.gov.uk/eudr/2012/19），直接擷取並引用第2、5、12、14、16、22、24條；本次工作階段並未嘗試擷取本指令之EUR-Lex純HTML CELEX頁面（此保留法鏡像已足夠，且與RoHS成功採用之技術相同）；官方公報引用資訊（OJ L 197, 24.7.2012, pp. 38-71）已透過網路搜尋獨立交叉驗證，而非僅依賴鏡像網站。requirements.conformity_assessment設為[none]，係因WEEE與GPSR相同、與RED／EMC／RoHS不同，完全無CE標誌／符合性聲明架構——其性質為以收集目標、財務保障及登記為核心之廢棄物管理／延伸生產者責任制度，而非產品符合性評鑑制度；惟requirements.marking仍為true，因第14(4)條確實要求標示打叉輪式垃圾桶符號（與CE標誌不同）。requirements.registration為true，係依第16條強制性之各國生產者登記義務——該義務明確以各會員國為單位（不同於ESPR數位產品護照登記系統之歐盟層級集中登記），惟requirements.local_representative本身記為false，因第16條容許直接登記或透過授權代表登記——指定授權代表為一項選擇，而非獨立之強制義務（與RoHS第8條、GPSR第10條採相同慣例）。進口商義務項目係依本指令「生產者」定義（第3(1)(f)條，擴及以任何銷售方式將EEE投放市場之任何人）並結合第16條登記義務推論而得，而非依某條文逐字指名「進口商」——此推論應於人工複核時對照原文查核。依schema規則，把握度提升為medium（entry_status為complete、欄位均可追溯一手來源、OJ引用已獨立交叉驗證）。尚未經人工獨立複核：現行合併版本確切文字（本指令歷經多次修訂，最近一次為(EU) 2024/884號指令，本次工作階段未查核）、附件X A部分詳細資訊清單，以及附件V至VIII之收集／回收／再利用目標百分比——本schema並未建模，本次亦未轉錄。"

- id: eu-2023-1542-battery
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EU) 2023/1542 of the European Parliament and of the Council of 12 July 2023 concerning batteries and waste batteries (OJ L 191, 28.7.2023, p. 1-117)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "EU Battery Regulation"
    zh: "歐盟電池法規"
  category:
    - waste_management
    - extended_producer_responsibility
    - due_diligence
    - hazardous_substances

  product_scope:
    en: "Applies to all categories of batteries placed on the market or put into service in the Union, regardless of their origin or whether or not they are incorporated into other products, including: portable batteries (general-use, e.g. consumer electronics, incl. portable batteries incorporated into appliances), LMT batteries (light means of transport, e.g. e-bikes/e-scooters), electric vehicle (EV) batteries, industrial batteries (including those exceeding 2 kWh), SLI batteries (starting, lighting, ignition — mainly automotive), and batteries for stationary battery energy storage systems (Art. 1, Art. 2, Art. 3). Batteries already placed in stock before the relevant requirement's date of application are, in general, unaffected by that specific requirement (Art. 2(2))."
    zh: "適用於投放歐盟市場或投入使用之所有電池類別，不論其產地或是否已併入其他產品，涵蓋：可攜式電池（一般用途，例如消費性電子產品，含併入電器之可攜式電池）、輕型交通工具電池（LMT，例如電動自行車／電動滑板車）、電動車（EV）電池、工業用電池（含容量超過2 kWh者）、SLI電池（啟動、照明、點火——主要為汽車用），以及固定式電池儲能系統用電池（第1、2、3條）。已於相關要求適用日期前投入庫存之電池，原則上不受該特定要求影響（第2(2)條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
  component_tags:
    - battery
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2023-07-28"
    application: "2024-02-18"
    labelling: null
    transition_end: null

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: true
    conformity_assessment: [sdoc, third_party]
    conformity_assessment_note:
      en: "Art. 17 and Chapter VI (applicable generally from 2024-08-18) require conformity assessment via the modules of Decision No 768/2008/EC before CE marking is affixed (Art. 53); for most battery categories manufacturers self-certify via internal production control (module A-type, self-declaration), but for certain higher-risk requirements (e.g. safety of stationary battery energy storage systems, and other requirements the Commission may designate) assessment must involve a notified conformity assessment body (third-party) per Art. 52. Which module applies depends on the specific requirement and battery category and is set out in Annex VIII, not fully reproduced here."
      zh: "第17條及第六章（一般自2024-08-18起適用）要求於張貼CE標誌前，依決定768/2008/EC所定模組進行符合性評鑑（第53條）；就多數電池類別，製造商透過內部生產管制（模組A類，自我聲明）方式自行驗證，惟就特定較高風險要求（例如固定式電池儲能系統之安全性，及執委會得指定之其他要求），依第52條須有公告符合性評鑑機構（第三方）參與評鑑。適用之模組依具體要求及電池類別而定，詳見附件VIII，本條目未全文轉錄。"

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure batteries are designed and manufactured to comply with the sustainability, safety, labelling and information requirements of Chapters II-III (carbon footprint declarations for EV/LMT/industrial batteries >2 kWh per Art. 7; supply-chain due diligence for cobalt, lithium, nickel and natural graphite per Art. 8); carry out the applicable conformity assessment procedure and draw up an EU declaration of conformity before affixing CE marking; provide sufficiently detailed information on the intended use of the battery to allow its correct and safe placing on the market, use and waste management; keep technical documentation and the declaration of conformity available for market surveillance authorities; indicate name, registered trade name/mark and contact details (postal address, electronic address, website) on the battery or, where not possible, in accompanying documentation; and where a manufacturer considers or has reason to believe a battery is not in conformity, take immediate corrective action and inform the relevant authorities (Art. 38)."
        zh: "確保電池之設計及製造符合第二、三章之永續性、安全性、標示及資訊要求（依第7條就容量逾2 kWh之電動車／輕型交通工具／工業用電池提出碳足跡聲明；依第8條就鈷、鋰、鎳及天然石墨進行供應鏈盡職調查）；執行適用之符合性評鑑程序，並於張貼CE標誌前製作歐盟符合性聲明；提供充分詳細之預期用途資訊，以利電池正確且安全地投放市場、使用及廢棄物管理；保存技術文件及符合性聲明供市場監督機關取用；於電池上標示名稱、註冊商號／商標及聯絡資訊（郵政地址、電子地址、網站），若無法標示則於隨附文件載明；如製造商認為或有理由相信電池不合規，應立即採取矯正措施並告知相關主管機關（第38條）。"
    - actor: importer
      action:
        en: "Before placing a battery on the market, verify that the manufacturer has carried out the appropriate conformity assessment procedure, drawn up the technical documentation, affixed CE marking, and complied with the identification/contact-information obligations of Art. 38; indicate the importer's own name, registered trade name/mark and postal, and (if available) email and website address on the battery or, where the battery is too small, in accompanying documentation; ensure that transport, storage or handling conditions do not jeopardise compliance; where an importer considers or has reason to believe a battery is not in conformity, not place it on the market until brought into conformity and inform the manufacturer and market surveillance authorities; and keep a copy of the declaration of conformity available to authorities (Art. 42)."
        zh: "於將電池投放市場前，查核製造商已執行適用之符合性評鑑程序、編製技術文件、張貼CE標誌，並已履行第38條之識別／聯絡資訊義務；於電池上標示自身名稱、註冊商號／商標及郵政地址（如有，含電子地址及網站），如電池過小則於隨附文件載明；確保運輸、儲存或處理條件不致危及合規性；如進口商認為或有理由相信電池不合規，於導正合規前不得投放市場，並通知製造商及市場監督機關；並保存符合性聲明副本供主管機關取用（第42條）。"
    - actor: seller
      action:
        en: "Before making a battery available on the market, act with due care to verify that it bears CE marking and required labelling/information, and that the manufacturer and importer have complied with their respective identification obligations; ensure that its own handling of the battery (e.g. storage, transport conditions) does not adversely affect its compliance with the Regulation's requirements; where a distributor considers or has reason to believe a battery is not in conformity, not make it available until brought into conformity, and where the battery presents a risk, inform the manufacturer or importer and the relevant market surveillance authorities; and cooperate with market surveillance authorities, on request, on action taken to eliminate non-compliance (Art. 44)."
        zh: "於使電池可於市場上取得前，應本於注意義務查核其已張貼CE標誌及所需標示／資訊，且製造商與進口商已履行各自之識別義務；確保其對電池之處理方式（例如儲存、運輸條件）不致對本法規要求之合規性造成不利影響；如經銷商認為或有理由相信電池不合規，於導正合規前不得使其可於市場上取得，且如電池具有風險，應通知製造商或進口商及相關市場監督機關；並依請求配合市場監督機關就消除不合規所採取之行動（第44條）。"

