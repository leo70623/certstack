      publisher: "reachonline.eu (consolidated, article-by-article reference text of REACH, used to retrieve specific articles — e.g. Art. 126 — that had been omitted from the UK retained-law mirror following UK Exit amendments)"

  enforcement:
    authority: "National competent authorities designated by each EU Member State, coordinated at EU level by the European Chemicals Agency (ECHA)"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States lay down the provisions on penalties applicable for infringement of this Regulation and must take all measures necessary to ensure they are implemented; the penalties provided for must be effective, proportionate and dissuasive. Member States were required to notify those provisions to the Commission no later than 1 December 2008 and to notify without delay any subsequent amendment affecting them (Art. 126)."
      zh: "會員國訂定違反本法規之罰則規定，並應採取一切必要措施確保其執行；所定罰則須具有效性、比例性及嚇阻性。會員國須至遲於2008年12月1日前將該等規定通知執委會，並就其後之任何修訂立即通知（第126條）。"
    penalty_range: null
    market_impact: []
    source_ref: 0
    last_verified: "2026-09-26"

  monitoring:
    tier: B
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: complete
  last_verified: "2026-09-26"
  last_reviewed: "2026-09-26"
  review_status: pending
  confidence: medium
  notes:
    en: "Added at the user's request as the first item in a new EU-environmental-regulation batch (REACH→EUDR→Single-Use Plastics Directive→F-Gas Regulation→CLP Regulation), identified as a gap: REACH is arguably the single most consequential horizontal EU chemicals regime for any consumer-electronics supply chain (it underlies SVHC/Art. 33 declarations that most electronics manufacturers already handle in parallel with RoHS, but covers a vastly larger universe of substances than RoHS's fixed list of 10). Researched primarily via the UK National Archives' retained-EU-law mirror (legislation.gov.uk/eur/2006/1907), article-by-article (Arts. 1, 2, 5, 6, 56, 67 directly fetched and quoted), since EUR-Lex's own CELEX HTML pages for this Regulation returned 404/empty this session (both the base CELEX:32006R1907 URI and a consolidated-version URI were tried and failed). One article (Art. 126, Penalties) had been physically omitted from the UK mirror by post-Brexit UK Exit amendment regulations (the UK now operates its own separate 'UK REACH' regime), so its verbatim text was instead retrieved from reachonline.eu, a secondary reference site openly presenting itself as an official-text mirror, and cross-checked against a web search snippet quoting the same wording verbatim — the two independent sources agree exactly. requirements.marking is false and conformity_assessment is [none] because REACH, unlike RED/EMC/RoHS/CRA, has no CE-marking or declaration-of-conformity structure at all — its enforcement mechanism is registration-with-ECHA, an EU-level authorisation list (Annex XIV) and an EU-level restriction list (Annex XVII), plus the Art. 33 supply-chain information-communication duty (which is a disclosure obligation, not a certification). requirements.registration is true based on the Art. 6 core registration duty. requirements.local_representative is false because Art. 8's 'Only Representative' mechanism, allowing a non-EU manufacturer to appoint an EU-based OR to fulfil the importer's registration duties, is optional — the underlying registration obligation falls on whichever EU-established entity (the importer, if no OR is appointed) brings the substance into the EU, following the same convention applied to RoHS Art. 8 and GPSR Art. 10. component_tags is populated with power_supply/cable_connector/battery as illustrative examples of components where REACH SVHC declarations are most commonly encountered in electronics compliance practice, though REACH's substance-based scope in principle touches nearly every component category; product_tags is set to the single broadest value, all_b2c_goods, reflecting REACH's genuinely horizontal, non-sector-specific scope (unlike RoHS/WEEE which are EEE-specific). Confidence raised to medium under the schema's rule (entry_status complete, primary-source-traced fields for all articles except Art. 126, which was independently cross-verified via a second source). NOT yet independently human-reviewed: the full Annex XIV (authorisation list) and Annex XVII (restriction list) entries are not reproduced or summarised here (they run to hundreds of substances and are amended frequently by delegated/implementing regulations, which would need their own tracking mechanism rather than being captured in this single entry); the phased application dates of Art. 141 beyond the two headline dates (2007-06-01 entry into force, used as dates.application; 2008-06-01 general Title applicability partially folded into dates.application for simplicity; 2009-06-01 Title VIII/Annex XVII applicability, recorded as dates.transition_end) are simplified from a more granular multi-date schedule in the primary text."
    zh: "本條目係依你之要求，作為新一批歐盟環保法規（REACH→EUDR→一次性塑膠指令→氟化氣體法規→CLP法規）之首項新增，經辨識為缺口：REACH可謂對任何消費性電子供應鏈而言，衝擊最大之單一歐盟橫向化學品法規（其為多數電子製造商已與RoHS並行處理之SVHC／第33條聲明之基礎，惟其涵蓋物質範圍遠大於RoHS固定之10項物質清單）。本條目主要透過查考英國國家檔案館之歐盟保留法鏡像網站（legislation.gov.uk/eur/2006/1907），逐條擷取並引用第1、2、5、6、56、67條；本次工作階段EUR-Lex本身之CELEX HTML頁面就本法規均回傳404或空白內容（曾嘗試基本CELEX:32006R1907網址及合併版本網址，均失敗）。其中第126條（罰則）因英國脫歐後修訂法規而自英國鏡像網站中實質移除（英國現已改行獨立之「UK REACH」制度），故其逐字文字改由reachonline.eu——一個公開自我定位為官方文字鏡像之次要參考網站——取得，並與網路搜尋摘錄之相同逐字文字交叉核對——兩獨立來源完全一致。requirements.marking設為false、conformity_assessment設為[none]，係因REACH與RED／EMC／RoHS／CRA不同，完全無CE標誌或符合性聲明架構——其執行機制為向ECHA登記、歐盟層級授權清單（附件XIV）及歐盟層級限制清單（附件XVII），另加第33條供應鏈資訊揭露義務（此為揭露義務，非驗證制度）。requirements.registration為true，係依第6條核心登記義務。requirements.local_representative為false，因第8條「唯一代表」（OR）機制——容許非歐盟製造商指定歐盟境內OR代為履行進口商登記義務——為選擇性安排，基礎登記義務仍落於實際將物質引進歐盟之歐盟境內實體（如未指定OR則為進口商），與RoHS第8條、GPSR第10條採相同慣例。component_tags填入power_supply／cable_connector／battery作為電子產業合規實務中最常遇到REACH SVHC聲明之元件類別例示，惟REACH以物質為核心之適用範圍原則上幾乎觸及所有元件類別；product_tags設為範圍最廣之單一值all_b2c_goods，反映REACH真正橫向、非特定產業別之適用範圍（有別於RoHS／WEEE僅限EEE）。依schema規則，把握度提升為medium（entry_status為complete，除第126條外之所有條文均可追溯一手來源，第126條則已以第二來源獨立交叉驗證）。尚未經人工獨立複核：附件XIV（授權清單）及附件XVII（限制清單）之完整項目本條目並未轉錄或摘要（其涵蓋數百種物質，且經常由授權／執行法規修訂，應有獨立追蹤機制，而非收錄於單一條目中）；第141條除兩項重要日期外（2007-06-01生效日，採為dates.application；2008-06-01各編一般適用日為簡化計併入dates.application；2009-06-01第VIII編／附件XVII適用日，記為dates.transition_end）之更細緻多階段生效時程，本條目已予簡化。"

