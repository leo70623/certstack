  confidence: medium
  notes:
    en: "Added at the user's request as the final item in the RoHS→GPSR→WEEE→Battery Regulation→Cyber Resilience Act batch, identified as a gap: the CRA is the first horizontal, mandatory EU cybersecurity regulation applicable to essentially all consumer/IT/radio products with digital elements (distinct from RED's Art. 3(3)(d)-(f) delegated-act cybersecurity requirements, which apply only to radio equipment specifically, and from EN 18031, which is a harmonised standard supporting RED — see 'related'). Status is recorded as 'adopted' rather than 'in_force' because, although the Regulation formally entered into force in December 2024, its substantive essential-cybersecurity-requirement obligations (the ones modelled in this entry's requirements/obligations blocks) do not become legally enforceable until 2027-12-11 (used as dates.application), with only narrower reporting (Art. 14, from 2026-09-11) and conformity-assessment-body (Chapter IV, from 2026-06-11) provisions applying earlier (Art. 71). IMPORTANT SOURCING CAVEAT: this session, direct EUR-Lex fetches of this Regulation's own OJ/CELEX HTML pages (both the 'OJ:L_202402847' and 'CELEX:32024R2847' URI forms) consistently returned blank/empty content, unlike RoHS (legislation.gov.uk mirror) or GPSR/Battery Regulation (EUR-Lex itself worked for those). As a workaround, verbatim article text for Arts. 2 (scope), 13 (manufacturer), 19 (importer), 20 (distributor), and 64 (penalties) was instead sourced from craact.eu, a third-party compliance-reference site that publishes what it represents as a verbatim, article-by-article mirror of the official Regulation text; this was cross-checked for consistency across multiple articles (e.g. Art. 19's cross-references to Art. 13(15)/(16)/(19) and Art. 20's cross-references to Art. 13/19 track exactly as expected for a genuine mirror) and the OJ citation/key dates (entry into force, 2027-12-11 general application, 2026-09-11 Art. 14 date, 2026-06-11 Chapter IV date) were independently corroborated via web search against law-firm and EFTA secondary sources — but because the primary EUR-Lex text itself could not be directly fetched, this entry is sourced one step further removed from the official primary text than the other 4 entries in this batch, and should be prioritised for direct EUR-Lex/print-Official-Journal verification in a future human review pass. requirements.registration is false because the CRA has no EU/national product-registration requirement analogous to WEEE/Battery Regulation's producer registers (there is, however, an ENISA vulnerability-database notification duty under Art. 14, not modelled as 'registration' in this schema). monitoring.tier is set to A (rather than B/C used for the other entries in this batch) given the CRA's unusually high compliance stakes (fines up to 2.5% of global turnover) and the fact that its core obligations are still phasing in through 2027, making near-term monitoring of implementing/delegated acts and harmonised standards disproportionately important. Confidence is nonetheless kept at medium, not downgraded to low, because entry_status is complete and the fields are traced to a consistent, cross-verified source, even though that source is one step removed from EUR-Lex itself — this differs from the us-fcc-part-15 case (which was reverted to stub/low) in that here the missing link is the primary-source mirror's reliability, not missing/unconfirmed underlying facts."
    zh: "本條目係依你之要求，作為RoHS→GPSR→WEEE→電池法規→網路韌性法案批次之最終項目新增，經辨識為缺口：CRA為首部適用於幾乎所有內含數位元件之消費性／資訊技術／無線電產品之橫向強制性歐盟網路安全法規（有別於RED第3(3)(d)-(f)條僅適用於無線電設備之授權法案網路安全要求，亦有別於支援RED之協和標準EN 18031——參見related欄位）。status記為「adopted」而非「in_force」，係因本法規雖已於2024年12月正式生效，惟其實質基本網路安全要求義務（即本條目requirements／obligations區塊所建模者）須至2027-12-11起始具法律執行力（採為dates.application），僅較狹隘之通報義務（第14條，自2026-09-11起）及符合性評鑑機構規定（第四章，自2026-06-11起）較早適用（第71條）。重要來源說明：本次工作階段，直接擷取本法規自身之EUR-Lex OJ／CELEX HTML頁面（「OJ:L_202402847」及「CELEX:32024R2847」兩種URI格式）均一致回傳空白內容，與本批次之RoHS（採legislation.gov.uk鏡像）或GPSR／電池法規（EUR-Lex本身可擷取）不同。作為替代方案，第2條（適用範圍）、第13條（製造商）、第19條（進口商）、第20條（經銷商）及第64條（罰則）之逐字條文，改由craact.eu——一個聲稱提供官方法規文字逐條逐字鏡像之第三方合規參考網站——取得；已就多條文間之一致性進行交叉檢核（例如第19條援引第13條第15／16／19項、第20條援引第13／19條，其援引方式與真實鏡像應有之表現完全相符），並就官方公報引用資訊／關鍵日期（生效日、2027-12-11一般適用日、2026-09-11第14條適用日、2026-06-11第四章適用日）透過網路搜尋、獨立比對法律事務所及EFTA等次要來源加以佐證——惟因無法直接擷取EUR-Lex一手文字本身，本條目之來源層級較本批次其餘4筆條目多隔一層，應優先列入未來人工複核，直接對照EUR-Lex／官方公報印本查核。requirements.registration設為false，係因CRA並無類似WEEE／電池法規生產者登記制度之歐盟／各國產品登記要求（惟依第14條訂有向ENISA通報弱點資料庫之義務，本schema未將其建模為「registration」）。monitoring.tier設為A（不同於本批次其餘條目採用之B／C），係考量CRA合規風險異常之高（罰鍰最高達全球營業額2.5%），且其核心義務仍於2027年前分階段生效，故近期監控其授權／執行法案及協和標準之進展格外重要。把握度仍維持medium、未降為low，係因entry_status為complete，且各欄位均可追溯至一致、已交叉驗證之來源，僅該來源較EUR-Lex本身多隔一層——此與us-fcc-part-15遭降級為stub/low之情形不同：此處之缺口在於一手來源鏡像之可靠性層級，而非底層事實本身有缺漏或未經確認。"

- id: eu-2006-1907-reach
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EC) No 1907/2006 of the European Parliament and of the Council of 18 December 2006 concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals (REACH) (OJ L 396, 30.12.2006, p. 1-849)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "REACH Regulation (Registration, Evaluation, Authorisation and Restriction of Chemicals)"
    zh: "REACH化學品法規（化學品之登記、評估、授權及限制）"
  category:
    - chemicals
    - hazardous_substances
    - registration_authorisation

  product_scope:
    en: "Applies to the manufacture, placing on the market and use of substances on their own, in mixtures, or in articles, and to the placing on the market of mixtures (Art. 1(2)). Core registration obligation (Art. 6) applies to any manufacturer or importer of a substance, on its own or in one or more mixtures, in quantities of one tonne or more per year (a threshold that captures a very wide range of consumer-electronics-relevant substances, e.g. flame retardants, plasticisers, surface coatings). Excludes: radioactive substances within the scope of Council Directive 2013/59/Euratom; substances in transit under customs supervision without any treatment/processing; non-isolated intermediates; substances in the course of carriage of dangerous goods by rail/road/inland waterway/sea/air; waste as defined by Directive 2008/98/EC (waste is not a 'substance, mixture or article' for REACH purposes); and (with only Titles II/V/VI disapplied) substances used in medicinal products, food, feed and food/feed additives already governed by their own sectoral legislation (Art. 2). Polymers themselves are exempt from registration/evaluation, though monomer substances used to make them may still require registration (Art. 2(9))."
    zh: "適用於物質（單獨、於混合物中或於物品中）之製造、投放市場及使用，以及混合物之投放市場（第1(2)條）。核心登記義務（第6條）適用於任何年產或年進口量達1公噸以上（單獨或存在於一種以上混合物中）之物質之製造商或進口商——此門檻涵蓋消費性電子產業常見之大量物質，例如阻燃劑、增塑劑、表面塗層等。排除：理事會指令2013/59/Euratom範圍內之放射性物質；受海關監管、未經任何處理之過境物質；未分離之中間體；依鐵路／公路／內陸水路／海運／空運方式運送之危險物品運輸過程中之物質；指令2008/98/EC所定之廢棄物（就REACH而言，廢棄物不構成「物質、混合物或物品」）；以及（僅排除第II、V、VI編適用）已受各自部門別法規規範之藥品、食品、飼料及食品／飼料添加物所用之物質（第2條）。聚合物本身免於登記／評估義務，惟用以製造聚合物之單體物質仍可能須辦理登記（第2(9)條）。"
  product_tags:
    - all_b2c_goods
  component_tags:
    - power_supply
    - cable_connector
    - battery
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2006-12-30"
    application: "2007-06-01"
    labelling: null
    transition_end: "2009-06-01"

  requirements:
    marking: false
    local_representative: false
    local_testing: false
    registration: true
    conformity_assessment: [none]
    conformity_assessment_note: null

  obligations:
    - actor: manufacturer
      action:
        en: "Where manufacturing a substance, on its own or in one or more mixtures, in quantities of 1 tonne or more per year, submit a registration to the European Chemicals Agency (ECHA) containing the technical dossier and (above 10 t/a) a chemical safety report (Art. 6); comply with the 'no data, no market' principle — i.e. not manufacture or place on the market a substance subject to registration unless it has been registered as required (Art. 5); not manufacture, place on the market or use a substance listed in Annex XIV (subject to authorisation) beyond the applicable sunset date unless authorised, exempted, or covered by a pending application (Art. 56); comply with any restriction set out in Annex XVII applicable to the substance, mixture or article (Art. 67); and, where a manufactured article contains a substance meeting the SVHC criteria of Art. 57 (as identified per Art. 59(1)) above 0.1% w/w, provide the recipient of the article with sufficient information to allow safe use, including at least the substance's name (Art. 33(1))."
        zh: "凡年產量達1公噸以上（單獨或存在於一種以上混合物中）之物質，應向歐盟化學總署（ECHA）提交登記，內容含技術檔案及（年產量逾10公噸者）化學安全報告（第6條）；遵守「無資料即無市場」原則——即未依規定完成登記前，不得製造或投放市場屬應登記之物質（第5條）；就附件XIV所列須經授權之物質，於適用之落日期限後，除已獲授權、獲豁免或申請案尚待審理者外，不得製造、投放市場或使用（第56條）；遵守附件XVII就該物質、混合物或物品所定之限制規定（第67條）；並就製造之物品中含有符合第57條高關注度物質（SVHC）標準（依第59(1)條認定）且濃度超過重量比0.1%者，向物品接收者提供充分資訊以利安全使用，至少含該物質名稱（第33(1)條）。"
    - actor: importer
      action:
        en: "Where importing a substance, on its own or in one or more mixtures, in quantities of 1 tonne or more per year, submit a registration to ECHA under the same conditions as a manufacturer (Art. 6); comply with the 'no data, no market' principle for imported substances (Art. 5); comply with the same Annex XIV authorisation and Annex XVII restriction obligations as manufacturers with respect to imported substances, mixtures and articles (Arts. 56, 67); and, where importing articles containing an SVHC above 0.1% w/w, provide recipients with sufficient safe-use information including at least the substance's name (Art. 33(1)); respond to a consumer request for such information free of charge within 45 days (Art. 33(2))."
        zh: "凡年進口量達1公噸以上（單獨或存在於一種以上混合物中）之物質，應依與製造商相同之條件向ECHA提交登記（第6條）；就進口物質遵守「無資料即無市場」原則（第5條）；就進口之物質、混合物及物品，遵守與製造商相同之附件XIV授權及附件XVII限制義務（第56、67條）；並就進口含高關注度物質（SVHC）濃度超過重量比0.1%之物品，向接收者提供充分之安全使用資訊，至少含該物質名稱（第33(1)條）；就消費者提出之相關資訊請求，應於收到請求後45日內免費提供（第33(2)條）。"
    - actor: seller
      action:
        en: "As any supplier of an article containing a substance meeting the SVHC criteria of Art. 57 (identified per Art. 59(1)) above 0.1% w/w, provide the recipient of the article with sufficient information, available to the supplier, to allow safe use of the article, including at least the substance's name (Art. 33(1)); and, upon request from a consumer, provide the same information free of charge within 45 days of receipt of the request (Art. 33(2))."
        zh: "作為含高關注度物質（SVHC，依第57條標準並依第59(1)條認定）濃度超過重量比0.1%之物品之任一供應者，應向物品接收者提供其所知悉、足以使該物品安全使用之資訊，至少含該物質名稱（第33(1)條）；並於消費者提出請求後45日內免費提供相同資訊（第33(2)條）。"

  tools: []
  related:
