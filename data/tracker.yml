  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment: [sdoc]
    conformity_assessment_note:
      en: "Art. 7 requires manufacturers to prepare technical documentation and carry out the internal production control procedure of Decision No 768/2008/EC (i.e. Module A) before issuing an EU declaration of conformity and affixing CE marking; no third-party/Notified Body route is provided for under this Directive, unlike RED/EMC's harmonised-standard-gated or free-choice module splits."
      zh: "第7條要求製造商於製作歐盟符合性聲明並張貼CE標誌前，編製技術文件並執行決定768/2008/EC所定之內部生產管制程序（即模組A）；本指令並未提供第三方／公告機構驗證路徑，與RED／EMC之協和標準觸發式或自由選擇式模組分工不同。"

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure EEE is designed and manufactured in accordance with the Art. 4 substance restrictions; prepare technical documentation and carry out internal production control per Decision No 768/2008/EC; draw up an EU declaration of conformity and affix CE marking; keep technical documentation and the declaration of conformity for 10 years after the EEE is placed on the market; ensure procedures are in place for series production to remain compliant, including tracking changes in design or in applicable harmonised standards; keep a register of non-conforming EEE and product recalls and keep distributors informed; ensure EEE bears a type, batch or serial number (or, where not possible, that the information is on the packaging or in an accompanying document); indicate name, registered trade name or trade mark and a contact address on the EEE or, where not possible, on packaging or accompanying documentation; take immediate corrective action, including withdrawal or recall, and notify competent national authorities where non-compliant EEE has been placed on the market; and provide all necessary information/documentation to a competent authority upon reasoned request (Art. 7)."
        zh: "確保電機電子設備依第4條物質限制設計及製造；編製技術文件並依決定768/2008/EC執行內部生產管制程序；製作歐盟符合性聲明並張貼CE標誌；於設備投放市場後保存技術文件及符合性聲明達10年；確保有程序可維持系列生產之持續符合性，包含追蹤設計或適用協和標準之變更；就不合規設備及召回建立紀錄並告知經銷商；確保設備標示型號、批號或序號（若無法標示，則於包裝或隨附文件載明）；於設備或（如無法標示）包裝或隨附文件上標示名稱、註冊商號或商標及聯絡地址；於發現已投放市場之設備不合規時，立即採取矯正措施（含下架或召回）並通知主管機關；並依主管機關有理由之請求提供一切必要資訊／文件（第7條）。"
    - actor: importer
      action:
        en: "Place only compliant EEE on the market; before doing so, verify that the manufacturer has carried out the appropriate conformity assessment procedure, prepared the technical documentation, affixed CE marking, and complied with the product-identification and contact-address marking obligations of Art. 7(g)-(h); where an importer considers or has reason to believe EEE is not in conformity with Art. 4, not place it on the market until brought into conformity and notify the manufacturer and market surveillance authorities; keep a register of non-conforming EEE and recalls; indicate their own name/contact address on the EEE or, where not possible, on packaging or accompanying documentation; take immediate corrective action, including withdrawal or recall, where non-compliant EEE has already been placed on the market and notify authorities; keep a copy of the EU declaration of conformity available to market surveillance authorities for 10 years and ensure technical documentation can be made available on request; and respond to information requests within a reasonable period and cooperate on any action taken to eliminate non-compliance (Art. 9)."
        zh: "僅將合規之電機電子設備投放市場；投放前應查核製造商已執行適用之符合性評鑑程序、編製技術文件、張貼CE標誌，並已履行第7條(g)(h)款之產品識別與聯絡地址標示義務；如有理由相信設備不符第4條規定，於導正合規前不得投放市場，並通知製造商及市場監督機關；就不合規設備及召回建立紀錄；於設備或（如無法標示）包裝或隨附文件上標示自身名稱／聯絡地址；於已投放市場之設備發現不合規時，立即採取矯正措施（含下架或召回）並通知主管機關；保存歐盟符合性聲明副本供市場監督機關取用達10年，並確保技術文件可依請求提供；並於合理期間內回應資訊請求，配合消除不合規之各項行動（第9條）。"
    - actor: seller
      action:
        en: "Before making EEE available on the market, act with due care and verify that it bears CE marking, is accompanied by the required documents in a language easily understood by end-users, and that the manufacturer and importer have complied with their respective marking obligations; where a distributor considers or has reason to believe EEE is not in conformity with Art. 4, not make it available until brought into conformity and notify the manufacturer/importer and authorities; where non-compliant EEE has already been made available, ensure corrective measures (correction, withdrawal or recall) are taken and immediately inform national authorities with details of the non-compliance and action taken; and, upon request from a competent national authority, furnish all information/documentation needed to demonstrate conformity and cooperate on any action taken to eliminate non-compliance (Art. 10)."
        zh: "於使電機電子設備可於市場上取得前，應本於注意義務查核其已張貼CE標誌、備有以終端使用者易懂語言提供之所需文件，且製造商與進口商已履行各自之標示義務；如有理由相信設備不符第4條規定，於導正合規前不得使其可於市場上取得，並通知製造商／進口商及主管機關；如不合規設備已可於市場上取得，應確保採取矯正措施（改正、下架或召回）並立即通知主管機關不合規詳情及已採取之行動；並於主管機關請求時，提供證明合規所需之一切資訊／文件，配合消除不合規之各項行動（第10條）。"

