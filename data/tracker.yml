      zh: "依第21條，會員國應訂定違反依本指令採行之國內規定之罰則規定，並採取所有必要措施確保其執行；所定罰則須具備有效性、比例性及嚇阻性。本指令本身未規定罰鍰金額或範圍，完全交由各會員國國內轉換立法定之。"
