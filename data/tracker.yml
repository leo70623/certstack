  notes:
    en: "Entry compiled from the UK National Archives' retained-EU-law mirror of Directive 2014/53/EU (legislation.gov.uk), article by article, cross-checked against EUR-Lex's ELI page and web search results for the Official Journal citation (OJ L 153, 22.5.2014, confirmed via independent search, not just legislation.gov.uk). Confirmed word-for-word: scope (Art. 1), publication date and transposition/application dates 22 May 2014 / 12-13 June 2016, transitional sell-through deadline 13 June 2017 (Arts. 48-49), manufacturer obligations (Art. 10), importer obligations (Art. 12), distributor obligations (Art. 13), that an EU authorised representative is optional rather than mandatory (Art. 11), the conformity assessment module split between self-declaration and mandatory Notified Body involvement depending on harmonised-standard coverage (Art. 17), the CE marking requirement (Arts. 19-20 per table of contents), and that penalties are left to Member States' national law (Art. 46, quoted). Confidence raised from low to medium under the schema's documented upgrade rule (entry_status now complete, all key fields traceable to directly-read primary text, cross-verified via a second independent source for the OJ citation) — this is NOT equivalent to human review; review_status remains pending and confidence cannot reach high until a person verifies word-for-word against EUR-Lex directly. NOT yet independently re-verified by a human: product_tags/category assignment, and the precise legal boundary of Art. 3(2)/(3) 'not fully covered by harmonised standards' triggering condition."
    zh: "本條目係於本次工作階段中，改以英國國家檔案館之歐盟保留法（retained EU law）鏡像網站（legislation.gov.uk）逐條查證彙整，並以EUR-Lex ELI頁面及網路搜尋結果交叉核對官方公報引用資訊（OJ L 153, 22.5.2014，已透過legislation.gov.uk以外之獨立搜尋確認）。已逐字確認：適用範圍（第1條）、公布日期及轉換／適用日期為2014年5月22日／2016年6月12-13日、舊制產品出清期限為2017年6月13日（第48、49條）、製造商義務（第10條）、進口商義務（第12條）、經銷商義務（第13條）、歐盟授權代表為選擇性而非強制設置（第11條）、符合性評鑑程序依協和標準涵蓋程度分流為自我聲明或強制公告機構參與（第17條）、CE標誌要求（依目錄所示第19-20條）、罰則由會員國國內法自行訂定（第46條，已引用原文）。依schema所訂升級規則，把握度已由low調升為medium（entry_status已轉為complete，關鍵欄位均可追溯至直接讀取之一手原文，且OJ引用已以第二獨立來源交叉驗證）——惟此仍非人工複核，review_status維持pending，把握度須待真人逐字對照EUR-Lex原文後方可調升為high。尚未經人工獨立複核：product_tags／category之分類標記，以及第3(2)／(3)條「未經協和標準完全涵蓋」觸發條件之確切法律邊界認定。"

- id: us-fcc-part-15
  parent: null
  superseded_by: null
  jurisdiction: US
  applies_in: []
  citation: "47 CFR Part 15 — Radio Frequency Devices"
  local_type: "Code of Federal Regulations Part"
  instrument_type: regulation
  short_name:
    en: "FCC Rules for Radio Frequency Devices (47 CFR Part 15)"
    zh: "美國聯邦通訊委員會射頻裝置規則（47 CFR Part 15）"
  category:
    - radio_equipment
    - emc

  product_scope:
    en: "Sets out the technical requirements and equipment authorization procedures under which intentional, unintentional, and incidental radiators may be operated or marketed in the United States without an individual license (§ 15.1)."
    zh: "訂定美國境內意圖性、非意圖性及附帶性射頻發射裝置得免個別執照操作或行銷之技術要求與設備授權程序（§15.1）。"
  product_tags:
    - radio_equipment
    - consumer_electronics
    - it_equipment
  applies_to:
    - manufacturer

  status: in_force

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment: [sdoc, third_party]
    conformity_assessment_note:
      en: "The applicable procedure depends on device category: 'Verification' (§ 15.101, internal self-testing, no filing) and 'Supplier's Declaration of Conformity' (§ 15.101, self-declaration after testing) are both self-declaration-type routes; 'Certification' (§§ 15.201, 15.305) requires review and grant by the FCC or an FCC-recognized Telecommunication Certification Body (TCB) before marketing, i.e. third-party involvement. Which route applies is fixed per device category by Part 15 itself, not chosen freely by the manufacturer."
      zh: "適用程序依裝置類別而定：「自我驗證」（§15.101，內部自我測試、免申報）與「供應商符合性聲明」（§15.101，測試後自我聲明）均屬自我聲明類型路徑；「憑證認證」（§§15.201、15.305）則須經FCC或FCC認可之電信憑證機構（TCB）審查核發後始得行銷，即涉及第三方參與。適用何種程序依裝置類別由Part 15本身固定規定，非由製造商自由選擇。"

  obligations:
    - actor: manufacturer
      action:
        en: "Obtain the equipment authorization applicable to the device category (verification, Supplier's Declaration of Conformity, or Certification) before marketing or importing the device, and ensure it bears the required compliance labeling (§§ 15.19, 15.101, 15.201, 15.305)."
        zh: "於行銷或進口裝置前，取得該裝置類別所適用之設備授權（自我驗證、供應商符合性聲明或憑證認證），並確保張貼所需之符合性標示（§§15.19、15.101、15.201、15.305）。"
    - actor: importer
      action:
        en: "Where equipment by itself (rather than as part of a host product) is imported, the importer becomes the 'responsible party' for compliance under 47 CFR § 2.909(b)(2), bearing obligations equivalent to a manufacturer's — including ensuring the equipment complies with the applicable authorization procedure and maintaining required compliance records (§ 2.938); an importer may not market the device until any required FCC Identifier has been validated by a grant of equipment certification (§ 2.926(e))."
        zh: "當裝置本身（而非作為母產品之一部分）被進口時，依47 CFR §2.909(b)(2)，進口商成為合規責任方，負與製造商相當之義務——包含確保裝置符合適用之授權程序，並保存所需合規紀錄（§2.938）；於任何所需FCC識別碼經憑證認證核發確認前，進口商不得行銷該裝置（§2.926(e)）。"

  tools: []
  related: []

  sources:
    - url: "https://www.govinfo.gov/content/pkg/CFR-2023-title47-vol1/xml/CFR-2023-title47-vol1-part15.xml"
      type: primary
      publisher: "U.S. Government Publishing Office (GovInfo) — Code of Federal Regulations, Title 47"
    - url: "https://www.law.cornell.edu/uscode/text/47/503"
      type: primary
      publisher: "Cornell Law School Legal Information Institute — 47 U.S.C. § 503 (U.S. Code)"

  enforcement:
    authority: "Federal Communications Commission (FCC)"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Under 47 U.S.C. § 503(b), the FCC may impose forfeiture penalties for willful or repeated violations: for general (non-licensee) violators, up to $10,000 per violation or per day of a continuing violation, capped at $75,000 per single act or failure; for accessibility-equipment manufacturers violating specific accessibility provisions (47 U.S.C. §§ 255, 617, 619 — not the general Part 15 case), up to $100,000 per violation, capped at $1,000,000 per act. Before imposing a penalty, the FCC must issue a written notice of apparent liability, allow the respondent to respond, and (for non-licensees) provide a prior citation and opportunity for a personal interview (§ 503(b)(4)-(5)); unpaid final assessments are referred to the Attorney General for enforcement in federal district court."
      zh: "依47 U.S.C. §503(b)，FCC得對故意或重複違規課處罰鍰：一般（非執照持有）違規者，每項違規或每延續一日最高10,000美元，單一行為或不作為累計上限75,000美元；違反無障礙相關特定條款（47 U.S.C. §§255、617、619——非一般Part 15情形）之無障礙設備製造商，每項違規最高100,000美元，單一行為累計上限1,000,000美元。FCC課處罰鍰前，須先發出書面「表面責任通知」、給予受處分人答辯機會，並（對非執照持有者）先行發出警告並給予面談機會（§503(b)(4)-(5)）；未繳納之最終裁罰將移送司法部長於聯邦地方法院強制執行。"
    penalty_range: null
    market_impact: []
    source_ref: 1
    last_verified: "2026-09-24"

  monitoring:
    tier: B
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: stub
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: low
  notes:
    en: "Entry compiled from the official GovInfo XML publication of 47 CFR Part 15 (2023 edition), 'Radio Frequency Devices'. Confirmed: scope covers intentional, unintentional, and incidental radiators (§ 15.1); equipment must obtain the authorization procedure applicable to its category — Verification, Supplier's Declaration of Conformity (both self-declaration-type, no third party), or Certification (requires FCC/TCB grant, third-party involvement) (§§ 15.19, 15.101, 15.201, 15.305); a compliance labeling requirement applies, including an FCC ID for certified devices. This session additionally confirmed, via 47 CFR § 2.909(b)(2)/§ 2.926(e)/§ 2.938 (GovInfo XML for Part 2 Subpart J), that a standalone-equipment importer becomes the compliance 'responsible party' with manufacturer-equivalent obligations, and, via Cornell Law's LII mirror of 47 U.S.C. § 503, the full forfeiture-penalty structure and FCC enforcement procedure (notice of apparent liability, response opportunity, referral to the Attorney General for unpaid penalties). requirements.local_representative/local_testing/registration are all recorded as false: Part 15 imposes no requirement for a US-based agent, accepts test data from any competent lab/TCB without a US-location restriction, and imposes no separate product registration distinct from the equipment-authorization procedures already captured in conformity_assessment. entry_status is kept at stub (not promoted to complete) and confidence stays low (not raised to medium) specifically because dates.published/dates.application — both required for a complete entry — remain unconfirmed: the live eCFR 'current as of' service again redirected to an access-blocking page this session, and this GovInfo snapshot is dated 2023 and may not reflect the latest amendments; per the schema's confidence-upgrade rule, this is a genuine research/access gap (eCFR is blocked, not that Part 15 structurally lacks a date) rather than the law's own structural nature, so it does not qualify for the stub-can-still-be-medium exception. NOT yet confirmed: exact enactment/current-amendment date for dates.published/dates.application, and distributor/retailer-specific obligations distinct from the importer/manufacturer obligations already captured. Pending word-for-word human review against the live eCFR."
    zh: "本條目係依美國政府出版局（GovInfo）官方XML版本之47 CFR Part 15（2023年版，標題「射頻裝置」）彙整。已確認：適用範圍涵蓋意圖性、非意圖性及附帶性射頻發射裝置（§15.1）；裝置須依其類別取得適用之授權程序——自我驗證、供應商符合性聲明（皆屬自我聲明類型，無第三方參與）或憑證認證（須經FCC／TCB核發，涉及第三方參與）（§§15.19、15.101、15.201、15.305）；須張貼符合性標示，經憑證認證之裝置並須取得FCC ID。本次工作階段另透過47 CFR §2.909(b)(2)／§2.926(e)／§2.938（GovInfo之Part 2 Subpart J XML）確認：獨立裝置之進口商成為合規「責任方」，負與製造商相當之義務；並透過Cornell Law LII之47 U.S.C. §503鏡像，確認完整之罰鍰結構與FCC執法程序（表面責任通知、答辯機會、未繳罰鍰移送司法部長）。requirements.local_representative／local_testing／registration均記為false：Part 15未要求須設美國境內代理人、未限定測試須由境內實驗室／TCB出具、亦未於conformity_assessment所涵蓋之設備授權程序外另設獨立產品註冊要求。entry_status維持stub（未提升為complete）、把握度維持low（未提升為medium），係因complete條目所需之dates.published／dates.application仍未查證：本次工作階段eCFR即時「現行版本」服務再次重新導向至存取阻擋頁面，本GovInfo快照為2023年版本，可能未反映最新修訂；依schema把握度升級規則，此屬真正之研究／存取缺口（eCFR遭阻擋，並非Part 15本身結構性缺乏日期），而非法規本身之結構性因素，故不符合stub仍可標示medium之例外情形。尚未確認：dates.published／dates.application所需之確切訂定／現行修訂日期，以及經銷商／零售商特有義務（有別於已納入之進口商／製造商義務）。尚待人工逐字複核現行eCFR原文。"

- id: eu-2022-30-red-cybersecurity
  parent: eu-2014-53
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Commission Delegated Regulation (EU) 2022/30 of 29 October 2021 supplementing Directive 2014/53/EU with regard to the application of the essential requirements referred to in Article 3(3), points (d), (e) and (f) (OJ L 7, 12.1.2022, p. 6), as amended by Commission Delegated Regulation (EU) 2023/2444"
  local_type: "Delegated Regulation"
  instrument_type: regulation
  short_name:
    en: "RED Cybersecurity Requirements (Delegated Regulation (EU) 2022/30)"
    zh: "RED網路安全要求（授權法規(EU) 2022/30）"
  category:
    - radio_equipment
    - cybersecurity

  product_scope:
    en: "Activates the RED essential requirements of Article 3(3)(d) (network protection), (e) (personal data/privacy safeguards) and (f) (fraud protection) for specific categories of radio equipment: 3(3)(d) applies to any internet-connected radio equipment; 3(3)(e) applies to internet-connected radio equipment capable of processing personal or traffic/location data, with exclusions for childcare equipment, toys (Directive 2009/48/EC), and wearables; 3(3)(f) applies to internet-connected radio equipment enabling transfer of money, monetary value or virtual currency. Medical devices (Regulations (EU) 2017/745, 2017/746) are excluded from all three points; aviation/vehicle/toll equipment (Regulations (EU) 2018/1139, 2019/2144, Directive (EU) 2019/520) are excluded from (e) and (f) (Delegated Regulation (EU) 2022/30, Arts. 1-2)."
    zh: "啟用RED第3(3)(d)款（網路保護）、(e)款（個資／隱私保護）、(f)款（防詐欺）之基本要求，適用於特定類別無線電設備：(d)款適用於任何具連網功能之無線電設備；(e)款適用於能處理個資或流量／位置資料之連網無線電設備，但童用照護設備、玩具（指令2009/48/EC）及穿戴式設備排除在外；(f)款適用於可移轉金錢、貨幣價值或虛擬貨幣之連網無線電設備。醫療器材（法規(EU) 2017/745、2017/746）自三款要求全數排除；航空／車輛／道路收費設備（法規(EU) 2018/1139、2019/2144、指令(EU) 2019/520）自(e)(f)款排除（授權法規(EU) 2022/30第1、2條）。"
  product_tags:
    - radio_equipment
    - consumer_electronics
    - it_equipment
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2022-01-12"
    application: "2025-08-01"
    labelling: null
    transition_end: null

  requirements:
    marking: false
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment:
      - sdoc
      - third_party
    conformity_assessment_note:
      en: "This Delegated Regulation only activates additional essential requirements under RED Art. 3(3)(d)/(e)/(f); it does not create a separate conformity assessment procedure. The module split follows the parent Directive's Art. 17: self-declaration (Annex II) where a harmonised standard fully covering the activated requirement has been applied (see EN 18031-1/2/3 in eu-2025-138-en18031), otherwise mandatory Notified Body involvement (Annex III/IV)."
      zh: "本授權法規僅啟用RED第3(3)(d)/(e)/(f)款之額外基本要求，本身並未另訂符合性評鑑程序。模組分流沿用母指令第17條：若已採用完全涵蓋該啟用要求之協調標準（見eu-2025-138-en18031條目所載EN 18031-1/2/3），得採自我聲明（附件二）；否則須經公告機構強制參與（附件三／四）。"

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure in-scope radio equipment meets the applicable network-protection, personal-data/privacy and anti-fraud essential requirements before being placed on the market, as a precondition of the CE marking / conformity assessment already required under the parent Directive 2014/53/EU (Delegated Regulation (EU) 2022/30, Art. 1)."
        zh: "確保適用範圍內之無線電設備於投放市場前，符合適用之網路保護、個資／隱私保護及防詐欺基本要求，作為母指令2014/53/EU下CE標誌／符合性評鑑之前提條件（授權法規(EU) 2022/30第1條）。"

  tools: []
  related:
    - eu-2025-138-en18031

  sources:
    - url: "https://single-market-economy.ec.europa.eu/system/files/2021-10/C_2021_7672_F1_COMMISSION_DELEGATED_REGULATION_EN_V10_P1_1428769.PDF"
      type: primary
      publisher: "European Commission — adopted text of Commission Delegated Regulation (EU) 2022/30, C(2021) 7672 final"
    - url: "https://eur-lex.europa.eu/eli/reg_del/2023/2444/oj/eng"
      type: primary
      publisher: "EUR-Lex — Commission Delegated Regulation (EU) 2023/2444 (postponing the application date)"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State (same authorities as under the parent Directive 2014/53/EU)"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "This Delegated Regulation does not establish its own penalty regime: it activates essential requirements within the framework of Directive 2014/53/EU (RED), so infringements are penalised under the parent Directive's Art. 46, which leaves Member States to set penalties that are effective, proportionate and dissuasive (see eu-2014-53 for the full text)."
      zh: "本授權法規本身未另訂罰則制度：其係於指令2014/53/EU（RED）架構下啟用基本要求，違規行為依母指令第46條處罰，該條規定由會員國自行訂定具有效性、比例性及嚇阻性之罰則（完整原文見eu-2014-53條目）。"
    penalty_range: null
    market_impact: []
    source_ref: null
    last_verified: "2026-09-24"

  monitoring:
    tier: C
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: complete
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: medium
  notes:
    en: "This is the specific amendment the user asked to be tracked separately from the umbrella eu-2014-53 RED entry, since it represents a concrete, dated change (new essential requirements becoming legally applicable) rather than the directive as a whole. Compiled from the European Commission's own adopted delegated-regulation text (single-market-economy.ec.europa.eu PDF of C(2021) 7672 final, word-for-word Articles 1-3 read via pdftotext) for scope/exclusions, and from EUR-Lex's ELI /oj/eng rendering of Delegated Regulation (EU) 2023/2444 for the postponement (original application date 1 August 2024, postponed by 12 months to 1 August 2025 because the supporting harmonised standards were not ready in time). EUR-Lex's CELEX-style URLs (/legal-content/EN/TXT or /ALL) returned empty content throughout this session as in prior research; the ELI '/oj/eng' URL form and the Commission's own PDF mirror were used instead and are cited as sources. requirements.marking is false because this Delegated Regulation does not itself impose a marking obligation distinct from the parent Directive's Art. 20 CE-marking requirement. The enforcement block was previously omitted entirely (to avoid a bilingual field with null values); it has now been filled in accurately by stating, in the Commission's and parent Directive's own terms, that this act inherits the parent Directive's Art. 46 penalty mechanism rather than setting its own — this is a factual statement, not a guess, so entry_status is promoted to complete and confidence to medium under the schema's upgrade rule. NOT yet confirmed by human review: obligations for importers/distributors specifically (only the manufacturer's Art. 1 compliance obligation is captured, mirroring the structure of this narrow delegated act); the conformity_assessment_note's characterisation of how Art. 17's module split applies to essential requirements activated by a delegated act specifically (versus essential requirements set directly in the parent Directive) should be checked by a human against the Directive's exact wording. Pending word-for-word human review against the final Official Journal text (OJ L 7, 12.1.2022 and OJ L, 2023/2444)."
    zh: "本條目係依你的要求，將此次具體修訂（新基本要求正式生效之明確、有日期之變更）自母指令eu-2014-53條目中獨立拆出，而非僅呈現籠統之RED指令整體。範圍／排除規定係彙整自歐盟執委會官方採認之授權法規原文（single-market-economy.ec.europa.eu所刊之C(2021) 7672 final PDF，以pdftotext逐字讀取第1-3條）；延後生效之部分係彙整自EUR-Lex以ELI「/oj/eng」格式呈現之授權法規(EU) 2023/2444內容（原訂2024年8月1日生效，因配套協調標準未能如期完成，延後12個月至2025年8月1日）。本次工作階段中EUR-Lex之CELEX格式網址（/legal-content/EN/TXT或/ALL）如先前一樣皆回傳空白內容，故改用ELI「/oj/eng」格式網址及執委會官方PDF鏡像作為來源引用。requirements.marking設為false，係因本授權法規本身未另外課予標示義務（標示義務屬母指令第20條CE標誌規定）。原先整段省略之enforcement區塊（避免雙語欄位出現null值），現已據實填入：以執委會與母指令自身用語說明，本法規係沿用母指令第46條罰則機制、而非另訂罰則——此為事實陳述而非臆測，故依schema升級規則將entry_status調升為complete、把握度調升為medium。尚未經人工複核：進口商／經銷商之特定義務（目前僅記錄製造商依第1條之義務，反映本狹義授權法規之結構）；conformity_assessment_note關於第17條模組分流如何適用於「由授權法規啟用」之基本要求（相對於母指令直接訂定之基本要求）之說明，應由人工對照指令確切文字複核。尚待人工逐字複核歐盟官方公報正式文本（OJ L 7, 12.1.2022 及 OJ L, 2023/2444）。"

- id: eu-2025-138-en18031
  parent: eu-2014-53
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Commission Implementing Decision (EU) 2025/138 of 28 January 2025 amending Implementing Decision (EU) 2022/2191 as regards harmonised standards in support of the cybersecurity essential requirements of Directive 2014/53/EU specified in Delegated Regulation (EU) 2022/30 (OJ L, 2025/138, 30.1.2025)"
  local_type: "Implementing Decision"
  instrument_type: mandatory_standard
  short_name:
    en: "EN 18031-1/2/3:2024 Harmonised Standards (RED Cybersecurity)"
    zh: "EN 18031-1/2/3:2024協調標準（RED網路安全）"
  category:
    - radio_equipment
    - cybersecurity

  product_scope:
    en: "Lists harmonised standards EN 18031-1:2024, EN 18031-2:2024 and EN 18031-3:2024 as conferring presumption of conformity with the essential requirements of RED Art. 3(3)(d), (e) and (f) respectively (as activated by Delegated Regulation (EU) 2022/30), but with explicit restrictions: the standards' own 'rationale' and 'guidance' sections do not confer presumption of conformity, and compliance does not confer presumption of conformity where a manufacturer uses clauses 6.2.5.1/6.2.5.2 of EN 18031-1/-2/-3 (or EN 18031-2 clauses 6.1.3-6.1.6, or EN 18031-3 clause 6.3.2.4) to let a user skip setting a password or otherwise bypass the relevant access-control/secure-update mechanism (Implementing Decision (EU) 2025/138, recitals 5-9 and Annex)."
    zh: "將協調標準EN 18031-1:2024、EN 18031-2:2024、EN 18031-3:2024分別列為賦予RED第3(3)(d)、(e)、(f)款基本要求（由授權法規(EU) 2022/30啟用）符合性推定效力之標準，惟附有明確限制：標準本身之「rationale（理由）」與「guidance（指引）」章節不具符合性推定效力；且若製造商採用EN 18031-1/-2/-3第6.2.5.1/6.2.5.2條（或EN 18031-2第6.1.3-6.1.6條、EN 18031-3第6.3.2.4條）允許使用者不設定密碼或規避相關存取控制／安全更新機制者，亦不具符合性推定效力（執行決定(EU) 2025/138第5-9項理由及附件）。"
  product_tags:
    - radio_equipment
    - consumer_electronics
    - it_equipment
  applies_to:
    - manufacturer

  status: in_force
  dates:
    published: "2025-01-30"
    application: "2025-01-30"
    labelling: null
    transition_end: null

  requirements:
    marking: false
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment:
      - sdoc
    conformity_assessment_note:
      en: "Applying these harmonised standards (subject to the Art. 3(3)(d)/(e)/(f) restrictions noted in product_scope) is precisely what enables manufacturers to use the self-declaration route (Annex II) for the essential requirements activated by Delegated Regulation (EU) 2022/30, instead of the mandatory Notified Body route that otherwise applies under RED Art. 17 when no fully-covering harmonised standard exists."
      zh: "採用此等協調標準（受product_scope所述第3(3)(d)/(e)/(f)款限制條款拘束）正是使製造商得就授權法規(EU) 2022/30所啟用之基本要求採自我聲明途徑（附件二）之關鍵，否則依RED第17條，於無完全涵蓋之協調標準時須採強制公告機構途徑。"

  obligations:
    - actor: manufacturer
      action:
        en: "To benefit from the presumption of conformity with the RED Art. 3(3)(d)/(e)/(f) essential requirements activated by Delegated Regulation (EU) 2022/30, manufacturers must apply the full normative clauses of EN 18031-1/2/3:2024 (excluding the standards' own 'rationale' and 'guidance' sections, which do not confer presumption of conformity), and must not rely on clauses 6.2.5.1/6.2.5.2 of EN 18031-1/-2/-3 (or EN 18031-2 clauses 6.1.3-6.1.6, or EN 18031-3 clause 6.3.2.4) to let a user skip setting a password or otherwise bypass the relevant access-control/secure-update mechanism, since doing so forfeits the presumption of conformity (Implementing Decision (EU) 2025/138, recitals 5-9 and Annex)."
        zh: "為就授權法規(EU) 2022/30所啟用之RED第3(3)(d)/(e)/(f)款基本要求取得符合性推定效力，製造商須適用EN 18031-1/2/3:2024之完整規範性條文（不含標準本身之「rationale」與「guidance」章節，該等章節不具符合性推定效力），且不得援引EN 18031-1/-2/-3第6.2.5.1/6.2.5.2條（或EN 18031-2第6.1.3-6.1.6條、EN 18031-3第6.3.2.4條）允許使用者不設定密碼或規避相關存取控制／安全更新機制，否則將喪失符合性推定效力（執行決定(EU) 2025/138第5-9項理由及附件）。"

  tools: []
  related:
    - eu-2022-30-red-cybersecurity

  sources:
    - url: "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=OJ:L_202500138"
      type: primary
      publisher: "EUR-Lex — Official Journal of the European Union, L series, Commission Implementing Decision (EU) 2025/138"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State (same authorities as under the parent Directive 2014/53/EU)"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "This Implementing Decision merely lists harmonised standards in the Official Journal; it does not itself establish a penalty regime. Failure to meet the essential requirements these standards support is penalised under the parent Directive 2014/53/EU's Art. 46, which leaves Member States to set penalties that are effective, proportionate and dissuasive (see eu-2014-53 for the full text)."
      zh: "本執行決定僅於官方公報列示協調標準，本身並未另訂罰則制度。未能符合此等標準所支援之基本要求者，依母指令2014/53/EU第46條處罰，該條規定由會員國自行訂定具有效性、比例性及嚇阻性之罰則（完整原文見eu-2014-53條目）。"
    penalty_range: null
    market_impact: []
    source_ref: null
    last_verified: "2026-09-24"

  monitoring:
    tier: C
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: complete
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: medium
  notes:
    en: "Per project policy for instrument_type: mandatory_standard, this entry will never contain reproduced clause text from the standard body's own document (copyright restriction) — the restriction wording quoted in product_scope above is the Commission's own Official Journal legal text (the 'Notice 1'/'Notice 2' entries in the Annex to this Implementing Decision), not text copied from EN 18031-1/-2/-3 themselves. Compiled by fetching the EUR-Lex PDF directly (this OJ:L_202500138 PDF URL form worked where CELEX-style URLs failed) and reading it locally with pdftotext, confirming word-for-word: decision date 28 January 2025, OJ publication 30 January 2025, entry into force on day of publication, the three standard numbers/titles/subject-matter mapping to RED Art. 3(3)(d)/(e)/(f) respectively, and the specific restriction clauses. Set as a child of eu-2014-53 (schema does not allow parent chains deeper than one level, so this cannot be nested under eu-2022-30-red-cybersecurity as a grandchild of eu-2014-53); the relationship to eu-2022-30-red-cybersecurity — the delegated regulation these standards support — is instead recorded via the related field. an obligations entry was added restating, in the Decision's own terms, the condition manufacturers must meet (applying the standards' normative clauses, and not using the specific password-bypass clauses) to benefit from the presumption of conformity — this is required for entry_status: complete (min 1 obligation) and is not a fabricated obligation, since it is drawn directly from the Decision's Annex restriction text already quoted in product_scope. The enforcement block was previously omitted entirely; it has now been filled in accurately by stating that this Decision inherits the parent Directive's Art. 46 penalty mechanism rather than setting its own, which is a factual statement rather than a guess, so entry_status is promoted to complete and confidence to medium under the schema's upgrade rule. NOT yet confirmed by human review: whether any Member State has adopted additional national measures specific to this Decision. Pending word-for-word human review against the final Official Journal text."
    zh: "依專案規範，instrument_type: mandatory_standard之條目不得重製標準本文之條文（著作權限制）——上方product_scope所引用之限制文字，係執委會官方公報法律文本本身（本執行決定附件中之「Notice 1」／「Notice 2」項目），並非擷取自EN 18031-1/-2/-3標準本文。彙整方式為直接擷取EUR-Lex之PDF（本OJ:L_202500138之PDF網址格式於本次工作階段可正常擷取，CELEX格式網址則否），並以pdftotext於本機解析，逐字確認：決定日期2025年1月28日、公報刊登日2025年1月30日、於刊登當日生效、三項標準之編號／名稱／對應RED第3(3)(d)/(e)/(f)款關係，以及具體限制條款。本條目列為eu-2014-53之子條目（schema規範parent鏈不得超過一層，故無法作為eu-2022-30-red-cybersecurity之子條目、進而成為eu-2014-53之孫條目）；與eu-2022-30-red-cybersecurity（此等標準所支援之授權法規）之關聯改以related欄位記錄。已新增一筆obligations，以決定本身用語重述製造商須符合之條件（適用標準規範性條文、且不得使用特定密碼規避條款）方能取得符合性推定效力——因entry_status: complete須至少一筆obligation，且此非杜撰義務，而係直接取自product_scope已引用之決定附件限制文字。原先整段省略之enforcement區塊，現已據實填入：說明本決定沿用母指令第46條罰則機制、而非另訂罰則，此為事實陳述而非臆測，故依schema升級規則將entry_status調升為complete、把握度調升為medium。尚未經人工複核：是否有會員國就本決定另訂國內補充措施。尚待人工逐字複核歐盟官方公報正式文本。"

- id: eu-2014-30-emc
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Directive 2014/30/EU of the European Parliament and of the Council of 26 February 2014 on the harmonisation of the laws of the Member States relating to electromagnetic compatibility (recast) (OJ L 96, 29.3.2014, p. 79)"
  local_type: "Directive"
  instrument_type: directive
  short_name:
    en: "EMC Directive"
    zh: "電磁相容性指令（EMC）"
  category:
    - emc
    - consumer_electronics

  product_scope:
    en: "Applies to equipment (apparatus and fixed installations) as defined in Article 3, i.e. equipment liable to generate electromagnetic disturbance or whose performance is liable to be affected by such disturbance. Excludes equipment covered by the former Directive 1999/5/EC (now radio equipment under RED, tracked separately as eu-2014-53), certain aviation equipment, radio amateur equipment, equipment whose physical characteristics mean it cannot generate/be affected by significant electromagnetic disturbance, and custom-built evaluation kits for professional R&D use only (Art. 2)."
    zh: "適用於指令第3條所定義之設備（器具及固定裝置），即可能產生電磁干擾或其效能可能受此干擾影響之設備。排除原指令1999/5/EC所涵蓋之設備（現已改由RED無線電設備指令規範，另立為eu-2014-53條目）、特定航空設備、業餘無線電設備、因物理特性而不致產生／不致受顯著電磁干擾影響之設備，以及僅供專業研發用途之客製化評估套件（第2條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - radio_equipment
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2014-03-29"
    application: "2016-04-20"
    labelling: null
    transition_end: null

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment:
      - sdoc
      - third_party
    conformity_assessment_note:
      en: "Unlike RED, EMC conformity assessment is a free manufacturer choice rather than one gated by harmonised-standard coverage: manufacturers may use internal production control alone (Annex II), EU-type examination plus conformity to type via internal production control (Annex III), or apply Annex III only to some aspects of the essential requirements while using Annex II for the rest (Art. 14)."
      zh: "與RED不同，EMC符合性評鑑程序係由製造商自由選擇，而非依協調標準涵蓋程度分流：製造商得單獨採內部生產管制（附件二）、採歐盟型式檢驗併型式符合性內部生產管制（附件三），或僅就基本要求之部分面向採附件三、其餘面向採附件二（第14條）。"

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure equipment is designed and manufactured in accordance with the essential requirements in Annex I, draw up technical documentation and carry out the conformity assessment procedure, affix the CE marking, and keep the technical documentation and EU declaration of conformity for 10 years after the equipment is placed on the market (Art. 7)."
        zh: "確保設備依附件一之基本要求設計及製造，編製技術文件並執行符合性評鑑程序，張貼CE標誌，且於設備投放市場後保存技術文件與歐盟符合性聲明達10年（第7條）。"
    - actor: importer
      action:
        en: "Verify the manufacturer has carried out the conformity assessment procedure under Art. 14 and that the apparatus bears CE marking and required documentation; place their own contact details on the apparatus or packaging; keep a copy of the EU declaration of conformity at the disposal of market surveillance authorities and ensure technical documentation availability for 10 years after the apparatus is placed on the market (Art. 9)."
        zh: "確認製造商已依第14條執行符合性評鑑程序，且器具已張貼CE標誌並備有所需文件；於器具或包裝上標示自身聯絡方式；保存歐盟符合性聲明副本供市場監督機關取閱，並確保技術文件於器具投放市場後10年內可供取得（第9條）。"
    - actor: seller
      action:
        en: "Before making apparatus available on the market, verify that it bears the CE marking and is accompanied by the required documents and consumer-friendly instructions, and that the manufacturer and importer have complied with their respective obligations; ensure storage and transport conditions do not jeopardise compliance with the essential requirements while the apparatus is under the distributor's responsibility (Art. 10)."
        zh: "在提供器具於市場前，應確認其已張貼CE標誌、備有所需文件及消費者易懂之使用說明，並確認製造商與進口商已履行各自義務；於器具由經銷商負責保管期間，應確保儲存與運送條件不致損及基本要求之符合性（第10條）。"

  tools: []
  related:
    - eu-2014-53

  sources:
    - url: "https://www.legislation.gov.uk/eudr/2014/30/contents"
      type: primary
      publisher: "UK National Archives — legislation.gov.uk (retained EU law text of Directive 2014/30/EU)"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States lay down rules on penalties applicable to infringements by economic operators of national provisions adopted under this Directive; penalties must be effective, proportionate and dissuasive, and may include criminal penalties for serious infringements (Art. 42)."
      zh: "各會員國自行訂定對經濟營運者違反本指令國內轉換規定之罰則；罰則須具有效性、比例性及嚇阻性，嚴重違規得包含刑事制裁（第42條）。"
    penalty_range: null
    market_impact: []
    source_ref: 0
    last_verified: "2026-09-24"

  monitoring:
    tier: C
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: complete
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: medium
  notes:
    en: "Added at the user's request alongside PPWR and ESPR as commonly-needed EU consumer-electronics instruments (the user noted RED already covers radio/RF aspects; this entry covers the separate, non-radio-specific EMC essential requirements that apply to wired/non-radio electronic equipment). Compiled article-by-article from the UK National Archives' retained-EU-law mirror (legislation.gov.uk), since EUR-Lex itself remained unfetchable this session as in prior research. Confirmed word-for-word: scope and exclusions (Art. 2, including the explicit carve-out for radio equipment now under RED), transposition/application date 20 April 2016 (Art. 46), manufacturer obligations including the 10-year record-retention period (Art. 7), importer obligations (Art. 9), distributor obligations (Art. 10), that an authorised representative is optional (Art. 8), the free-choice (not harmonised-standard-gated) conformity assessment module structure (Art. 14), and that penalties are set by national law (Art. 42, quoted). Confidence raised from low to medium under the schema's upgrade rule (entry_status now complete, all key fields traceable to directly-read primary text). This is NOT equivalent to human review; review_status remains pending. NOT yet confirmed: exact article numbers for the general 'deemed manufacturer' rule (Art. 11) referenced in earlier drafting but not independently re-verified this pass, and — importantly — the amending Directive (EU) 2024/2749 (transposition due 29 May 2026, application from 30 May 2026) has not been reviewed for its substantive changes; this entry reflects the Directive as originally adopted in 2014, not as it will read after that 2026 amendment takes effect, and should be re-checked closer to that date. Pending word-for-word human review against EUR-Lex directly."
    zh: "本條目係依你的要求，與PPWR、ESPR一併新增之常見歐盟消費性電子相關規範（你指出RED已涵蓋無線電／RF相關規範；本條目則涵蓋另外適用於有線／非無線電電子設備之EMC基本要求，與RED分開規範）。逐條彙整自英國國家檔案館之歐盟保留法鏡像網站（legislation.gov.uk），因本次工作階段EUR-Lex本身仍如先前研究一樣無法擷取。已逐字確認：適用範圍及排除規定（第2條，含明確排除現已改由RED規範之無線電設備）、轉換／適用日期2016年4月20日（第46條）、製造商義務含10年紀錄保存期間（第7條）、進口商義務（第9條）、經銷商義務（第10條）、歐盟授權代表為選擇性（第8條）、自由選擇（非依協調標準分流）之符合性評鑑模組結構（第14條）、罰則由會員國國內法訂定（第42條，已引用原文）。依schema升級規則，把握度已由low調升為medium（entry_status已轉為complete，關鍵欄位均可追溯至直接讀取之一手原文）。惟此仍非人工複核，review_status維持pending。尚未確認：先前草稿提及之「視為製造商」一般規則確切條文編號（第11條，本次未獨立重新查證）；更重要者，修正指令(EU) 2024/2749（轉換期限2026年5月29日，2026年5月30日起適用）尚未查證其實質修正內容——本條目所記載者為指令2014年原始採認版本，尚未反映該2026年修正生效後之內容，建議於該日期前再行查核。尚待人工逐字複核EUR-Lex原文。"

- id: eu-2025-40-ppwr
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EU) 2025/40 of the European Parliament and of the Council of 19 December 2024 on packaging and packaging waste, amending Regulation (EU) 2019/1020 and Directive (EU) 2019/904, and repealing Directive 94/62/EC (OJ L, 2025/40, 22.1.2025)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "Packaging and Packaging Waste Regulation (PPWR)"
    zh: "包裝與包裝廢棄物法規（PPWR）"
  category:
    - packaging
    - circular_economy

  product_scope:
    en: "Applies to all packaging, regardless of the material used, and to all packaging waste, whether originating from industry, other manufacturing, retail or distribution, offices, services or households, without prejudice to Union rules on hazardous-waste management and on safety/quality/health/hygiene of the packaged product (Arts. 1-2). Establishes requirements for the entire packaging life-cycle covering environmental sustainability, labelling, extended producer responsibility, waste prevention (minimisation of unnecessary packaging, re-use/refill), and collection/recycling. Repeals Directive 94/62/EC, with specified provisions of that Directive continuing to apply on a staggered schedule through 2029/2030 (Art. 70)."
    zh: "適用於所有包裝（不論材質）及所有包裝廢棄物，不論其源自工業、其他製造業、零售或配銷、辦公室、服務業或家庭，且不影響歐盟有害廢棄物管理規定及包裝內產品之安全／品質／衛生規定（第1、2條）。就包裝全生命週期建立要求，涵蓋環境永續性、標示、生產者延伸責任、廢棄物預防（減少不必要包裝、重複使用／填充），以及回收／再利用。廢止指令94/62/EC，惟該指令部分條文依排定時程持續適用至2029／2030年（第70條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
    - all_b2c_goods
  component_tags:
    - packaging
  applies_to:
    - manufacturer
    - producer
    - importer
    - seller

  status: in_force
  dates:
    published: "2025-01-22"
    application: "2026-08-12"
    labelling: "2028-08-12"
    transition_end: null

  requirements:
    marking: false
    local_representative: false
    local_testing: false
    registration: true
    conformity_assessment:
      - sdoc

  obligations:
    - actor: manufacturer
      action:
        en: "Only place on the market packaging that conforms with the requirements of Articles 5-12, carry out the applicable conformity assessment procedure (Art. 38, Annex VII Module A — internal production control, the sole procedure this Regulation provides for) and draw up technical documentation before placing packaging on the market, draw up an EU declaration of conformity where applicable, and keep the technical documentation and declaration of conformity for 5 years (single-use packaging) or 10 years (reusable packaging) from the date the packaging was placed on the market (Art. 15, Annex VII)."
        zh: "僅得投放市場符合第5至12條要求之包裝，於投放市場前執行適用之符合性評鑑程序（第38條、附件七Module A——內部生產管制，為本法規所提供之唯一程序）並編製技術文件，於適用情形製作歐盟符合性聲明，並自包裝投放市場之日起保存技術文件及符合性聲明達5年（一次性包裝）或10年（可重複使用包裝）（第15條、附件七）。"
    - actor: producer
      action:
        en: "Register in the national producer register of each Member State where packaging or packaged products are first made available on that Member State's territory, before making such packaging available; registration is a precondition of market access — a producer (or, where applicable, its authorised representative for extended producer responsibility) not registered in a given Member State may not place packaging on that Member State's market for the first time (Art. 44)."
        zh: "於首次在該會員國境內提供包裝或已包裝產品前，須於各該會員國之全國生產者登記系統完成登記；登記為進入市場之前提條件——未於特定會員國完成登記之生產者（或其生產者延伸責任授權代表，如適用）不得於該會員國首次投放包裝於市場（第44條）。"

  tools: []
  related: []

  sources:
    - url: "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=OJ:L_202500040"
      type: primary
      publisher: "EUR-Lex — Official Journal of the European Union, L series, Regulation (EU) 2025/40"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States must lay down rules on penalties applicable to infringements of this Regulation by 12 February 2027; penalties must be effective, proportionate and dissuasive, and penalties for infringement of the extended-producer-responsibility provisions (Arts. 24-29) must include administrative fines (Art. 68)."
      zh: "會員國須於2027年2月12日前訂定違反本法規之罰則；罰則須具有效性、比例性及嚇阻性，違反生產者延伸責任相關規定（第24至29條）之罰則須包含行政罰鍰（第68條）。"
    penalty_range: null
    market_impact: []
    source_ref: 0
    last_verified: "2026-09-24"

  monitoring:
    tier: C
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: complete
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: medium
  notes:
    en: "Added at the user's request as a commonly-needed EU instrument alongside EMC and ESPR (this project's scope already includes packaging as a component_tag per vocab.yml). Compiled by downloading the EUR-Lex Official Journal PDF directly (the 'OJ:L_202500040' URL form was fetchable where CELEX-style /legal-content/EN/TXT URLs returned empty content, consistent with prior research this session) and reading it locally with pdftotext. Confirmed word-for-word: scope (Arts. 1-2), publication date 22 January 2025 and general application date 12 August 2026 with entry into force 20 days after publication (Art. 71), the repeal of Directive 94/62/EC effective 12 August 2026 with staggered savings provisions (Art. 70), manufacturer obligations including the differentiated 5-year/10-year record-retention period (Art. 15), the conformity assessment procedure — Annex VII Module A (internal production control) is the sole procedure the Regulation provides, i.e. self-declaration only with no third-party route (Art. 38, Annex VII), the mandatory national producer-registration requirement that gates market access (Art. 44), and the penalty framework requiring administrative fines for EPR-provision infringements by 12 February 2027 (Art. 68). requirements.local_representative is set false: Art. 45(123) recital and Art. 44/45 text show the 'authorised representative for extended producer responsibility' is only required for producers established in another Member State selling via distance contracts, or optionally required by individual Member States for third-country producers — it is a conditional, Member-State-dependent obligation rather than an EU-wide mandatory requirement, so this entry follows the same strict-interpretation convention used elsewhere in this dataset (default false unless unconditionally mandatory) and this nuance is flagged here for human reviewers rather than silently defaulted. Confidence raised from low to medium under the schema's upgrade rule (entry_status now complete, all key fields traceable to directly-read primary text). This is NOT equivalent to human review; review_status remains pending. NOT yet confirmed: the labelling requirement date is recorded as the general labelling-system application date (12 August 2028) per Art. 71/Annex staggering but individual labelling sub-requirements have varying dates not yet itemised. dates.transition_end is left null because compliance obligations under PPWR are staggered across many different dates through 2040 by product/material category rather than a single transition-end date — a human reviewer should decide whether this warrants a different date-modeling approach. Pending word-for-word human review against the full 124-page Official Journal text."
    zh: "本條目係依你的要求，與EMC、ESPR一併新增之常見歐盟規範（本專案範圍已將packaging列為vocab.yml之component_tag）。彙整方式為直接下載EUR-Lex官方公報PDF（「OJ:L_202500040」網址格式可正常擷取，CELEX格式之/legal-content/EN/TXT網址則如本次工作階段先前之研究一樣回傳空白內容），並以pdftotext於本機解析。已逐字確認：適用範圍（第1、2條）、公布日2025年1月22日及一般適用日2026年8月12日，公布後20日生效（第71條）、指令94/62/EC於2026年8月12日起廢止，惟部分條文依排定時程持續適用（第70條）、製造商義務含依包裝類型區分之5年／10年紀錄保存期間（第15條）、符合性評鑑程序——附件七Module A（內部生產管制）為本法規所提供之唯一程序，即僅能自我聲明、無第三方驗證途徑（第38條、附件七）、作為市場進入前提之強制性全國生產者登記義務（第44條），以及要求於2027年2月12日前就生產者延伸責任相關規定之違反訂定含行政罰鍰之罰則框架（第68條）。requirements.local_representative設為false：依第123項理由及第44、45條原文，「生產者延伸責任授權代表」僅於「產品經由遠距契約銷售、生產者設立於另一會員國」時始有要求，或由個別會員國就「第三國生產者」選擇性規定為強制——屬條件式、依會員國而異之義務，而非歐盟全境一律強制之要求，故本條目沿用本資料集其他條目採用之嚴格認定慣例（除非無條件強制，否則預設false），並於此明確標註此細節供人工複核，而非逕自預設。依schema升級規則，把握度已由low調升為medium（entry_status已轉為complete，關鍵欄位均可追溯至直接讀取之一手原文）。惟此仍非人工複核，review_status維持pending。尚未確認：標示規定之日期係依第71條／附件所定一般標示制度適用日（2028年8月12日）記載，惟個別標示子項規定尚有不同日期，尚未逐項整理。dates.transition_end因PPWR依產品／材質類別將合規義務分散排定至2040年，並非單一過渡期截止日，故留空——是否應採不同日期建模方式，建議由人工複核決定。尚待人工逐字複核完整124頁官方公報文本。"

- id: eu-2024-1781-espr
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EU) 2024/1781 of the European Parliament and of the Council of 13 June 2024 establishing a framework for the setting of ecodesign requirements for sustainable products, amending Directive (EU) 2020/1828 and Regulation (EU) 2023/1542, and repealing Directive 2009/125/EC (OJ L, 2024/1781, 28.6.2024)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "Ecodesign for Sustainable Products Regulation (ESPR)"
    zh: "永續產品生態設計法規（ESPR）"
  category:
    - ecodesign
    - energy_related_products

  product_scope:
    en: "Establishes a framework for setting ecodesign requirements applicable to any physical goods placed on the market or put into service, including components and intermediate products, EXCLUDING food, feed, medicinal/veterinary medicinal products, living plants/animals/micro-organisms, products of human origin, products relating to future reproduction of plants/animals, and specified vehicle categories already covered by sector-specific type-approval legislation (Art. 1). Concrete product-specific requirements (durability, reparability, recycled content, energy performance, digital product passport, etc.) only become legally binding for a given product group once the Commission adopts a delegated act for that group under Art. 4 — the Regulation itself is a framework, not directly enforceable requirements. Repeals the former Ecodesign Directive 2009/125/EC, whose scope was limited to energy-related products only."
    zh: "為設定生態設計要求建立框架，適用於任何投放市場或啟用之實體商品，包含零組件及半成品，排除食品、飼料、藥品／動物用藥品、活體植物／動物／微生物、人體來源產品、與植物／動物未來繁殖相關之產品，以及已受特定產業型式認證法規規範之特定車輛類別（第1條）。具體產品要求（如耐用性、可修復性、再生材料含量、能源效率、數位產品護照等）僅於執委會依第4條為該產品類別採認授權法案後，始對該類別產生法律拘束力——本法規本身為框架性規範，非直接可執行之要求。廢止原生態設計指令2009/125/EC（適用範圍僅限能源相關產品）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2024-06-28"
    labelling: null
    transition_end: null

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: true
    conformity_assessment: [sdoc, third_party]
    conformity_assessment_note:
      en: "ESPR itself does not fix a single conformity assessment procedure: per Recitals 84-85, the applicable module(s) (self-declaration/internal production control through to third-party/notified-body involvement, drawn from the module structure of Decision No 768/2008/EC) are chosen separately for each product group by its own future delegated act under Art. 4. Both self-declaration and third-party routes remain structurally possible depending on the product group; as of last_verified this has not been cross-checked per product group against the Commission's ESPR working plan."
      zh: "ESPR本身並未固定單一符合性評鑑程序：依前言第84、85點，適用之模組（自我聲明／內部生產管制，乃至第三方／驗證機構參與，均取自決定768/2008/EC之模組架構）係由執委會針對各產品類別依第4條另行採認之授權法案分別決定。故自我聲明與第三方驗證兩種路徑就結構而言均屬可能，實際適用視產品類別而定；截至last_verified日期為止，尚未逐一對照執委會ESPR工作計畫查核各產品類別之實際選擇。"

  obligations:
    - actor: manufacturer
      action:
        en: "For products covered by a product-specific delegated act adopted under Art. 4: ensure the product meets the performance requirements of that delegated act, ensure the product is accompanied by required information and a digital product passport, carry out the applicable conformity assessment procedure and draw up technical documentation before placing the product on the market, draw up an EU declaration of conformity and affix CE marking, and keep the technical documentation and declaration of conformity for 10 years after the product is placed on the market unless the delegated act specifies otherwise (Art. 27)."
        zh: "就經第4條產品別授權法案涵蓋之產品：確保產品符合該授權法案之效能要求，確保產品備有所需資訊及數位產品護照，於投放市場前執行適用之符合性評鑑程序並編製技術文件，製作歐盟符合性聲明並張貼CE標誌，且除授權法案另有規定外，於產品投放市場後保存技術文件與符合性聲明達10年（第27條）。"
    - actor: importer
      action:
        en: "Before placing a covered product on the market: verify that the manufacturer has carried out the applicable conformity assessment procedure and drawn up the technical documentation, verify that the digital product passport is available (with a backup access solution per Art. 10(4)), verify that the product bears the required CE/alternative marking, indicate their own name, registered trade name or trade mark, and contact address on the digital product passport, on the product itself, or on accompanying documentation; ensure digital instructions are provided in a language easily understood by customers; ensure storage/transport conditions under their responsibility do not jeopardise compliance; take corrective action, withdraw or recall non-compliant products and immediately inform market surveillance authorities where they have reason to believe a product is non-compliant; and, upon a reasoned request from a competent national authority, provide all necessary information/documentation (including keeping the declaration of conformity and technical documentation available for market surveillance authorities for 10 years, unless a delegated act specifies otherwise) within 15 days (Art. 29)."
        zh: "於投放涵蓋產品於市場前：查核製造商已完成適用之符合性評鑑程序並編製技術文件、查核數位產品護照可取得（並依第10(4)條備有備援存取方案）、查核產品已張貼所需之CE標誌或替代標誌；於數位產品護照、產品本身或隨附文件上標示自身名稱、註冊商號或商標及聯絡地址；確保以顧客易於理解之語言提供數位使用說明；確保其負責之儲存或運輸條件不致危害合規性；於有理由認為產品不合規時，採取矯正措施、下架或召回產品，並立即通知市場監督主管機關；並於主管機關提出有理由之請求後15日內，提供一切必要資訊／文件（含除授權法案另有規定外，為市場監督主管機關保存符合性聲明與技術文件達10年）（第29條）。"
    - actor: seller
      action:
        en: "Before making a covered product available on the market, distributors shall verify that the product bears the required CE/alternative marking and, where relevant, is labelled or linked to a digital product passport; that it is accompanied by required documents and digital instructions in a language easily understood by customers; and that the manufacturer and importer have complied with their respective name/contact-marking obligations (Art. 27(5)-(6), Art. 29(3)). Where a distributor has reason to believe a product (or its manufacturer) is non-compliant, it shall not make the product available until brought into conformity, shall ensure storage/transport conditions under its responsibility do not jeopardise compliance, shall take or ensure corrective action (including withdrawal or recall) and immediately inform market surveillance authorities of any suspected non-compliance, and shall provide all necessary information/documentation to a competent authority within 15 days of a reasoned request (Art. 30)."
        zh: "於使涵蓋產品可於市場上取得前，經銷商應查核產品已張貼所需之CE標誌或替代標誌，且於相關情形下已標示或連結至數位產品護照；產品備有所需文件及以顧客易於理解之語言提供之數位使用說明；且製造商與進口商已完成其各自之名稱／聯絡方式標示義務（第27(5)(6)條、第29(3)條）。經銷商若有理由相信產品（或其製造商）不合規，於產品經導正合規前不得使其可於市場上取得，應確保其負責之儲存或運輸條件不致危害合規性，應採取或確保採取矯正措施（含下架或召回），並就任何疑似不合規情形立即通知市場監督主管機關，且應於主管機關提出有理由之請求後15日內，提供一切必要資訊／文件（第30條）。"

  tools: []
  related:
    - eu-2014-30-emc

  sources:
    - url: "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=OJ:L_202401781"
      type: primary
      publisher: "EUR-Lex — Official Journal of the European Union, L series, Regulation (EU) 2024/1781"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States lay down rules on penalties applicable to infringements of this Regulation, giving due regard to factors including the nature/gravity/duration of the infringement, intentional or negligent character, financial situation of the responsible party, economic benefit derived, and environmental damage caused; Member States must be able to impose at least fines among other penalty types (Art. 74)."
      zh: "會員國訂定違反本法規之罰則，並應考量違規之性質／嚴重程度／持續時間、是否故意或過失、責任人之財務狀況、因違規所獲經濟利益，以及所造成之環境損害等因素；會員國至少須能對違規課處罰鍰等罰則（第74條）。"
    penalty_range: null
    market_impact: []
    source_ref: 0
    last_verified: "2026-09-24"

  monitoring:
    tier: B
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: stub
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: medium
  notes:
    en: "Added at the user's request alongside EMC and PPWR ('ErP' in the user's shorthand — the old Ecodesign Directive 2009/125/EC for energy-related products, now superseded by this broader ESPR framework regulation). Compiled by downloading the EUR-Lex Official Journal PDF directly (the 'OJ:L_202401781' URL form was fetchable where CELEX-style URLs returned empty content) and reading it locally with pdftotext. Confirmed word-for-word: scope and exclusions (Art. 1), that ESPR is a framework regulation whose concrete requirements only bind manufacturers once product-specific delegated acts are adopted under Art. 4 (i.e. there is currently no single 'application date' for the Regulation's substantive requirements as a whole — the dates.application key is genuinely omitted, which the schema's own stub-required rules permit, rather than set to a guessed value, since the true answer varies per future product-group delegated act), manufacturer obligations including the 10-year record-retention default (Art. 27), importer obligations (Art. 29) and distributor obligations (Art. 30) in full, that appointing an authorised representative is optional not mandatory (Art. 28, confirming requirements.local_representative: false), that Art. 13 establishes an EU-level central digital product passport registry (not a national/local registration) which economic operators must upload data to and which issues a unique registration identifier used for customs release (Art. 13, 15) — recorded as requirements.registration: true on that basis, though this registry is itself only operational once implementing acts under Art. 13(5) are adopted, and the conformity-assessment module split described in Recitals 84-85 (procedure chosen per product group via future delegated acts, drawing on the Decision 768/2008/EC module structure, mirroring RED/EMC's pattern), and the penalty framework's mandatory consideration factors (Art. 74). Entry into force is 20 days after the 28 June 2024 Official Journal publication (Art. 80), i.e. approximately 18 July 2024, consistent with secondary sources, though the exact +20-day arithmetic was not independently re-verified against a calendar in this session. Per the schema's confidence-upgrade rule, confidence is raised to medium: all filled fields are traced to directly-read primary-source text, and the entry's remaining entry_status: stub is a structural consequence of ESPR being a framework regulation (no fixed dates.application, no fixed single conformity-assessment procedure) rather than a symptom of incomplete research. NOT yet confirmed: which specific product groups (if any) already have adopted Art. 4 delegated acts as of the last_verified date (this changes over time and would need to be checked separately against the Commission's ESPR working plan), and the relationship/overlap between ESPR framework obligations and any pre-existing Ecodesign Directive 2009/125/EC implementing measures that remain in force during the transition (per Art. 1(2), (3) transitional provisions not yet reviewed in detail). Pending word-for-word human review against the full 89-page Official Journal text before confidence can be raised to high."
    zh: "本條目係依你的要求，與EMC、PPWR一併新增（你所稱「ErP」，即原適用於能源相關產品之生態設計指令2009/125/EC，現已由本ESPR框架法規取代並擴大範圍）。彙整方式為直接下載EUR-Lex官方公報PDF（「OJ:L_202401781」網址格式可正常擷取，CELEX格式網址則回傳空白內容），並以pdftotext於本機解析。已逐字確認：適用範圍及排除規定（第1條）、ESPR為框架性法規，具體要求僅於執委會依第4條為個別產品類別採認授權法案後始對製造商產生拘束力（即本法規實質要求目前並無單一整體「適用日期」——dates.application欄位確實省略，此為schema對stub條目所允許之情形，而非臆測填入之數值，因其真實答案將依未來各產品類別授權法案而異）、製造商義務含10年紀錄保存預設規定（第27條）、進口商義務（第29條）與經銷商義務（第30條）之完整內容、指定授權代表為選擇性而非強制性規定（第28條，確認requirements.local_representative應為false）、第13條建立歐盟層級之中央數位產品護照登錄系統（並非會員國個別登記），經濟營運者須將資料上傳至該系統，該系統並核發供海關放行使用之唯一登錄識別碼（第13、15條）——據此將requirements.registration記為true，惟此登錄系統本身須待第13(5)條之施行法案採認後始正式運作；以及前言第84、85點所述之符合性評鑑模組分工架構（依產品類別由未來授權法案分別決定，援引決定768/2008/EC之模組架構，與RED／EMC模式相仿），與罰則框架應考量之強制因素（第74條）。生效日為公報公布（2024年6月28日）後20日（第80條），約為2024年7月18日，與二手來源一致，惟本次工作階段未獨立以日曆覆核此20日加總計算是否精確。依schema之把握度升級規則，本條目把握度提升為medium：所有已填欄位均可追溯至直接閱讀之一手來源文字，且本條目仍維持entry_status: stub係因ESPR為框架性法規之結構性因素所致（無固定之dates.application、無固定單一符合性評鑑程序），而非研究不足之結果。尚未確認：截至last_verified日期為止，究竟哪些產品類別（如有）已採認第4條授權法案（此會隨時間變動，須另行對照執委會ESPR工作計畫查證）、ESPR框架義務與過渡期間仍有效之原生態設計指令2009/125/EC既有施行措施間之關係／重疊情形（依第1(2)(3)條過渡規定，尚未詳細查證）。尚待人工逐字複核完整89頁官方公報文本後，把握度方可提升為high。"

- id: global-iecee-cb-scheme
  parent: null
  superseded_by: null
  jurisdiction: GLOBAL
  applies_in: []
  citation: "IECEE 01-S, Edition 5.1 (2025-03-20), IECEE Supplement to Basic Rules IEC CA 01 — IEC System of Conformity Assessment Schemes for Electrotechnical Equipment and Components (IECEE), operated under the IECEE CB Scheme"
  local_type: "Voluntary international mutual-recognition conformity assessment scheme (not a statutory instrument of any single jurisdiction)"
  instrument_type: guidance
  short_name:
    en: "IEC/IECEE CB Scheme"
    zh: "IEC/IECEE CB 認證體系（CB Scheme）"
  category:
    - conformity_assessment
    - mutual_recognition
    - voluntary_scheme

  product_scope:
    en: "Covers electrotechnical equipment and components within the IECEE's 24 approved product Categories listed in IECEE 01-S Annex BB: batteries (BATT), cables and cords (CABL), capacitors as components (CAP), switches/automatic controls for household appliances (CONT), cybersecurity (CYBR), energy efficiency (E3), electric vehicles (ELVH), electromagnetic compatibility (EMC), household and similar equipment (HOUS), industrial automation (INDA), installation accessories and connection devices (INST), information technology audio video (ITAV), lighting (LITE), measuring instruments (MEAS), electrical equipment for medical use (MED), miscellaneous (MISC), IT and office equipment (OFF), low voltage high power switching equipment (POW), installation protective equipment (PROT), photovoltaics (PV), safety transformers and similar equipment (SAFE), portable tools (TOOL), and electronics/entertainment (TRON). Test standards used are IEC Standards (or, where none exists for a product in an approved Category, ISO or ITU standards) (Annex AA)."
    zh: "涵蓋IECEE 01-S附件BB所列24項核准產品類別範圍內之電工設備與零組件：電池（BATT）、線材與電線（CABL）、電容器零組件（CAP）、家電用開關／自動控制器（CONT）、資安（CYBR）、能源效率（E3）、電動車（ELVH）、電磁相容（EMC）、家用及類似設備（HOUS）、工業自動化（INDA）、安裝配件與連接裝置（INST）、資訊技術影音設備（ITAV）、照明（LITE）、量測儀器（MEAS）、醫療用電氣設備（MED）、其他（MISC）、資訊技術及辦公設備（OFF）、低壓大功率開關設備（POW）、安裝保護設備（PROT）、太陽光電（PV）、安全變壓器及類似設備（SAFE）、可攜式工具（TOOL）、電子及娛樂設備（TRON）。測試標準採用IEC標準（若核准類別內產品無對應IEC標準，則採ISO或ITU標準）（附件AA）。"
