ure re-fetch attempt and full human review. related is left empty ([]) rather than guessing a plausible cross-reference, given the overall low-confidence state of this entry."
    zh: "本條目係作為新一批歐盟環保法規（REACH→EUDR→一次性塑膠指令→氟化氣體法規→CLP法規）之第四項新增。記為entry_status: stub／confidence: low，與本次工作階段EUDR條目之前例相同，原因在於存在真實且未解決之來源缺口，而非該法規本身之結構性因素：本次工作階段對EUR-Lex之每一次直接擷取嘗試（CELEX:32024R0573 HTML版、OJ:L_202400573 HTML及PDF版、合併版CELEX:02024R0573-20240220 HTML版、eli/reg/2024/573/oj/eng，以及EUR-Lex法律摘要／LSU頁面）均回傳空白或無法讀取之內容，先前於CRA條目成功使用、亦曾嘗試用於EUDR條目之次要全文鏡像網站（service.betterregulation.com）本次亦回傳HTTP 403錯誤。本次工作階段唯一成功完整擷取並閱讀之來源，係一次要之合規產業部落格（adherent.com，其內容本身轉載自complianceandrisks.com），其摘要（而非逐字引用）本法規之適用範圍、HFC逐步淘汰時程、產品禁令時間表、標示要求，及F-gas入口網站登記／配額制度；此部落格層級摘要較一手法律文字之距離，甚至較EUDR之情形更遠一層（EUDR至少取得網路搜尋摘錄之service.betterregulation.com逐條文字引文）。本條目obligations／enforcement文字中所引之確切條號（第12條標示、約第20條登記），本身係取自網路搜尋結果標題中引用service.betterregulation.com之逐條頁面標題，非取自直接讀取之條文文字，應視為指示性而非確認性資訊。罰則條文本次工作階段完全未能確認（搜尋「第31條」／「第32條罰則」未尋得確認相符結果——經搜尋發現第32條實為授權立法就回收／銷毀可行性清單訂定授權法案，非罰則規定）。此為（繼EUDR之後）第二項高優先待辦事項，待未來重新擷取並進行完整人工複核。related留空（[]），未臆測合理之交叉引用，以符本條目整體低信心度之狀態。"

- id: eu-2008-1272-clp
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EC) No 1272/2008 of the European Parliament and of the Council of 16 December 2008 on classification, labelling and packaging of substances and mixtures, amending and repealing Directives 67/548/EEC and 1999/45/EC, and amending Regulation (EC) No 1907/2006 (OJ L 353, 31.12.2008, p. 1-1355)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "CLP Regulation"
    zh: "CLP法規（化學品分類、標示與包裝法規）"
  category:
    - hazardous_substances
    - registration_authorisation

  product_scope:
    en: "Applies to substances and mixtures placed on the EU market, requiring manufacturers, importers and downstream users to classify them per Annex I hazard criteria before placing on the market, and requiring suppliers to label and package hazardous substances/mixtures accordingly (Art. 1(1)); manufacturers and importers must also notify ECHA of classification/labelling for substances not registered under REACH (Art. 1(1)(c)). Excludes, among others, radioactive substances, customs-supervised goods, non-isolated intermediates, and finished medicinal products/cosmetics/food in final form (Art. 1(2)-(6)). Consumer-electronics relevance is indirect: applies to hazardous chemical substances/mixtures used in or associated with electronics manufacturing (e.g. battery electrolytes, flame retardants, adhesives, cleaning agents) that must carry CLP-compliant hazard labelling (pictograms, signal words 'Danger'/'Warning') on their own packaging when supplied, rather than to finished consumer products directly."
    zh: "適用於投放歐盟市場之物質與混合物，要求製造商、進口商及下游使用者於投放市場前依附件I危害基準予以分類（第1(1)條），並要求供應商就危害性物質／混合物依規定標示及包裝；製造商及進口商亦須就未依REACH登記之物質，向歐洲化學總署（ECHA）通報其分類與標示資訊（第1(1)(c)條）。排除項目包括放射性物質、海關監管貨物、未分離中間體，以及最終型態之藥品／化妝品／食品等（第1(2)至(6)條）。與消費性電子之關聯屬間接：適用於電子產品製造過程中所使用或相關之危害性化學物質／混合物（例如電池電解液、阻燃劑、黏著劑、清潔劑），該等物質供應時之包裝須附CLP合規危害標示（象形圖、「危險」／「警告」信號詞），而非直接適用於成品消費性產品本身。"
  product_tags:
    - all_b2c_goods
  component_tags:
    - battery
    - power_supply
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2008-12-31"
    application: "2009-01-20"
    labelling: "2010-12-01"
    transition_end: "2015-06-01"

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: true
    conformity_assessment: [none]
    conformity_assessment_note: null

  obligations:
    - actor: manufacturer
      action:
        en: "Classify substances and mixtures placed on the market against the Annex I hazard criteria before placing them on the market (Art. 1(1)(b)(i), Art. 4); label and package hazardous substances/mixtures in accordance with Title III (labelling) and Title IV (packaging) requirements as a supplier; and, for substances not already registered under REACH, notify the classification and labelling information to ECHA for inclusion in the Classification and Labelling Inventory (Art. 1(1)(c))."
        zh: "於投放市場前，依附件I危害基準對投放市場之物質及混合物進行分類（第1(1)(b)(i)條、第4條）；作為供應商，依第III編（標示）及第IV編（包裝）規定對危害性物質／混合物進行標示及包裝；就尚未依REACH登記之物質，向ECHA通報其分類及標示資訊，以納入分類與標示清冊（第1(1)(c)條）。"
    - actor: importer
      action:
        en: "As a person placing substances or mixtures on the EU market from outside the Union, bear the same Art. 4 classification obligation and Title III/IV labelling and packaging obligations as manufacturers when first placing such substances/mixtures on the market, and notify ECHA of classification/labelling for non-REACH-registered substances (Art. 1(1)(c))."
        zh: "作為將物質或混合物自歐盟境外投放歐盟市場者，於首次投放市場時，負擔與製造商相同之第4條分類義務，及第III／IV編標示與包裝義務，並就尚未依REACH登記之物質向ECHA通報其分類及標示資訊（第1(1)(c)條）。"
    - actor: seller
      action:
        en: "As a distributor/downstream user supplying already-classified substances or mixtures further along the supply chain, ensure the substance or mixture continues to be labelled and packaged in accordance with Title III/IV requirements, and may rely on the classification already carried out by an actor further up the supply chain provided the composition of the substance or mixture is not changed."
        zh: "作為於供應鏈下游供應已完成分類之物質或混合物之經銷商／下游使用者，應確保該物質或混合物持續依第III／IV編規定標示及包裝，並得於物質或混合物成分未變更之前提下，援用供應鏈上游行為者已完成之分類結果。"

  tools: []
