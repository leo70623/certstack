  notes:
    en: "Added at the user's request as a commonly-needed EU instrument alongside EMC and ESPR (this project's scope already includes packaging as a component_tag per vocab.yml). Compiled by downloading the EUR-Lex Official Journal PDF directly (the 'OJ:L_202500040' URL form was fetchable where CELEX-style /legal-content/EN/TXT URLs returned empty content, consistent with prior research this session) and reading it locally with pdftotext. Confirmed word-for-word: scope (Arts. 1-2), publication date 22 January 2025 and general application date 12 August 2026 with entry into force 20 days after publication (Art. 71), the repeal of Directive 94/62/EC effective 12 August 2026 with staggered savings provisions (Art. 70), manufacturer obligations including the differentiated 5-year/10-year record-retention period (Art. 15), and the penalty framework requiring administrative fines for EPR-provision infringements by 12 February 2027 (Art. 68). NOT yet confirmed: requirements.local_representative/local_testing/registration, requirements.conformity_assessment enum mapping (Art. 38 conformity assessment procedure not yet cross-referenced against the schema's conformity_assessment values), the extended-producer-responsibility registration obligations (Arts. 44-47, not yet reviewed), and the labelling requirement date is recorded as the general labelling-system application date (12 August 2028) per Art. 71/Annex staggering but individual labelling sub-requirements have varying dates not yet itemised. dates.transition_end is left null because compliance obligations under PPWR are staggered across many different dates through 2040 by product/material category rather than a single transition-end date — a human reviewer should decide whether this warrants a different date-modeling approach. Pending word-for-word human review against the full 124-page Official Journal text."
    zh: "本條目係依你的要求，與EMC、ESPR一併新增之常見歐盟規範（本專案範圍已將packaging列為vocab.yml之component_tag）。彙整方式為直接下載EUR-Lex官方公報PDF（「OJ:L_202500040」網址格式可正常擷取，CELEX格式之/legal-content/EN/TXT網址則如本次工作階段先前之研究一樣回傳空白內容），並以pdftotext於本機解析。已逐字確認：適用範圍（第1、2條）、公布日2025年1月22日及一般適用日2026年8月12日，公布後20日生效（第71條）、指令94/62/EC於2026年8月12日起廢止，惟部分條文依排定時程持續適用（第70條）、製造商義務含依包裝類型區分之5年／10年紀錄保存期間（第15條），以及要求於2027年2月12日前就生產者延伸責任相關規定之違反訂定含行政罰鍰之罰則框架（第68條）。尚未確認：requirements.local_representative／local_testing／registration、requirements.conformity_assessment之enum對應（第38條符合性評鑑程序尚未對照schema之conformity_assessment列舉值）、生產者延伸責任登記義務（第44至47條，尚未查證）、標示規定之日期係依第71條／附件所定一般標示制度適用日（2028年8月12日）記載，惟個別標示子項規定尚有不同日期，尚未逐項整理。dates.transition_end因PPWR依產品／材質類別將合規義務分散排定至2040年，並非單一過渡期截止日，故留空——是否應採不同日期建模方式，建議由人工複核決定。尚待人工逐字複核完整124頁官方公報文本。"

- id: eu-2024-1781-espr
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EU) 2024/1781 of the European Parliament and of the Council of 13 June 2024 establishing a framework for the setting of ecodesign requirements for sustainable products, amending Directive (EU) 2020/1828 and Regulation (EU) 2023/1542, and repealing Directive 2009/125/EC (OJ L, 2024/1781, 28.6.2024)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "Ecodesign for Sustainable Products Regulation (ESPR)"
    zh: "永續產品生態設計法規（ESPR）"
  category:
    - ecodesign
    - energy_related_products

  product_scope:
    en: "Establishes a framework for setting ecodesign requirements applicable to any physical goods placed on the market or put into service, including components and intermediate products, EXCLUDING food, feed, medicinal/veterinary medicinal products, living plants/animals/micro-organisms, products of human origin, products relating to future reproduction of plants/animals, and specified vehicle categories already covered by sector-specific type-approval legislation (Art. 1). Concrete product-specific requirements (durability, reparability, recycled content, energy performance, digital product passport, etc.) only become legally binding for a given product group once the Commission adopts a delegated act for that group under Art. 4 — the Regulation itself is a framework, not directly enforceable requirements. Repeals the former Ecodesign Directive 2009/125/EC, whose scope was limited to energy-related products only."
    zh: "為設定生態設計要求建立框架，適用於任何投放市場或啟用之實體商品，包含零組件及半成品，排除食品、飼料、藥品／動物用藥品、活體植物／動物／微生物、人體來源產品、與植物／動物未來繁殖相關之產品，以及已受特定產業型式認證法規規範之特定車輛類別（第1條）。具體產品要求（如耐用性、可修復性、再生材料含量、能源效率、數位產品護照等）僅於執委會依第4條為該產品類別採認授權法案後，始對該類別產生法律拘束力——本法規本身為框架性規範，非直接可執行之要求。廢止原生態設計指令2009/125/EC（適用範圍僅限能源相關產品）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2024-06-28"
    labelling: null
    transition_end: null

  requirements:
    marking: true

  obligations:
    - actor: manufacturer
      action:
        en: "For products covered by a product-specific delegated act adopted under Art. 4: ensure the product meets the performance requirements of that delegated act, ensure the product is accompanied by required information and a digital product passport, carry out the applicable conformity assessment procedure and draw up technical documentation before placing the product on the market, draw up an EU declaration of conformity and affix CE marking, and keep the technical documentation and declaration of conformity for 10 years after the product is placed on the market unless the delegated act specifies otherwise (Art. 27)."
        zh: "就經第4條產品別授權法案涵蓋之產品：確保產品符合該授權法案之效能要求，確保產品備有所需資訊及數位產品護照，於投放市場前執行適用之符合性評鑑程序並編製技術文件，製作歐盟符合性聲明並張貼CE標誌，且除授權法案另有規定外，於產品投放市場後保存技術文件與符合性聲明達10年（第27條）。"

  tools: []
  related:
    - eu-2014-30-emc

  sources:
    - url: "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=OJ:L_202401781"
      type: primary
      publisher: "EUR-Lex — Official Journal of the European Union, L series, Regulation (EU) 2024/1781"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States lay down rules on penalties applicable to infringements of this Regulation, giving due regard to factors including the nature/gravity/duration of the infringement, intentional or negligent character, financial situation of the responsible party, economic benefit derived, and environmental damage caused; Member States must be able to impose at least fines among other penalty types (Art. 74)."
      zh: "會員國訂定違反本法規之罰則，並應考量違規之性質／嚴重程度／持續時間、是否故意或過失、責任人之財務狀況、因違規所獲經濟利益，以及所造成之環境損害等因素；會員國至少須能對違規課處罰鍰等罰則（第74條）。"
    penalty_range: null
    market_impact: []
    source_ref: 0
    last_verified: "2026-09-24"

  entry_status: stub
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: low
  notes:
    en: "Added at the user's request alongside EMC and PPWR ('ErP' in the user's shorthand — the old Ecodesign Directive 2009/125/EC for energy-related products, now superseded by this broader ESPR framework regulation). Compiled by downloading the EUR-Lex Official Journal PDF directly (the 'OJ:L_202401781' URL form was fetchable where CELEX-style URLs returned empty content) and reading it locally with pdftotext. Confirmed word-for-word: scope and exclusions (Art. 1), that ESPR is a framework regulation whose concrete requirements only bind manufacturers once product-specific delegated acts are adopted under Art. 4 (i.e. there is currently no single 'application date' for the Regulation's substantive requirements as a whole — the dates.application key is omitted entirely rather than set to null or guessed, since the schema disallows a null value for that field and the true answer varies per future product-group delegated act), manufacturer obligations including the 10-year record-retention default (Art. 27), and the penalty framework's mandatory consideration factors (Art. 74). Entry into force is 20 days after the 28 June 2024 Official Journal publication (Art. 80), i.e. approximately 18 July 2024, consistent with secondary sources, though the exact +20-day arithmetic was not independently re-verified against a calendar in this session. NOT yet confirmed: requirements.local_representative/local_testing/registration, requirements.conformity_assessment enum mapping, which specific product groups (if any) already have adopted Art. 4 delegated acts as of the last_verified date (this would need to be checked against the Commission's ESPR working plan separately and kept current, since it changes over time), and the relationship/overlap between ESPR framework obligations and any pre-existing Ecodesign Directive 2009/125/EC implementing measures that remain in force during the transition (per Art. 1(2), (3) transitional provisions not yet reviewed in detail). Pending word-for-word human review against the full 89-page Official Journal text."
    zh: "本條目係依你的要求，與EMC、PPWR一併新增（你所稱「ErP」，即原適用於能源相關產品之生態設計指令2009/125/EC，現已由本ESPR框架法規取代並擴大範圍）。彙整方式為直接下載EUR-Lex官方公報PDF（「OJ:L_202401781」網址格式可正常擷取，CELEX格式網址則回傳空白內容），並以pdftotext於本機解析。已逐字確認：適用範圍及排除規定（第1條）、ESPR為框架性法規，具體要求僅於執委會依第4條為個別產品類別採認授權法案後始對製造商產生拘束力（即本法規實質要求目前並無單一整體「適用日期」——dates.application欄位因schema不允許null值，故整個省略而非設為null或臆測，因其真實答案將依未來各產品類別授權法案而異）、製造商義務含10年紀錄保存預設規定（第27條），以及罰則框架應考量之強制因素（第74條）。生效日為公報公布（2024年6月28日）後20日（第80條），約為2024年7月18日，與二手來源一致，惟本次工作階段未獨立以日曆覆核此20日加總計算是否精確。尚未確認：requirements.local_representative／local_testing／registration、requirements.conformity_assessment之enum對應、截至last_verified日期為止，究竟哪些產品類別（如有）已採認第4條授權法案（此須另行對照執委會ESPR工作計畫查證，且因會隨時間變動而須持續更新）、ESPR框架義務與過渡期間仍有效之原生態設計指令2009/125/EC既有施行措施間之關係／重疊情形（依第1(2)(3)條過渡規定，尚未詳細查證）。尚待人工逐字複核完整89頁官方公報文本。"

- id: global-iecee-cb-scheme
