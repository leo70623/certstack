    en: "EU Deforestation Regulation (EUDR)"
    zh: "歐盟森林砍伐防制法規（EUDR）"
  category:
    - due_diligence
    - supply_chain

  product_scope:
    en: "Applies to the placing on the market, making available on the market, and export from the EU of the 'relevant commodities' listed in Annex I — cattle, cocoa, coffee, oil palm, rubber, soya and wood — and 'relevant products' derived from or containing them, per Annex I's detailed product list. Consumer-electronics relevance is indirect but real: natural rubber is used in cable insulation, gaskets and seals, and wood/paper-based packaging materials fall within the wood commodity's derived-product scope. Products must be (i) deforestation-free (produced on land not subject to deforestation/forest degradation after 31 December 2020), (ii) produced in compliance with the relevant legislation of the country of production, and (iii) covered by a due diligence statement (Art. 3)."
    zh: "適用於附件I所列「相關原物料」——牛隻、可可、咖啡、油棕、橡膠、大豆及木材——之投放市場、於市場上取得，以及自歐盟出口，以及依附件I詳細產品清單所定源自或含有該等原物料之「相關產品」。與消費性電子之關聯雖屬間接惟確實存在：天然橡膠用於電纜絕緣層、墊圈及密封件，木材／紙類包裝材料則屬木材原物料之衍生產品範圍。產品須符合：(i) 不涉及森林砍伐（其生產土地於2020年12月31日後未發生森林砍伐／森林退化）；(ii) 依生產國相關法律生產；及(iii) 備有盡職調查聲明（第3條）。"
  product_tags:
    - all_b2c_goods
  component_tags:
    - packaging
    - cable_connector
  applies_to:
    - manufacturer
    - importer

  status: adopted
  dates:
