  notes:
    en: "Added at the user's request alongside PPWR and ESPR as commonly-needed EU consumer-electronics instruments (the user noted RED already covers radio/RF aspects; this entry covers the separate, non-radio-specific EMC essential requirements that apply to wired/non-radio electronic equipment). Compiled article-by-article from the UK National Archives' retained-EU-law mirror (legislation.gov.uk), since EUR-Lex itself remained unfetchable this session as in prior research. Confirmed: scope and exclusions (Art. 2, including the explicit carve-out for radio equipment now under RED), transposition/application date 20 April 2016 (Art. 46), manufacturer obligations including the 10-year record-retention period (Art. 7), that an authorised representative is optional (Art. 8), and that penalties are set by national law (Art. 42, quoted). NOT yet confirmed: exact article numbers for importer/distributor obligations beyond the general 'deemed manufacturer' rule (Art. 11), requirements.local_testing/registration, requirements.conformity_assessment module mapping (Annex II/III), and the amending Directive (EU) 2024/2749 (transposition due 29 May 2026, application from 30 May 2026) has not been reviewed for its substantive changes — this entry reflects the directive as originally adopted, not as it will read after that 2026 amendment takes effect. Pending word-for-word human review against EUR-Lex directly."
    zh: "本條目係依你的要求，與PPWR、ESPR一併新增之常見歐盟消費性電子相關規範（你指出RED已涵蓋無線電／RF相關規範；本條目則涵蓋另外適用於有線／非無線電電子設備之EMC基本要求，與RED分開規範）。逐條彙整自英國國家檔案館之歐盟保留法鏡像網站（legislation.gov.uk），因本次工作階段EUR-Lex本身仍如先前研究一樣無法擷取。已確認：適用範圍及排除規定（第2條，含明確排除現已改由RED規範之無線電設備）、轉換／適用日期2016年4月20日（第46條）、製造商義務含10年紀錄保存期間（第7條）、歐盟授權代表為選擇性（第8條）、罰則由會員國國內法訂定（第42條，已引用原文）。尚未確認：進口商／經銷商義務除「視為製造商」一般規則（第11條）外之其他條文編號、requirements.local_testing／registration、requirements.conformity_assessment模組對應（附件二／三），以及修正指令(EU) 2024/2749（轉換期限2026年5月29日，2026年5月30日起適用）尚未查證其實質修正內容——本條目所記載者為指令原始採認版本，尚未反映該2026年修正生效後之內容。尚待人工逐字複核EUR-Lex原文。"

- id: eu-2025-40-ppwr
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EU) 2025/40 of the European Parliament and of the Council of 19 December 2024 on packaging and packaging waste, amending Regulation (EU) 2019/1020 and Directive (EU) 2019/904, and repealing Directive 94/62/EC (OJ L, 2025/40, 22.1.2025)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "Packaging and Packaging Waste Regulation (PPWR)"
    zh: "包裝與包裝廢棄物法規（PPWR）"
  category:
    - packaging
    - circular_economy

  product_scope:
    en: "Applies to all packaging, regardless of the material used, and to all packaging waste, whether originating from industry, other manufacturing, retail or distribution, offices, services or households, without prejudice to Union rules on hazardous-waste management and on safety/quality/health/hygiene of the packaged product (Arts. 1-2). Establishes requirements for the entire packaging life-cycle covering environmental sustainability, labelling, extended producer responsibility, waste prevention (minimisation of unnecessary packaging, re-use/refill), and collection/recycling. Repeals Directive 94/62/EC, with specified provisions of that Directive continuing to apply on a staggered schedule through 2029/2030 (Art. 70)."
    zh: "適用於所有包裝（不論材質）及所有包裝廢棄物，不論其源自工業、其他製造業、零售或配銷、辦公室、服務業或家庭，且不影響歐盟有害廢棄物管理規定及包裝內產品之安全／品質／衛生規定（第1、2條）。就包裝全生命週期建立要求，涵蓋環境永續性、標示、生產者延伸責任、廢棄物預防（減少不必要包裝、重複使用／填充），以及回收／再利用。廢止指令94/62/EC，惟該指令部分條文依排定時程持續適用至2029／2030年（第70條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
    - all_b2c_goods
  component_tags:
    - packaging
  applies_to:
    - manufacturer
    - producer
    - importer
    - seller

  status: in_force
  dates:
    published: "2025-01-22"
    application: "2026-08-12"
    labelling: "2028-08-12"
    transition_end: null

  requirements:
    marking: false

  obligations:
    - actor: manufacturer
      action:
        en: "Only place on the market packaging that conforms with the requirements of Articles 5-12, carry out the applicable conformity assessment procedure (Art. 38) and draw up technical documentation before placing packaging on the market, draw up an EU declaration of conformity where applicable, and keep the technical documentation and declaration of conformity for 5 years (single-use packaging) or 10 years (reusable packaging) from the date the packaging was placed on the market (Art. 15)."
        zh: "僅得投放市場符合第5至12條要求之包裝，於投放市場前執行適用之符合性評鑑程序（第38條）並編製技術文件，於適用情形製作歐盟符合性聲明，並自包裝投放市場之日起保存技術文件及符合性聲明達5年（一次性包裝）或10年（可重複使用包裝）（第15條）。"

  tools: []
  related: []

  sources:
