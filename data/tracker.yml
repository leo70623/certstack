  confidence: medium
  notes:
    en: "Added at the user's request as the final item in the RoHS→GPSR→WEEE→Battery Regulation→Cyber Resilience Act batch, identified as a gap: the CRA is the first horizontal, mandatory EU cybersecurity regulation applicable to essentially all consumer/IT/radio products with digital elements (distinct from RED's Art. 3(3)(d)-(f) delegated-act cybersecurity requirements, which apply only to radio equipment specifically, and from EN 18031, which is a harmonised standard supporting RED — see 'related'). Status is recorded as 'adopted' rather than 'in_force' because, although the Regulation formally entered into force in December 2024, its substantive essential-cybersecurity-requirement obligations (the ones modelled in this entry's requirements/obligations blocks) do not become legally enforceable until 2027-12-11 (used as dates.application), with only narrower reporting (Art. 14, from 2026-09-11) and conformity-assessment-body (Chapter IV, from 2026-06-11) provisions applying earlier (Art. 71). IMPORTANT SOURCING CAVEAT: this session, direct EUR-Lex fetches of this Regulation's own OJ/CELEX HTML pages (both the 'OJ:L_202402847' and 'CELEX:32024R2847' URI forms) consistently returned blank/empty content, unlike RoHS (legislation.gov.uk mirror) or GPSR/Battery Regulation (EUR-Lex itself worked for those). As a workaround, verbatim article text for Arts. 2 (scope), 13 (manufacturer), 19 (importer), 20 (distributor), and 64 (penalties) was instead sourced from craact.eu, a third-party compliance-reference site that publishes what it represents as a verbatim, article-by-article mirror of the official Regulation text; this was cross-checked for consistency across multiple articles (e.g. Art. 19's cross-references to Art. 13(15)/(16)/(19) and Art. 20's cross-references to Art. 13/19 track exactly as expected for a genuine mirror) and the OJ citation/key dates (entry into force, 2027-12-11 general application, 2026-09-11 Art. 14 date, 2026-06-11 Chapter IV date) were independently corroborated via web search against law-firm and EFTA secondary sources — but because the primary EUR-Lex text itself could not be directly fetched, this entry is sourced one step further removed from the official primary text than the other 4 entries in this batch, and should be prioritised for direct EUR-Lex/print-Official-Journal verification in a future human review pass. requirements.registration is false because the CRA has no EU/national product-registration requirement analogous to WEEE/Battery Regulation's producer registers (there is, however, an ENISA vulnerability-database notification duty under Art. 14, not modelled as 'registration' in this schema). monitoring.tier is set to A (rather than B/C used for the other entries in this batch) given the CRA's unusually high compliance stakes (fines up to 2.5% of global turnover) and the fact that its core obligations are still phasing in through 2027, making near-term monitoring of implementing/delegated acts and harmonised standards disproportionately important. Confidence is nonetheless kept at medium, not downgraded to low, because entry_status is complete and the fields are traced to a consistent, cross-verified source, even though that source is one step removed from EUR-Lex itself — this differs from the us-fcc-part-15 case (which was reverted to stub/low) in that here the missing link is the primary-source mirror's reliability, not missing/unconfirmed underlying facts."
    zh: "本條目係依你之要求，作為RoHS→GPSR→WEEE→電池法規→網路韌性法案批次之最終項目新增，經辨識為缺口：CRA為首部適用於幾乎所有內含數位元件之消費性／資訊技術／無線電產品之橫向強制性歐盟網路安全法規（有別於RED第3(3)(d)-(f)條僅適用於無線電設備之授權法案網路安全要求，亦有別於支援RED之協和標準EN 18031——參見related欄位）。status記為「adopted」而非「in_force」，係因本法規雖已於2024年12月正式生效，惟其實質基本網路安全要求義務（即本條目requirements／obligations區塊所建模者）須至2027-12-11起始具法律執行力（採為dates.application），僅較狹隘之通報義務（第14條，自2026-09-11起）及符合性評鑑機構規定（第四章，自2026-06-11起）較早適用（第71條）。重要來源說明：本次工作階段，直接擷取本法規自身之EUR-Lex OJ／CELEX HTML頁面（「OJ:L_202402847」及「CELEX:32024R2847」兩種URI格式）均一致回傳空白內容，與本批次之RoHS（採legislation.gov.uk鏡像）或GPSR／電池法規（EUR-Lex本身可擷取）不同。作為替代方案，第2條（適用範圍）、第13條（製造商）、第19條（進口商）、第20條（經銷商）及第64條（罰則）之逐字條文，改由craact.eu——一個聲稱提供官方法規文字逐條逐字鏡像之第三方合規參考網站——取得；已就多條文間之一致性進行交叉檢核（例如第19條援引第13條第15／16／19項、第20條援引第13／19條，其援引方式與真實鏡像應有之表現完全相符），並就官方公報引用資訊／關鍵日期（生效日、2027-12-11一般適用日、2026-09-11第14條適用日、2026-06-11第四章適用日）透過網路搜尋、獨立比對法律事務所及EFTA等次要來源加以佐證——惟因無法直接擷取EUR-Lex一手文字本身，本條目之來源層級較本批次其餘4筆條目多隔一層，應優先列入未來人工複核，直接對照EUR-Lex／官方公報印本查核。requirements.registration設為false，係因CRA並無類似WEEE／電池法規生產者登記制度之歐盟／各國產品登記要求（惟依第14條訂有向ENISA通報弱點資料庫之義務，本schema未將其建模為「registration」）。monitoring.tier設為A（不同於本批次其餘條目採用之B／C），係考量CRA合規風險異常之高（罰鍰最高達全球營業額2.5%），且其核心義務仍於2027年前分階段生效，故近期監控其授權／執行法案及協和標準之進展格外重要。把握度仍維持medium、未降為low，係因entry_status為complete，且各欄位均可追溯至一致、已交叉驗證之來源，僅該來源較EUR-Lex本身多隔一層——此與us-fcc-part-15遭降級為stub/low之情形不同：此處之缺口在於一手來源鏡像之可靠性層級，而非底層事實本身有缺漏或未經確認。"
