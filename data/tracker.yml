  notes:
    en: "Added at the user's request ('safety CB') alongside EMC/PPWR/ESPR. The CB Scheme is NOT a law or regulation of any single jurisdiction — it is a voluntary multilateral mutual-recognition system operated by the IEC's IECEE body, under which a single CB Test Certificate/CB Test Report issued by one participating National Certification Body (NCB) is accepted by other participating NCBs worldwide, so a manufacturer can obtain national safety certifications (e.g. individual country marks) without repeating the full test in each country. Because the schema's jurisdiction enum previously had no non-country/non-bloc option, a new 'GLOBAL' jurisdiction value was added to data/vocab.yml and data/schema.yml (and scripts/validate.py's JURISDICTIONS set) specifically to represent this kind of international voluntary scheme, distinct from any binding national or regional law. instrument_type is set to 'guidance' as the closest existing enum fit for a voluntary, non-statutory mutual-recognition framework (none of regulation/directive/mandatory_standard/administrative_measure/statute accurately describe it). Citation, product_scope (the 24 approved product Categories per Annex BB), and the conformity_assessment mechanism (inherently third-party, no self-declaration route) are all confirmed word-for-word by downloading and locally parsing (pdftotext) the actual current governing document, IECEE 01-S Edition 5.1 (2025-03-20) Annexes AA/BB — the iecee.org website itself returned HTTP 403 on direct fetch attempts, so only the general narrative description of the Scheme's history/purpose still relies on Wikipedia as a secondary source pending direct verification against IECEE 01-S/IECEE 02's full text. Confidence raised to medium per the schema's upgrade rule since the fields now filled (citation, product_scope, product_tags, component_tags, applies_to, requirements.conformity_assessment) are traced to directly-read primary-source Annex text; entry_status remains stub because this is not a statutory instrument with the usual dates/enforcement/monitoring structure the schema's 'complete' tier assumes (no dates.published/application, no national enforcement authority — IECEE self-administers scheme discipline via its own governance bodies, not a market-surveillance/penalty regime), which is a structural mismatch rather than a research gap. NOT yet confirmed: exhaustive list of participating countries/NCBs, and whether the CB Scheme should instead be modeled as a distinct 'voluntary scheme' resource type separate from statutory tracker entries in the site's UI. Pending human review."
    zh: "本條目係依你的要求（「safety CB」）與EMC／PPWR／ESPR一併新增。CB Scheme並非任何單一法域之法律或法規，而是由IEC旗下IECEE運作之自願性多邊互認體系：由一個參與國之國家認證機構（NCB）核發的CB測試證書／CB測試報告，可為全球其他參與NCB所接受，使製造商毋須在每個國家重複全套測試即可取得各國安全認證（如各國安規標誌）。由於schema原本的jurisdiction enum並無「非國家／非區域集團」選項，本次新增一個「GLOBAL」jurisdiction值至data/vocab.yml與data/schema.yml（以及scripts/validate.py的JURISDICTIONS集合），專門用以表示此類國際自願性制度，與任何具拘束力之國家或區域性法律區隔。instrument_type選用「guidance」，為現有enum中最接近自願性、非法定互認框架之選項（regulation／directive／mandatory_standard／administrative_measure／statute均不準確）。citation、product_scope（附件BB所列24項核准產品類別）及conformity_assessment機制（本質上為第三方驗證，無自我聲明途徑）均已透過下載並以pdftotext於本機解析實際現行治理文件——IECEE 01-S Edition 5.1（2025-03-20）附件AA／BB——逐字確認；iecee.org網站本身對直接擷取請求回傳HTTP 403，故僅Scheme歷史沿革／宗旨之一般敘述部分，目前仍仰賴Wikipedia作為次要來源，尚待對照IECEE 01-S／IECEE 02完整文本直接查證。依schema之把握度升級規則，因目前已填寫之欄位（citation、product_scope、product_tags、component_tags、applies_to、requirements.conformity_assessment）均可追溯至直接閱讀之附件一手來源文字，把握度提升為medium；entry_status維持stub，係因本條目並非傳統法規性質，不具schema「complete」層級所預設之日期／執法／監測結構（無dates.published／application，亦無國家執法機關——IECEE係透過自身治理機構自行管理Scheme紀律，而非市場監督／罰則體制），此為結構性不相容，而非研究不足所致。尚未確認：參與國家／NCB之完整清單，以及CB Scheme在網站UI中是否應以獨立之「自願性制度」資源型態與具法定拘束力條目區隔呈現。尚待人工複核。"

- id: eu-2011-65-rohs
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Directive 2011/65/EU of the European Parliament and of the Council of 8 June 2011 on the restriction of the use of certain hazardous substances in electrical and electronic equipment (recast) (OJ L 174, 1.7.2011, p. 88-110)"
  local_type: "Directive"
  instrument_type: directive
  short_name:
    en: "RoHS Directive (Restriction of Hazardous Substances)"
    zh: "限用有害物質指令（RoHS）"
  category:
    - hazardous_substances
    - chemicals

  product_scope:
    en: "Applies to electrical and electronic equipment (EEE) falling within the 11 categories of Annex I (Art. 2(1)). Excludes: military equipment necessary for Member States' security interests; equipment designed for space missions; equipment specifically designed to be part of other excluded equipment and only able to function as part of it; large-scale stationary industrial tools; large-scale fixed installations; means of transport (excluding non-type-approved electric two-wheel vehicles); non-road mobile machinery for professional use only; active implantable medical devices; photovoltaic panels intended for permanent professional installation; equipment specifically designed solely for R&D made available only on a B2B basis; and pipe organs (Art. 2(4)). Restricts, in homogeneous materials, lead, mercury, cadmium, hexavalent chromium, polybrominated biphenyls (PBB) and polybrominated diphenyl ethers (PBDE) at a maximum concentration value of 0.1% by weight each (0.01% for cadmium), and — since the phthalates were added to Annex II — bis(2-ethylhexyl) phthalate (DEHP), butyl benzyl phthalate (BBP), dibutyl phthalate (DBP) and diisobutyl phthalate (DIBP), also each at 0.1% (Art. 4, Annex II). Scope was expanded progressively to medical devices/monitoring instruments (from 2014-07-22), in vitro diagnostic devices (from 2016-07-22), industrial monitoring/control instruments (from 2017-07-22), and all other previously-unregulated EEE (from 2019-07-22); phthalate restrictions apply to medical devices/monitoring instruments from 2021-07-22 (Art. 4)."
    zh: "適用於符合附件I所列11類之電機電子設備（EEE）（第2(1)條）。排除：會員國安全利益所需之軍事設備、太空任務用設備、專為排除設備之一部分而設計且僅能作為該部分運作之設備、大型固定式工業工具、大型固定裝置、交通工具（不含未經型式認證之電動兩輪車）、僅供專業用途之非道路移動機械、主動植入式醫療器材、供專業永久安裝使用之太陽光電板、專為研發設計且僅以企業對企業方式提供之設備，以及風琴（第2(4)條）。就均質材料，限制鉛、汞、鎘、六價鉻、多溴聯苯（PBB）及多溴二苯醚（PBDE）之重量百分比最高濃度各為0.1%（鎘為0.01%）；附件II後續新增之鄰苯二甲酸酯類——鄰苯二甲酸二（2-乙基己）酯（DEHP）、鄰苯二甲酸丁苯甲酯（BBP）、鄰苯二甲酸二丁酯（DBP）及鄰苯二甲酸二異丁酯（DIBP）——亦各限0.1%（第4條、附件II）。適用範圍逐步擴大至醫療器材／監測儀器（自2014-07-22起）、體外診斷器材（自2016-07-22起）、工業用監測／控制儀器（自2017-07-22起）、及其餘先前未受規範之EEE（自2019-07-22起）；鄰苯二甲酸酯限制對醫療器材／監測儀器自2021-07-22起適用（第4條）。"
