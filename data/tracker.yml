  entry_status: stub
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: low
  notes:
    en: "Added at the user's request ('safety CB') alongside EMC/PPWR/ESPR. The CB Scheme is NOT a law or regulation of any single jurisdiction — it is a voluntary multilateral mutual-recognition system operated by the IEC's IECEE body, under which a single CB Test Certificate/CB Test Report issued by one participating National Certification Body (NCB) is accepted by other participating NCBs worldwide, so a manufacturer can obtain national safety certifications (e.g. individual country marks) without repeating the full test in each country. Because the schema's jurisdiction enum previously had no non-country/non-bloc option, a new 'GLOBAL' jurisdiction value was added to data/vocab.yml and data/schema.yml (and scripts/validate.py's JURISDICTIONS set) specifically to represent this kind of international voluntary scheme, distinct from any binding national or regional law. instrument_type is set to 'guidance' as the closest existing enum fit for a voluntary, non-statutory mutual-recognition framework (none of regulation/directive/mandatory_standard/administrative_measure/statute accurately describe it). Citation confirmed word-for-word by downloading and locally parsing (pdftotext) the actual current governing document, IECEE 01-S Edition 5.1 (2025-03-20), 'IECEE Supplement to Basic Rules IEC CA 01' — the iecee.org website itself returned HTTP 403 on direct fetch attempts, so the CB Scheme's mechanism description here relies on Wikipedia as a secondary source pending direct verification against IECEE 01-S/IECEE 02's full text. NOT yet confirmed: exhaustive list of participating countries/NCBs, exact scope of covered standards/product categories, requirements/obligations/applies_to/category/product_scope/component_tags fields, and whether the CB Scheme should instead be modeled as a 'guidance' resource distinct from statutory tracker entries in the site's UI. Pending human review."
    zh: "本條目係依你的要求（「safety CB」）與EMC／PPWR／ESPR一併新增。CB Scheme並非任何單一法域之法律或法規，而是由IEC旗下IECEE運作之自願性多邊互認體系：由一個參與國之國家認證機構（NCB）核發的CB測試證書／CB測試報告，可為全球其他參與NCB所接受，使製造商毋須在每個國家重複全套測試即可取得各國安全認證（如各國安規標誌）。由於schema原本的jurisdiction enum並無「非國家／非區域集團」選項，本次新增一個「GLOBAL」jurisdiction值至data/vocab.yml與data/schema.yml（以及scripts/validate.py的JURISDICTIONS集合），專門用以表示此類國際自願性制度，與任何具拘束力之國家或區域性法律區隔。instrument_type選用「guidance」，為現有enum中最接近自願性、非法定互認框架之選項（regulation／directive／mandatory_standard／administrative_measure／statute均不準確）。citation已透過下載並以pdftotext於本機解析實際現行治理文件——IECEE 01-S Edition 5.1（2025-03-20）「IECEE Supplement to Basic Rules IEC CA 01」——逐字確認；iecee.org網站本身對直接擷取請求回傳HTTP 403，故本條目關於CB Scheme運作機制之描述目前仍仰賴Wikipedia作為次要來源，尚待對照IECEE 01-S／IECEE 02完整文本直接查證。尚未確認：參與國家／NCB之完整清單、涵蓋標準／產品類別之確切範圍、requirements／obligations／applies_to／category／product_scope／component_tags等欄位，以及CB Scheme在網站UI中是否應以「guidance」資源型態與具法定拘束力條目區隔呈現。尚待人工複核。"
