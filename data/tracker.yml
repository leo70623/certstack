  notes:
    en: "Added at the user's request as part of a batch of EU consumer-electronics regulations identified as gaps alongside the existing RED/EMC/PPWR/ESPR cluster (RoHS is the third of the traditional 'three pillars' of EU electronics compliance, together with RED and EMC). Compiled article-by-article from the UK National Archives' retained-EU-law mirror of Directive 2011/65/EU (legislation.gov.uk), which remained fetchable where EUR-Lex itself returned empty content again this session; the OJ citation (L 174, 1.7.2011, pp. 88-110) was independently cross-verified via web search rather than relying on legislation.gov.uk alone. Confirmed word-for-word: scope and exclusions (Art. 2), the 10 restricted substances and their 0.1%/0.01% concentration limits and phased scope-expansion dates (Art. 4, Annex II), manufacturer/importer/distributor obligations (Arts. 7, 9, 10), that appointing an authorised representative is optional (Art. 8, 'possibility'), that conformity assessment is Decision 768/2008/EC internal production control only — self-declaration, no third-party route exists under this Directive (Art. 7), the national-law penalty framework (Art. 23), the 2 January 2013 transposition deadline used here as dates.application (Art. 25), and 20-days-after-publication entry into force (Art. 27, not separately tracked as the schema has no such field). Confidence raised to medium under the schema's upgrade rule (entry_status complete, all fields traced to directly-read primary text, OJ citation cross-verified via an independent second source). NOT yet independently human-reviewed: product_tags/category/component_tags assignment (industrial/other Annex I categories beyond consumer electronics are not separately modeled here), and the exact current text of Annex III/IV exemptions, which are frequently amended by individual Commission Delegated Directives not reviewed in this session."
    zh: "本條目係依你之要求，作為與現有RED／EMC／PPWR／ESPR群組並列，經辨識為缺口之EU消費性電子相關法規批次新增之一（RoHS為傳統上EU電子產品合規「三大支柱」之第三項，與RED、EMC並列）。彙整方式為逐條查考英國國家檔案館之歐盟保留法鏡像網站（legislation.gov.uk）之2011/65/EU指令文本——本次工作階段EUR-Lex本身再次回傳空白內容，故仍以此鏡像網站為主；官方公報引用資訊（OJ L 174, 1.7.2011, pp. 88-110）已透過網路搜尋獨立交叉驗證，而非僅依賴legislation.gov.uk單一來源。已逐字確認：適用範圍及排除規定（第2條）、10項限制物質及其0.1%／0.01%濃度限值暨分階段擴大適用之日期（第4條、附件II）、製造商／進口商／經銷商義務（第7、9、10條）、指定授權代表為選擇性（第8條，原文用語「possibility」）、符合性評鑑僅為決定768/2008/EC內部生產管制（即自我聲明），本指令並無第三方驗證路徑（第7條）、罰則依會員國國內法訂定之框架（第23條）、作為dates.application採用之2013年1月2日轉換期限（第25條），以及公布後20日生效（第27條，因schema無對應欄位故未單獨記錄）。依schema升級規則，把握度提升為medium（entry_status為complete、所有欄位均可追溯至直接讀取之一手文字、OJ引用已以獨立第二來源交叉驗證）。尚未經人工獨立複核：product_tags／category／component_tags之分類指派（附件I中消費性電子以外之工業類別未於此另行建模），以及附件III／IV豁免項目之確切現行文字——該等豁免經常由個別執委會授權指令修訂，本次工作階段未查核。"

- id: eu-2023-988-gpsr
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EU) 2023/988 of the European Parliament and of the Council of 10 May 2023 on general product safety, amending Regulation (EU) No 1025/2012 and Directive (EU) 2020/1828, and repealing Directive 2001/95/EC and Council Directive 87/357/EEC (OJ L 135, 23.5.2023, p. 1-51)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "General Product Safety Regulation (GPSR)"
    zh: "一般產品安全法規（GPSR）"
  category:
    - product_safety
    - horizontal_regulation

  product_scope:
    en: "Applies horizontally to all products placed or made available on the EU market, whether new, used, repaired or reconditioned (except items explicitly marked as to be repaired/reconditioned before use), insofar as there are no specific EU sector legislation provisions covering the same safety aspects/risks — for products covered by such sector legislation (e.g. RED, EMC, ESPR delegated acts), this Regulation applies only to aspects/risks NOT covered by that sector legislation (Art. 2). Excludes: medicinal products for human/veterinary use, food, feed, living plants/animals, plant protection products, animal by-products, aircraft, means of transport operated by a service provider (not the consumer), antiques (Art. 2). Distance sales (e.g. online marketplaces) are explicitly treated as market availability where the offer is directed at EU consumers (Art. 4)."
    zh: "橫向適用於投放或提供於歐盟市場之所有產品，不論全新、二手、經修理或整新（明確標示須經修理／整新後始可使用之品項除外），惟以無其他歐盟部門別法規涵蓋相同安全面向／風險為限——就已受部門別法規涵蓋之產品（如RED、EMC、ESPR授權法案），本法規僅適用於該等法規未涵蓋之面向／風險（第2條）。排除：人用／動物用藥品、食品、飼料、活體植物／動物、植物保護產品、動物副產品、航空器、由服務提供者（非消費者）操作之交通工具、古董（第2條）。遠距銷售（如網路市集）於其要約係針對歐盟消費者時，明確視為市場提供之一種（第4條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
    - all_b2c_goods
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2023-05-23"
    application: "2024-12-13"
    labelling: null
    transition_end: null

  requirements:
    marking: false
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment: [none]
    conformity_assessment_note: null

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure the product meets the general safety requirement of Art. 5 through proper design and manufacture; before placing it on the market, carry out an internal risk analysis and prepare technical documentation containing at least a general description of the product and its essential safety-relevant characteristics, an analysis of possible risks and the solutions adopted to eliminate/mitigate them, and a list of relevant European standards or other elements applied; keep this documentation for 10 years and provide it to market surveillance authorities on request; ensure the product bears a type/batch/serial number or other identifying element (or, where not possible, that this is on packaging/accompanying documents); indicate name, registered trade mark, postal address, electronic address and a single contact point on the product, packaging or accompanying documentation; ensure instructions and safety information are provided in a language understandable to consumers in the relevant Member State, unless the product can be used safely without them; where a manufacturer considers or has reason to believe a product it has placed on the market is dangerous, immediately take corrective measures, inform consumers and notify market surveillance authorities (via the Safety Business Gateway) giving details of the risk and quantities in circulation; and provide accessible channels for consumers to submit complaints and keep a complaints/recall register, keeping surveillance authorities informed throughout the supply chain (Art. 9)."
        zh: "確保產品經妥善設計及製造，符合第5條一般安全要求；於投放市場前，執行內部風險分析並編製技術文件，內容至少含產品概述及與安全評估相關之基本特性、可能風險分析及所採取之消除／減輕方案，以及所適用之相關歐洲標準或其他要素清單；保存該文件達10年並依市場監督機關請求提供；確保產品標示型號／批號／序號或其他識別元素（若無法標示，則於包裝或隨附文件載明）；於產品、包裝或隨附文件上標示名稱、註冊商標、郵政地址、電子地址及單一聯絡窗口；除產品無需說明即可安全使用外，應以相關會員國消費者易懂之語言提供使用說明及安全資訊；如製造商認為或有理由相信其已投放市場之產品具危險性，應立即採取矯正措施，告知消費者並透過「安全商業入口網」通知市場監督機關，說明風險詳情及流通數量；並提供消費者易於使用之申訴管道，建立申訴／召回紀錄，於整個供應鏈中持續告知市場監督機關（第9條）。"
    - actor: importer
      action:
        en: "Before placing a product on the market, verify that the manufacturer has met the general safety requirement and complied with the product-identification and contact-information obligations of Art. 9; where an importer considers or has reason to believe a product is not safe, not place it on the market until it complies, and, for a dangerous product, immediately notify the manufacturer and inform market surveillance authorities via the Safety Business Gateway; indicate their own name, trade mark, postal address and electronic contact details on the product, packaging or accompanying documentation, ensuring this does not obscure manufacturer-provided information; and provide instructions/safety information in a language appropriate to the Member State where the product is made available (Art. 11)."
        zh: "於投放產品於市場前，查核製造商已符合一般安全要求，並已履行第9條之產品識別及聯絡資訊義務；如有理由相信產品不安全，於其符合規定前不得投放市場，且就危險產品應立即通知製造商並透過「安全商業入口網」通知市場監督機關；於產品、包裝或隨附文件上標示自身名稱、商標、郵政地址及電子聯絡方式，並確保不致遮蔽製造商已提供之資訊；並以產品提供所在會員國適當之語言提供使用說明／安全資訊（第11條）。"
    - actor: seller
      action:
        en: "As a distributor, act with due care in relation to the safety requirements of this Regulation before and while making a product available on the market, including verifying that the manufacturer and importer have complied with their respective identification/marking obligations; where a distributor considers or has reason to believe a product is dangerous, not make it available until it complies and inform the manufacturer/importer and, for a dangerous product, market surveillance authorities; and cooperate with competent authorities on any action taken to eliminate or mitigate the risk (Art. 12 obligations of distributors, per the Regulation's chapter III structure mirroring Arts. 9 and 11)."
        zh: "作為經銷商，於使產品可於市場上取得前及期間，就本法規之安全要求本於注意義務行事，包含查核製造商與進口商已履行各自之識別／標示義務；如有理由相信產品具危險性，於其符合規定前不得使其可於市場上取得，並告知製造商／進口商，且就危險產品通知市場監督機關；並配合主管機關採取之任何消除或減輕風險之行動（第12條經銷商義務，依本法規第三章與第9、11條相仿之結構）。"

  tools: []
  related:
    - eu-2014-53
    - eu-2014-30-emc
    - eu-2024-1781-espr

  sources:
    - url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32023R0988"
      type: primary
      publisher: "EUR-Lex — Official Journal L 135, 23.5.2023, pp. 1-51"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States lay down the rules on penalties applicable to infringements of this Regulation by economic operators and providers of online marketplaces, and must take all measures necessary to ensure they are implemented; per Recital 97, penalties should be adequate to the type of infringement, the possible advantage gained by the economic operator/marketplace provider, and the type and gravity of injury suffered by the consumer, and must be effective, proportionate and dissuasive (Art. 45; national penalty rules were to be notified to the Commission by 13 December 2024)."
      zh: "會員國訂定經濟營運者及線上市集提供者違反本法規之罰則規定，並應採取一切必要措施確保其執行；依前言第97點，罰則應與違規類型、經濟營運者／市集提供者可能獲得之利益，以及消費者所受損害之類型與嚴重程度相當，並須具有效性、比例性及嚇阻性（第45條；會員國國內罰則規定須於2024年12月13日前通知執委會）。"
    penalty_range: null
    market_impact: []
    source_ref: 0
    last_verified: "2026-09-26"

  monitoring:
    tier: B
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: complete
  last_verified: "2026-09-26"
  last_reviewed: "2026-09-26"
  review_status: pending
  confidence: medium
  notes:
    en: "Added at the user's request as part of the same batch as RoHS, identified as a gap in the tracker: the GPSR is the horizontal 'safety net' regulation that applies to consumer products either alongside or in the gaps of product-specific legislation like RED/EMC/ESPR (Art. 2), and replaced the old General Product Safety Directive 2001/95/EC from 2024-12-13. This session, EUR-Lex's own HTML CELEX page (32023R0988) was directly fetchable (unlike in earlier sessions where EUR-Lex consistently returned empty content) and used as the primary source for Arts. 1-2, 4-12, and 45 (Penalties), cross-checked against independent web search results for the OJ citation and the 2024-12-13 application date. requirements.marking is set to false and conformity_assessment to [none] because GPSR, unlike RED/EMC/RoHS, does NOT use a CE-marking/conformity-assessment-module structure at all — it is a general due-diligence/risk-analysis safety duty, not a certification regime. requirements.local_representative is recorded as false with an important nuance not fully captured by the boolean: per Art. 10 and independent secondary-source confirmation, a manufacturer established outside the EU MUST have an EU-based responsible party — but this can be either an importer who assumes the role, OR (only if no such importer exists) a formally-appointed authorised representative — so the requirement is conditional on the importer relationship rather than an unconditional standalone obligation, consistent with this project's strict local_representative convention (see PPWR/ESPR entries for the same pattern). Confidence raised to medium under the schema's rule (entry_status complete, primary-source-traced fields, OJ citation cross-verified independently). NOT yet independently human-reviewed: the full text of Art. 12 (distributor obligations) and Art. 10 (authorised representatives) were not directly fetched word-for-word in this session (Art. 12's obligation entry above is inferred from the Regulation's consistent chapter-III structure and secondary-source summaries rather than a direct quote, and should be verified against the primary text); online-marketplace-provider-specific obligations (a distinct actor type under GPSR not modeled in this schema's applies_to enum) are also not captured."
    zh: "本條目係依你之要求，與RoHS同批新增，經辨識為tracker之缺口：GPSR為橫向「安全網」法規，與RED／EMC／ESPR等產品別法規並行適用或填補其缺口（第2條），並自2024-12-13起取代舊有之一般產品安全指令2001/95/EC。本次工作階段，EUR-Lex自身之HTML CELEX頁面（32023R0988）可直接擷取（有別於先前工作階段EUR-Lex持續回傳空白內容之情形），並作為第1、2、4-12及45條（罰則）之一手來源，另以獨立網路搜尋交叉核對官方公報引用資訊及2024-12-13適用日期。requirements.marking設為false、conformity_assessment設為[none]，係因GPSR與RED／EMC／RoHS不同，完全未採用CE標誌／符合性評鑑模組架構——其性質為一般盡職調查／風險分析安全義務，而非驗證制度。requirements.local_representative記為false，惟有一重要細節無法完全以布林值呈現：依第10條及獨立次要來源確認，非歐盟境內設立之製造商「必須」有一歐盟境內責任方——惟此可由承擔該角色之進口商擔任，或（僅於無此類進口商時）由正式指定之授權代表擔任——故此要求係以進口商關係為條件，而非無條件之獨立義務，與本專案對local_representative之嚴格認定慣例一致（參見PPWR／ESPR條目之相同模式）。依schema規則，把握度提升為medium（entry_status為complete、欄位均可追溯一手來源、OJ引用已獨立交叉驗證）。尚未經人工獨立複核：第12條（經銷商義務）及第10條（授權代表）本次工作階段並未直接逐字擷取全文（上方經銷商義務項目係依本法規第三章一貫結構及次要來源摘要推論而得，非直接引用原文，應對照原文查核）；線上市集提供者之特定義務（GPSR下一獨立行為者類型，本schema之applies_to enum並未建模）亦未納入。"

- id: eu-2012-19-weee
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Directive 2012/19/EU of the European Parliament and of the Council of 4 July 2012 on waste electrical and electronic equipment (WEEE) (recast) (OJ L 197, 24.7.2012, p. 38-71)"
  local_type: "Directive"
  instrument_type: directive
  short_name:
    en: "WEEE Directive (Waste Electrical and Electronic Equipment)"
    zh: "廢電機電子設備指令（WEEE）"
  category:
    - waste_management
    - extended_producer_responsibility

  product_scope:
    en: "Applied, during a transitional period from 2012-08-13 to 2018-08-14, only to EEE falling within the 10 categories of Annex I (with an indicative list in Annex II); from 2018-08-15 the scope expanded to 'all EEE', classified within the 6 categories of Annex III (Art. 2(1)). Excludes: equipment necessary for the protection of Member States' essential security interests (including arms/munitions/war material for specifically military purposes); equipment specifically designed as part of other excluded equipment and only able to function as part of it; and filament bulbs (Art. 2(3)). From 2018-08-15, also excludes: equipment designed to be sent into space; large-scale stationary industrial tools; large-scale fixed installations; means of transport for persons or goods (excluding non-type-approved electric two-wheel vehicles); non-road mobile machinery for professional use only; equipment specifically designed solely for R&D purposes only made available on a B2B basis; and medical devices/in-vitro diagnostic medical devices where expected to be infective prior to end of life, and active implantable medical devices (Art. 2(4))."
    zh: "於2012-08-13至2018-08-14之過渡期間，僅適用於符合附件I所列10大類之EEE（附件II提供例示清單）；自2018-08-15起，適用範圍擴大為「所有EEE」，並依附件III所列6大類分類（第2(1)條）。排除：會員國基本安全利益保護所需之設備（含專供軍事用途之武器、彈藥及戰爭物資）、專為排除設備之一部分而設計且僅能作為該部分運作之設備，以及白熾燈泡（第2(3)條）。自2018-08-15起，另排除：專為送入太空設計之設備、大型固定式工業工具、大型固定裝置、載人或載貨之交通工具（不含未經型式認證之電動兩輪車）、僅供專業用途之非道路移動機械、專為研發設計且僅以企業對企業方式提供之設備，以及預期於使用壽命結束前具感染性之醫療器材／體外診斷醫療器材，暨主動植入式醫療器材（第2(4)條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
  component_tags:
    - power_supply
    - battery
    - cable_connector
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2012-07-24"
    application: "2014-02-14"
    labelling: null
    transition_end: "2018-08-14"

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: true
    conformity_assessment: [none]
    conformity_assessment_note: null

  obligations:
    - actor: manufacturer
      action:
        en: "Design and produce EEE so as not to impede reuse and treatment of WEEE (Art. 4); appropriately mark EEE placed on the market with the crossed-out wheeled bin symbol shown in Annex IX in accordance with European standard EN 50419, or (where not possible due to the size or function of the product) print it on the packaging, instructions for use and warranty (Art. 14(4)); provide at least for the financing of the collection, treatment, recovery and environmentally sound disposal of WEEE from private households deposited at collection facilities, either individually or by joining a collective scheme (Art. 12(1)-(3)); provide a guarantee, when placing a product on the market, that the management of all WEEE will be financed (e.g. by participating in appropriate schemes, recycling insurance, or a blocked bank account) (Art. 12(2)); register with the national producer register of the Member State in which they supply EEE (including via distance communication) and provide the information set out in Annex X Part A, updating it as appropriate (Art. 16)."
        zh: "設計及製造EEE時，不得妨礙WEEE之再利用及處理（第4條）；依歐洲標準EN 50419，於投放市場之EEE上適當標示附件IX所示之打叉輪式垃圾桶符號，或（因產品大小或功能而無法標示時）將其印於包裝、使用說明書及保固文件上（第14(4)條）；至少提供家戶WEEE於指定回收設施交存後之收集、處理、回收及環境無害處置之財務保障，得單獨或加入集體計畫方式為之（第12(1)至(3)條）；於產品投放市場時，提供保證證明所有WEEE之管理均已獲得財務保障（例如加入適當計畫、回收保險或設立專用凍結銀行帳戶）（第12(2)條）；於其提供EEE（含以遠距通訊方式提供）之會員國辦理生產者國家登記，並提供附件X A部分所定資訊，並隨時更新（第16條）。"
    - actor: seller
      action:
        en: "When supplying a new product, ensure that WEEE can be returned to the distributor at least free of charge on a one-to-one, like-for-like basis; and, at retail shops with sales areas relating to EEE of at least 400 m2 (or in their immediate proximity), provide for the collection of very small WEEE (no external dimension more than 25 cm) free of charge and without an obligation to buy an EEE of an equivalent type (Art. 5(2))."
        zh: "於供應新產品時，確保消費者至少可將WEEE以一對一、同類替換方式免費退還予經銷商；並於EEE銷售面積達400平方公尺以上之零售店（或其鄰近地點），無償且無須購買同型EEE即可提供極小型WEEE（外部尺寸不超過25公分）之收集服務（第5(2)條）。"
    - actor: importer
      action:
        en: "Where established outside the reporting Member State and supplying EEE into it (including by distance communication), register with that Member State's national producer register (directly or via an authorised representative) and provide the Annex X Part A information, since the Directive's 'producer' definition and the Art. 16 registration/financing obligations extend to any natural or legal person placing EEE on that Member State's market, regardless of the selling technique used, including importers (Art. 3(1)(f), Art. 16)."
        zh: "非設立於申報會員國境內，而以任何方式（含遠距通訊）向該會員國供應EEE者，應（直接或透過授權代表）於該會員國之生產者國家登記系統辦理登記，並提供附件X A部分資訊，蓋本指令「生產者」之定義及第16條登記／財務保障義務，係擴及以任何銷售方式將EEE投放該會員國市場之任何自然人或法人，含進口商在內（第3(1)(f)條、第16條）。"

