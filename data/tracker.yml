        zh: "依次要來源摘要（本次工作階段未能以一手文字獨立確認）：於進口／出口氟化氣體或投放市場含氟化氣體之產品／設備前，或於申請生產／配額權利前，應於F-gas入口網站完成登記（據報導為第20條左右之要求）；遵循依GWP門檻分類之特定產品類別分階段投放市場禁令，據報導自2025年起適用於商用冷凍／冷藏設備及個人冷卻裝置，並延伸至2033年適用於部分空調／熱泵設備；並自2025年1月1日起對產品及設備施以標示（據報導為第12條要求）。"
