  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States lay down rules on penalties applicable to infringements by economic operators of national provisions adopted under this Directive; penalties must be effective, proportionate and dissuasive, and may include criminal penalties for serious infringements (Art. 46)."
      zh: "各會員國自行訂定對經濟營運者違反本指令國內轉換規定之罰則；罰則須具有效性、比例性及嚇阻性，嚴重違規得包含刑事制裁（第46條）。"
