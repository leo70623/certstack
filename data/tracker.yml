    penalty_summary:
      en: "Member States lay down the rules on penalties applicable to infringements of this Regulation; per Art. 25, as reported by secondary sources (not independently confirmed against primary text this session), penalties must include fines proportionate to the environmental damage and the value of the commodities/products concerned, with a maximum fine of at least 4% of the operator's or trader's total annual Union-wide turnover, plus confiscation of the relevant products and of revenues derived from the transaction. This penalty summary should be treated as unverified pending direct primary-source confirmation."
      zh: "會員國訂定違反本法規之罰則規定；依第25條（本次工作階段未能以一手文字獨立確認，僅依次要來源轉述），罰則須包含與環境損害程度及所涉原物料／產品價值相當之罰鍰，最高罰鍰至少為營運者或交易者歐盟境內全年總營業額之4%，並沒收相關產品及交易所得收益。此罰則摘要應視為未經驗證，待未來以一手文字直接確認。"
