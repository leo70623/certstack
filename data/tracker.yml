  product_scope:
    en: "Lists harmonised standards EN 18031-1:2024, EN 18031-2:2024 and EN 18031-3:2024 as conferring presumption of conformity with the essential requirements of RED Art. 3(3)(d), (e) and (f) respectively (as activated by Delegated Regulation (EU) 2022/30), but with explicit restrictions: the standards' own 'rationale' and 'guidance' sections do not confer presumption of conformity, and compliance does not confer presumption of conformity where a manufacturer uses clauses 6.2.5.1/6.2.5.2 of EN 18031-1/-2/-3 (or EN 18031-2 clauses 6.1.3-6.1.6, or EN 18031-3 clause 6.3.2.4) to let a user skip setting a password or otherwise bypass the relevant access-control/secure-update mechanism (Implementing Decision (EU) 2025/138, recitals 5-9 and Annex)."
    zh: "將協調標準EN 18031-1:2024、EN 18031-2:2024、EN 18031-3:2024分別列為賦予RED第3(3)(d)、(e)、(f)款基本要求（由授權法規(EU) 2022/30啟用）符合性推定效力之標準，惟附有明確限制：標準本身之「rationale（理由）」與「guidance（指引）」章節不具符合性推定效力；且若製造商採用EN 18031-1/-2/-3第6.2.5.1/6.2.5.2條（或EN 18031-2第6.1.3-6.1.6條、EN 18031-3第6.3.2.4條）允許使用者不設定密碼或規避相關存取控制／安全更新機制者，亦不具符合性推定效力（執行決定(EU) 2025/138第5-9項理由及附件）。"
