  enforcement:
    authority: "Direction générale de la concurrence, de la consommation et de la répression des fraudes (DGCCRF)"
    mechanism:
      - market_surveillance
    penalty_basis: in_instrument
    penalty_summary:
      en: "Penalty amounts vary by the specific obligation breached. Per multiple secondary-source summaries (not independently confirmed against the exact operative penalty article's primary text this session for the general information/index obligations), breaches of the repairability-index communication and information obligations are punishable by an administrative fine of up to EUR 3,000 for a natural person and EUR 15,000 for a legal person. Per Art. 35 (directly confirmed via secondary source quoting its text this session), breaches of the unsold-goods reuse/recycling obligation carry the same maximum fine structure: up to EUR 3,000 for a natural person and EUR 15,000 for a legal person. Enforcement is carried out by the DGCCRF under its general consumer-protection and market-surveillance powers."
      zh: "罰鍰金額依違反之具體義務而異。依多個次要來源摘要（本次工作階段未能就一般資訊／指數義務之確切執行罰則條文以一手文字獨立確認），違反可修復性指數通報及資訊義務者，處自然人最高3,000歐元、法人最高15,000歐元之行政罰鍰。依第35條（本次工作階段已透過次要來源引文直接確認其文字），違反未售出商品重複使用／回收義務者，適用相同之罰鍰上限結構：自然人最高3,000歐元、法人最高15,000歐元。執行機關為DGCCRF（競爭、消費暨反詐欺總署），依其一般消費者保護及市場監督權限執行。"
    penalty_range: "up to EUR 3,000 (natural person) or EUR 15,000 (legal person) per breach, per Arts. 29 and 35"
