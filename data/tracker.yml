  notes:
    en: "This is a stub entry, and per project policy for instrument_type: mandatory_standard, will never contain reproduced clause text, tables, or limit values from the standard body (copyright restriction) — only structured metadata (number, title, dates, relationships, sources) and procedural obligations. Confirmed via the official National Standard Information Public Service Platform (std.samr.gov.cn, operated by SAMR), re-checked this session: release date 2022-07-19, implementation date 2023-08-01, fully replaces GB 4943.1-2011 and GB 8898-2011, technical committee (归口单位) Ministry of Industry and Information Technology, and — newly confirmed this session — that GB 4943.1-2022 is a modified adoption of IEC 62368-1:2018, which is the basis for product_scope above. This standard is treated as a child of cn-ccc-catalogue because it is the compliance basis referenced for the catalogue's information-technology-equipment product category (e.g. microcomputers, portable computers, computer display devices) rather than an independent certification scheme of its own. Confidence remains low (not raised to medium) because dates.published/dates.application in the required date-field sense (as distinct from the standard's own release/implementation dates already confirmed above) and enforcement/penalty attribution to this specific product category have not been confirmed article-by-article, and because the single source used, while official, has not been cross-verified against a second independent primary source. Fields still pending: procedural obligations, dates.published/application in the schema's required date fields, and enforcement/penalties (these attach to the CCC regulation and catalogue, not to the standard itself)."
    zh: "本條目為 stub，且依專案規範，instrument_type: mandatory_standard 之條目不得重製標準本文之條文、表格或限值（著作權限制），僅記錄結構化資訊（編號、名稱、日期、關聯、來源）與程序性義務。已透過官方之全國標準信息公共服務平台（std.samr.gov.cn，國家市場監督管理總局建置）確認，本次工作階段重新查核：發布日期2022-07-19、實施日期2023-08-01，全部代替 GB 4943.1-2011 及 GB 8898-2011，歸口單位為工業和信息化部；本次工作階段新確認：GB 4943.1-2022為國際標準IEC 62368-1:2018之修改採用，此即上方product_scope之依據。本標準列為 cn-ccc-catalogue 之子條目，係因其為該目錄下資訊技術設備類別（如微型計算機、可攜式計算機、計算機用顯示設備等）之符合性依據，而非獨立之認證制度本身。把握度維持low（未提升為medium），原因在於schema必填日期欄位意義上之dates.published／dates.application（有別於上述已確認之標準本身發布／實施日期），以及執法／罰則對本特定產品類別之逐條適用關係，均尚未查核；且目前僅使用單一來源（雖屬官方），尚未以第二個獨立一手來源交叉驗證。待補欄位：程序性義務、schema必填日期欄位意義之dates.published／application、執法與罰則（此二者屬於 CCC 管理規定與目錄層級，非本標準本身）。"

- id: eu-2014-53
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Directive 2014/53/EU of the European Parliament and of the Council of 16 April 2014 on the harmonisation of the laws of the Member States relating to the making available on the market of radio equipment and repealing Directive 1999/5/EC"
  local_type: "Directive"
  instrument_type: directive
  short_name:
    en: "Radio Equipment Directive (RED)"
    zh: "無線電設備指令（RED）"
  category:
    - radio_equipment
    - emc

  product_scope:
    en: "Establishes a regulatory framework for the making available on the market and putting into service of radio equipment in the Union, excluding equipment listed in Annex I (e.g. equipment used exclusively for public security, defence or state security) and radio equipment used exclusively by radio amateurs (Art. 1)."
    zh: "為無線電設備於歐盟市場之提供及啟用建立法規架構，排除附件一所列設備（如僅供公共安全、國防或國家安全使用之設備）及僅供業餘無線電愛好者使用之設備（第1條）。"
  product_tags:
    - radio_equipment
    - consumer_electronics
    - it_equipment
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2014-05-22"
    application: "2016-06-13"
    labelling: null
    transition_end: "2017-06-13"

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment:
      - sdoc
      - third_party
    conformity_assessment_note:
      en: "Where harmonised standards covering all applicable essential requirements have been applied, manufacturers may use internal production control (Annex II, self-declaration route). Where the essential requirements under Art. 3(2)/3(3) are not fully covered by such harmonised standards (or none exist), only EU-type examination plus conformity to type (Annex III) or full quality assurance (Annex IV) — both involving a Notified Body — are permitted (Art. 17)."
      zh: "若已採用涵蓋全部適用基本要求之協和標準，製造商得採內部生產管制（附件二，自我聲明途徑）。若第3(2)／3(3)條之基本要求未經該等協和標準完全涵蓋（或尚無協和標準），則僅得採歐盟型式檢驗併型式符合性（附件三）或完整品質保證（附件四）——兩者均須經由公告機構（Notified Body）參與（第17條）。"

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure the radio equipment complies with the essential requirements, draw up the technical documentation and carry out the applicable conformity assessment procedure, draw up the EU declaration of conformity and affix the CE marking, and keep the technical documentation and declaration of conformity for 10 years after the equipment is placed on the market (Art. 10)."
        zh: "確保無線電設備符合基本要求，編製技術文件並執行適用之符合性評鑑程序，製作歐盟符合性聲明並張貼CE標誌，且於設備投放市場後保存技術文件與符合性聲明達10年（第10條）。"
    - actor: importer
      action:
        en: "Verify the manufacturer has carried out the appropriate conformity assessment and that the equipment can be operated in at least one Member State without infringing radio spectrum use requirements; verify CE marking and accompanying documentation; place their own name and contact address on the equipment or packaging; keep a copy of the EU declaration of conformity for 10 years and ensure technical documentation can be made available to market surveillance authorities on request (Art. 12)."
        zh: "確認製造商已執行適當之符合性評鑑程序，且設備可於至少一會員國境內使用而不違反頻譜使用規定；確認CE標誌及隨附文件；於設備或包裝上標示自身名稱及聯絡地址；保存歐盟符合性聲明副本達10年，並確保技術文件可依市場監督機關要求提供（第12條）。"
    - actor: seller
      action:
        en: "Before making radio equipment available on the market, verify that it bears the CE marking, is accompanied by the required documents and by instructions/safety information in a language easily understood by consumers, and that the manufacturer and importer have complied with their respective marking/documentation obligations; ensure storage and transport conditions do not jeopardise compliance with the essential requirements while the equipment is under the distributor's responsibility (Art. 13)."
        zh: "在提供無線電設備於市場前，應確認其已張貼CE標誌、備有所需文件及以消費者易懂語言提供之使用說明／安全資訊，並確認製造商與進口商已履行各自之標示／文件義務；於設備由經銷商負責保管期間，應確保儲存與運送條件不致損及基本要求之符合性（第13條）。"

  tools: []
  related: []

  sources:
