  short_name:
    en: "Gulf Technical Regulation for Low Voltage Electrical Equipment and Appliances"
    zh: "海灣低壓電氣設備與器具技術法規"
  category:
    - product_safety
    - emc

  product_scope:
    en: "Applies to electrical and electronic devices, appliances, and fixtures containing electrical and/or electronic components designed for use with a rated voltage of between 50 and 1000 V for alternating current and between 75 and 1500 V for direct current, other than the electrical equipment and phenomena listed in Annex (2) (Art. 1(8), Art. 2)."
    zh: "適用於設計使用電壓於交流50至1000伏特、直流75至1500伏特之間，含電氣及/或電子元件的電氣與電子裝置、器具及配件，但附件(2)所列之電氣設備及現象除外（第1(8)條、第2條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
  component_tags:
    - power_supply
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "UNVERIFIED"
    application: "2016-07-01"
    labelling: null
    transition_end: null

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: "UNVERIFIED"
    conformity_assessment: "UNVERIFIED"

  obligations:
    - actor: manufacturer
      action:
        en: "Carry out the applicable conformity assessment procedure, draw up the Manufacturer Declaration of Conformity, and affix the Gulf Conformity Marking (Art. 8)."
        zh: "執行適用之符合性評鑑程序、製作製造商符合性聲明書，並張貼海灣符合性標誌（第8條）。"
    - actor: importer
      action:
        en: "Ensure the manufacturer has carried out the appropriate conformity assessment procedure and that the equipment bears the Gulf Conformity Marking and required documents before placing it on the market (Art. 10)."
        zh: "於產品投放市場前確認製造商已完成適當之符合性評鑑程序，且產品已張貼海灣符合性標誌並附有所需文件（第10條）。"
    - actor: seller
      action:
        en: "Verify, before making equipment available on the market, that it bears the Gulf Conformity Marking, is accompanied by required documents and Arabic-language safety information (Art. 11)."
        zh: "於使產品可於市場取得前，確認產品已張貼海灣符合性標誌，並附有所需文件及阿拉伯文安全資訊（第11條）。"

