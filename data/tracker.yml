  entry_status: stub
  last_verified: "2026-09-13"
  last_reviewed: "2026-09-13"
  review_status: pending
  confidence: low
  notes:
    en: "This is a stub entry. Confirmed via official sources: the legal basis of the CCC mandatory certification system is the Regulations on the Management of Compulsory Product Certification (SAMR Order No. 61, revised 2022-09-29; originally State Administration for Quality Supervision, Inspection and Quarantine Order No. 117, effective 2009-09-01). Article 4 of that Regulation provides that SAMR, jointly with relevant departments, formulates and adjusts the catalogue of products subject to compulsory certification and publishes it — meaning the catalogue itself is NOT a single standalone law/regulation with one current citation, but a continuously-amended administrative document composed of a baseline announcement plus a long, ongoing series of individual adjustment announcements, none of which references or restates a single governing catalogue text. Known adjustment announcements identified so far: 2020-04 (SAMR announcement optimizing the catalogue, superseding the 2014 version — page could not be directly fetched to confirm its exact announcement number); 2019 No. 44 (2019-10-16, removed 18 products, moved 17 to self-declaration); 2023 (catalogue adjustment plus the Catalogue Description and Definition Table, 2023 revision); 2024 (at least four separate announcements — Nos. 9, 26, 28, 50 — each adding different product categories); 2025 No. 57 (2025-12-28, effective 2027-01-01, cites only the Regulations on Certification and Accreditation as its legal basis, not any single catalogue document); and further adjustments in 2026. Given this structure, no single 'currently in force' catalogue announcement number exists to cite, so citation is deferred rather than guessed. Fields still pending: product scope, obligations, requirements, dates, enforcement and penalties."
    zh: "本條目為 stub。已透過官方來源確認：CCC 強制性認證制度之法源為《強制性產品認證管理規定》（國家市場監督管理總局令第61號，2022年9月29日修訂；原國家質量監督檢驗檢疫總局令第117號，2009年9月1日起施行）。該規定第四條規定由市場監管總局會同有關部門制定、調整並公佈強制性產品認證目錄——即目錄本身並非單一、具有唯一現行引用文號之法規文件，而是由一份基準文件加上長期、持續的個別修訂公告所組成的複合行政文件，各修訂公告均未引用或重述單一的「現行目錄」母文件。目前查證到的修訂公告包括：2020年4月市場監管總局優化目錄之公告（廢止2014年版本，惟該頁面無法直接擷取以確認確切公告文號）；2019年第44號（2019-10-16，移除18項產品、17項改自我聲明）；2023年目錄調整暨《強制性產品認證目錄描述與界定表（2023年修訂）》；2024年至少4份個別公告（第9號／26號／28號／50號，各自新增不同產品類別）；2025年第57號（2025-12-28發布，2027-01-01生效，僅引用《認證認可條例》為授權依據，未引用任何單一目錄文件）；以及2026年之後續調整。基於此文件結構，並不存在單一「現行有效」的目錄公告文號可供引用，故此項引用暫緩填寫，而非臆測。待補欄位：適用範圍、義務、要求項、日期、執法與罰則。"

