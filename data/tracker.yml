  notes:
    en: "This is a stub entry, and per project policy for instrument_type: mandatory_standard, will never contain reproduced clause text, tables, or limit values from the standard body (copyright restriction) — only structured metadata (number, title, dates, relationships, sources) and procedural obligations. Confirmed via the official National Standard Information Public Service Platform (std.samr.gov.cn, operated by SAMR): release date 2022-07-19, implementation date 2023-08-01, fully replaces GB 4943.1-2011 and GB 8898-2011, technical committee (归口单位) Ministry of Industry and Information Technology. This standard is treated as a child of cn-ccc-catalogue because it is the compliance basis referenced for the catalogue's information-technology-equipment product category (e.g. microcomputers, portable computers, computer display devices) rather than an independent certification scheme of its own. Fields still pending: product scope wording, procedural obligations, dates.published/application in the required date fields, enforcement and penalties (these attach to the CCC regulation and catalogue, not to the standard itself, and their precise application to this specific product category has not yet been confirmed article-by-article)."
    zh: "本條目為 stub，且依專案規範，instrument_type: mandatory_standard 之條目不得重製標準本文之條文、表格或限值（著作權限制），僅記錄結構化資訊（編號、名稱、日期、關聯、來源）與程序性義務。已透過官方之全國標準信息公共服務平台（std.samr.gov.cn，國家市場監督管理總局建置）確認：發布日期2022-07-19、實施日期2023-08-01，全部代替 GB 4943.1-2011 及 GB 8898-2011，歸口單位為工業和信息化部。本標準列為 cn-ccc-catalogue 之子條目，係因其為該目錄下資訊技術設備類別（如微型計算機、可攜式計算機、計算機用顯示設備等）之符合性依據，而非獨立之認證制度本身。待補欄位：適用範圍文字、程序性義務、dates.published／dates.application 等必填日期欄位、執法與罰則（此二者屬於 CCC 管理規定與目錄層級，其對本產品類別之逐條適用關係尚待查證）。"
