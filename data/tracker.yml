  requirements:
    marking: false
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment: [sdoc]
    conformity_assessment_note:
      en: "Not a product-conformity-assessment regime in the RED/EMC/RoHS sense; 'operators' (the EUDR term broadly analogous to manufacturers/importers placing products on the market for the first time) must exercise due diligence (Art. 8) and submit a due diligence statement declaring no or negligible risk before the product may be placed on the market or exported (Art. 4) — recorded here as [sdoc] because it is a self-declared statement, not third-party certified, though the statement must be submitted through an EU information system and can trigger official checks."
      zh: "非RED／EMC／RoHS意義下之產品符合性評鑑制度；「營運者」（EUDR用語，泛指首次將產品投放市場之製造商／進口商）須執行盡職調查（第8條），並於產品投放市場或出口前提交聲明無風險或風險可忽略之盡職調查聲明（第4條）——此處記為[sdoc]，因其屬自我聲明性質，非經第三方驗證，惟該聲明須透過歐盟資訊系統提交，且可能觸發官方查核。"

  obligations:
    - actor: manufacturer
      action:
        en: "As an 'operator' placing relevant products on the EU market for the first time, exercise due diligence in accordance with Art. 8 prior to placing the product on the market, in order to demonstrate compliance with the Art. 3 prohibition; not place relevant products on the market without prior submission of a due diligence statement through the EU information system referenced in Art. 33, containing the Annex II information and a declaration that due diligence found no or only a negligible risk (Art. 4(1)-(3)); by submitting that statement, assume responsibility for the product's compliance with Art. 3 (Art. 4(4)); and keep a record of due diligence statements for 5 years from submission (Art. 4(5))."
        zh: "作為首次將相關產品投放歐盟市場之「營運者」，於投放市場前依第8條執行盡職調查，以證明符合第3條之禁止規定；未透過第33條所定歐盟資訊系統事先提交盡職調查聲明前，不得將相關產品投放市場，該聲明須含附件II資訊，並聲明盡職調查結果為無風險或風險可忽略（第4(1)至(3)條）；提交該聲明後，即就該產品符合第3條之情形負責（第4(4)條）；並自聲明提交之日起保存紀錄達5年（第4(5)條）。"
    - actor: importer
      action:
        en: "As an 'operator' (a natural or legal person established in the Union who, in the course of a commercial activity, places relevant products on the market, including for the first time following import), the same Art. 4/Art. 8 due-diligence-statement and 5-year record-keeping obligations apply as for a manufacturer placing products on the market for the first time; the EUDR does not use a separate 'importer' actor category — the person who first places an imported relevant product on the EU market bears the operator obligations regardless of whether they also manufactured it."
        zh: "作為「營運者」（於歐盟境內設立，於商業活動過程中將相關產品投放市場之自然人或法人，含首次進口後投放市場者），適用與首次將產品投放市場之製造商相同之第4條／第8條盡職調查聲明義務及5年紀錄保存義務；EUDR並未另設獨立之「進口商」行為者類別——首次將進口之相關產品投放歐盟市場者，不論是否亦為製造商，均負營運者義務。"

