  notes:
    en: "Added at the user's request as the second item in the REACH→EUDR→Single-Use Plastics Directive→F-Gas Regulation→CLP Regulation batch of new EU environmental regulations. Relevance to this tracker's consumer-electronics focus is indirect (via natural rubber in cables/seals and wood-based packaging) rather than central, unlike the other entries in this batch. IMPORTANT — recorded as entry_status: stub and confidence: low, a deliberate downgrade from the complete/medium level reached for REACH/RoHS/WEEE/Battery/CRA in prior sessions, because of a genuine, unresolved access gap rather than a structural feature of the law: this session, EVERY direct fetch attempt against EUR-Lex for this specific Regulation (2023/1115) — across the CELEX:32023R1115 URI, the OJ:L_202301115 URI, the consolidated CELEX:02023R1115-20241226 URI, and the eli/reg/2023/1115/oj/eng URI, in both HTML and PDF renderer forms — returned blank/empty content, and a secondary full-text mirror (service.betterregulation.com) returned HTTP 403 on direct fetch. As a result, the article text summarised above (Arts. 1, 3, 4, 25, 38) is sourced only from WebSearch result snippets that themselves quote these secondary sources, which is one level less reliable than the craact.eu situation for the Cyber Resilience Act entry (where a full secondary-mirror page was at least directly fetched and read in its entirety) — this entry has NOT had any full primary or secondary source page directly read this session, only search-engine snippets of quotes. The core facts (Art. 3 three-part compliance test, Art. 4 due diligence statement mechanism, Art. 25's 4%-of-turnover minimum fine ceiling, and the 2026-12-30/2027-06-30 phased application dates reflecting the Regulation's well-publicised implementation delays) are corroborated by multiple independent secondary sources that agree with each other, so are recorded here as probably accurate, but per the schema's rule this does not meet the bar for confidence: medium (which requires fields traced to directly-read primary sources). This is the single highest-priority item in this session's work for both (a) a repeat EUR-Lex fetch attempt once EUR-Lex's apparent rate-limiting/blocking of this specific document clears, and (b) full human review. requirements.registration is false and conformity_assessment is [sdoc] based on the due-diligence-statement mechanism (Art. 4), which is structurally a self-declaration submitted via an EU IT system rather than a product registration or third-party certification. status is recorded as 'adopted' rather than 'in_force' because the substantive prohibition/due-diligence obligations modelled in this entry do not become applicable until 2026-12-30 (large/medium operators) or 2027-06-30 (micro/small operators, recorded as dates.transition_end), notwithstanding the Regulation's 2023 entry into force — this timeline has itself been subject to well-documented legislative delays (originally due 2024-12-30, postponed once already) which should be reconfirmed in any future update given the Regulation's history of amendment."
    zh: "本條目係依你之要求，作為新一批歐盟環保法規（REACH→EUDR→一次性塑膠指令→氟化氣體法規→CLP法規）之第二項新增。與本tracker聚焦之消費性電子之關聯屬間接（透過電纜／密封件用天然橡膠及木質包裝材料），非如本批次其餘條目般直接相關。重要說明——本條目記為entry_status: stub、confidence: low，此為刻意降級，有別於前幾次工作階段REACH／RoHS／WEEE／電池法規／CRA所達到之complete/medium水準，原因在於本次工作階段存在真實且未解決之來源存取缺口，而非該法規本身之結構性因素：本次工作階段，針對本法規（2023/1115）之EUR-Lex擷取嘗試——涵蓋CELEX:32023R1115網址、OJ:L_202301115網址、合併版本CELEX:02023R1115-20241226網址，及eli/reg/2023/1115/oj/eng網址，並分別嘗試HTML與PDF兩種呈現格式——均一致回傳空白內容，另一個次要全文鏡像網站（service.betterregulation.com）直接擷取則回傳HTTP 403錯誤。因此，上方摘要之條文內容（第1、3、4、25、38條）僅依賴網路搜尋結果摘錄之次要來源引文取得，其可靠程度較CRA條目採用craact.eu之情形更低一層（CRA至少完整擷取並閱讀過一個次要鏡像網站整頁），本條目本次工作階段並未完整直接讀取任何一手或次要來源頁面，僅取得搜尋引擎摘錄之引文片段。核心事實（第3條三項合規要件、第4條盡職調查聲明機制、第25條至少4%營業額之最低罰鍰上限，以及反映本法規眾所周知延後實施之2026-12-30／2027-06-30分階段適用日期）已由多個彼此一致之獨立次要來源佐證，應屬大致正確，惟依schema規則，此尚不足以達到confidence: medium之門檻（該門檻要求欄位可追溯至直接讀取之一手來源）。此為本次工作階段最優先待辦事項之一：(a) 待EUR-Lex對本文件之疑似速率限制／封鎖情形解除後，應再次嘗試直接擷取；(b) 應進行完整人工複核。requirements.registration設為false、conformity_assessment設為[sdoc]，係依第4條盡職調查聲明機制——其結構上為透過歐盟資訊系統提交之自我聲明，而非產品登記或第三方驗證。status記為「adopted」而非「in_force」，係因本條目所建模之實質禁止／盡職調查義務須至2026-12-30（中大型營運者）或2027-06-30（微型／小型營運者，記為dates.transition_end）方適用，儘管本法規已於2023年生效——此時程本身已歷經多次有公開紀錄之立法延後（原訂2024-12-30適用，已延後一次），未來更新時應重新確認，以因應本法規之修訂歷史。"

- id: eu-2019-904-sup
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Directive (EU) 2019/904 of the European Parliament and of the Council of 5 June 2019 on the reduction of the impact of certain plastic products on the environment (OJ L 155, 12.6.2019, p. 1-19)"
  local_type: "Directive"
  instrument_type: directive
  short_name:
    en: "Single-Use Plastics Directive (SUP)"
    zh: "一次性塑膠指令（SUP）"
  category:
    - waste_management
    - extended_producer_responsibility

  product_scope:
    en: "Applies to single-use plastic products listed in the Annex, defined as items 'not conceived, designed or placed on the market to accomplish, within their life span, multiple trips or rotations' (Art. 3). Consumer-electronics relevance is narrow but real: beverage cups and their lids/caps, and certain packaging, fall within scope where plastic-containing; the Directive's tethered-cap and PET recycled-content requirements (Art. 6) apply to plastic beverage containers, which can include product accessory items. Market restrictions (Art. 5, Annex Part B) prohibit placing on the market single-use plastic cutlery, plates, straws, cotton bud sticks, balloon sticks, and expanded-polystyrene food/beverage containers, none of which are core consumer-electronics products but may appear as accessories or packaging components in some product lines."
    zh: "適用於附件所列一次性塑膠產品，定義為「非為於其使用壽命內完成多次使用或多次循環而設計、製造或投放市場」之產品（第3條）。與消費性電子之關聯範圍狹窄惟確實存在：飲料杯及其杯蓋／瓶蓋，以及部分含塑膠成分之包裝，屬本指令範圍；指令之瓶蓋栓繫規定及PET回收料含量規定（第6條）適用於塑膠飲料容器，可能涵蓋部分產品配件。市場限制規定（第5條、附件B部分）禁止投放市場之一次性塑膠餐具、餐盤、吸管、棉花棒棒身、氣球棒及發泡聚苯乙烯食品／飲料容器，均非核心消費性電子產品，惟可能作為部分產品線之配件或包裝組件出現。"
  product_tags:
    - all_b2c_goods
  component_tags:
    - packaging
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
  dates:
    published: "2019-06-05"
    application: "2021-07-03"
    labelling: "2021-07-03"
    transition_end: "2024-12-31"

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment: [sdoc]
    conformity_assessment_note:
      en: "Not a product-conformity-assessment regime in the RED/EMC/RoHS sense. Recorded as [sdoc] because compliance with the design requirements (tethered caps, recycled-content targets under Art. 6) and marking requirements (Art. 7) is self-declared by the producer placing the product on the market, with no third-party certification or registration body specified in the Directive itself; Member States enforce via national market-surveillance and penalty regimes (Art. 21) rather than a harmonised EU conformity-assessment procedure."
      zh: "非RED／EMC／RoHS意義下之產品符合性評鑑制度。記為[sdoc]，因設計要求（第6條瓶蓋栓繫規定、回收料含量目標）及標示要求（第7條）之遵循，係由投放市場之製造商自我聲明，指令本身未指定第三方驗證或登記機關；會員國透過國內市場監督及罰則機制（第21條）執行，而非透過歐盟統一之符合性評鑑程序。"

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure that beverage containers with a capacity of up to three litres that are single-use plastic products have caps and lids remaining attached to the container during the product's intended use stage, from 3 July 2024 (Art. 6(1)); ensure PET beverage bottles contain at least 25% recycled plastic by 2025 and all plastic beverage bottles contain at least 30% recycled plastic by 2030, calculated as an average across each Member State (Art. 6(5)); apply conspicuous, clearly legible and indelible marking on packaging or on the product itself for the items listed in Part D of the Annex (e.g. sanitary towels, wet wipes, tobacco products with filters, beverage cups), informing consumers of appropriate waste disposal and the presence of plastic in the product (Art. 7); and, where designated as subject to extended producer responsibility under Art. 8, cover the costs of waste collection, transport, treatment, litter clean-up, and awareness-raising measures for the relevant single-use plastic products (Art. 8(2)-(3))."
        zh: "自2024年7月3日起，確保容量至3公升以下之一次性塑膠飲料容器，其瓶蓋及蓋子於產品預期使用階段仍附著於容器上（第6(1)條）；確保PET飲料瓶至2025年含至少25%回收塑膠料、所有塑膠飲料瓶至2030年含至少30%回收塑膠料，並以各會員國平均值計算（第6(5)條）；就附件D部分所列產品（例如衛生棉、濕紙巾、含濾嘴菸草製品、飲料杯），於包裝或產品本身標示明顯、清晰易讀且不易磨滅之標示，告知消費者適當廢棄處理方式及產品含塑膠成分（第7條）；並於依第8條被指定負延伸生產者責任時，負擔相關一次性塑膠產品之廢棄物收集、運輸、處理、亂丟清理及意識提升措施之費用（第8(2)至(3)條）。"
    - actor: importer
      action:
        en: "As a 'producer' under Art. 3(11) (which expressly includes fillers, sellers and importers placing single-use plastic products on the market of a Member State, not solely manufacturers), bear the same extended producer responsibility cost obligations under Art. 8 as manufacturers when placing single-use plastic products or fishing gear containing plastic on the market for the first time within a Member State's territory."
        zh: "依第3(11)條「生產者」定義（明文包含將一次性塑膠產品投放會員國市場之填裝者、銷售者及進口商，不限於製造商本身），於首次在會員國境內將一次性塑膠產品或含塑膠漁具投放市場時，負擔與製造商相同之第8條延伸生產者責任費用義務。"
    - actor: seller
      action:
        en: "For single-use plastic products listed in Part E of the Annex (e.g. food containers, beverage cups) that continue to be permitted on the market, provide consumers at the point of sale with information, where appropriate through markings or campaigns, on available reusable alternatives, on waste-management options for the product, on the best waste-disposal practices, and on the presence of plastics and their impact on the environment, in particular improper littering (Art. 10)."
        zh: "就附件E部分所列、仍准許於市場流通之一次性塑膠產品（例如食品容器、飲料杯），於銷售點以適當方式（例如標示或宣導活動）向消費者提供下列資訊：可供選擇之可重複使用替代品、產品廢棄物管理選項、最佳廢棄處理方式，以及塑膠存在及其對環境（尤其不當亂丟）之影響（第10條）。"

