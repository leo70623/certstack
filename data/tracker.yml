      zh: "會員國就經濟營運者違反本法規之情形訂定罰則規定，並應採取一切必要措施確保其執行；罰則須具有效性、比例性及嚇阻性。依第93條，會員國須至遲於2025年8月18日前（即第六章／第17條一般適用日2024年8月18日起一年後）訂定國內罰則規定，並就其後之任何修訂立即通知執委會。"
