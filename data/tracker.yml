    - url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ%3AL_202402847"
      type: primary
      publisher: "EUR-Lex — Official Journal L, 2024/2847, 20.11.2024 (page exists and its URL was confirmed via web search, but returned blank/empty content when fetched directly this session)"

  enforcement:
    authority: "National market surveillance authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Member States lay down the rules on penalties applicable to infringements of this Regulation and must take all measures necessary to ensure they are implemented; penalties must be effective, proportionate and dissuasive. Per Art. 64, non-compliance with the essential cybersecurity requirements is subject to administrative fines of up to EUR 15,000,000 or, for an undertaking, up to 2.5% of its total worldwide annual turnover for the preceding financial year, whichever is higher; non-compliance with other obligations under the Regulation is subject to fines of up to EUR 10,000,000 or 2% of worldwide turnover, whichever is higher; and supplying incorrect, incomplete or misleading information to conformity assessment bodies or market surveillance authorities is subject to fines of up to EUR 5,000,000 or 1% of worldwide turnover, whichever is higher — with specific mitigations for microenterprises/SMEs and open-source software stewards."
      zh: "會員國訂定違反本法規之罰則規定，並應採取一切必要措施確保其執行；罰則須具有效性、比例性及嚇阻性。依第64條，違反基本網路安全要求者，處最高1,500萬歐元或（如為企業）其前一會計年度全球總營業額2.5%（以較高者為準）之行政罰鍰；違反本法規其他義務者，處最高1,000萬歐元或全球營業額2%（以較高者為準）之罰鍰；向符合性評鑑機構或市場監督機關提供不正確、不完整或誤導性資訊者，處最高500萬歐元或全球營業額1%（以較高者為準）之罰鍰——並就微型企業／中小企業及開放原始碼軟體管理者訂有特別減輕規定。"
    penalty_range: "up to EUR 15,000,000 or 2.5% of worldwide annual turnover, whichever is higher (most serious tier, per Art. 64)"
