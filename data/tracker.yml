    zh: "海灣低壓電氣設備與器具技術法規"
  category:
    - product_safety
    - emc

  product_scope:
    en: "Applies to electrical and electronic devices, appliances, and fixtures containing electrical and/or electronic components designed for use with a rated voltage of between 50 and 1000 V for alternating current and between 75 and 1500 V for direct current, other than the electrical equipment and phenomena listed in Annex (2) (Art. 1(8), Art. 2)."
    zh: "適用於設計使用電壓於交流50至1000伏特、直流75至1500伏特之間，含電氣及/或電子元件的電氣與電子裝置、器具及配件，但附件(2)所列之電氣設備及現象除外（第1(8)條、第2條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
  component_tags:
    - power_supply
  applies_to:
    - manufacturer
    - importer
    - seller

  status: in_force
