  sources:
    - url: "https://www.legislation.gov.uk/eur/2008/1272"
      type: primary
      publisher: "UK National Archives — retained EU law text of Regulation (EC) 1272/2008 (article-by-article; directly fetched and read this session, covering Art. 1 in full)"
    - url: "https://reachonline.eu/clp/en/title-vi-article-47.html"
      type: secondary
      publisher: "ReachOnline — used specifically for Art. 47 (penalties), which had been physically omitted from the UK legislation.gov.uk mirror as 'omitted (31.12.2020)' due to post-Brexit GB CLP divergence, directly fetched and read this session, and consistent with the same fallback pattern used for REACH's Art. 126 in this session"

  enforcement:
    authority: "National competent authorities designated by each EU Member State"
    mechanism:
      - market_surveillance
    penalty_basis: national_law
    penalty_summary:
      en: "Per Art. 47, Member States shall introduce penalties for non-compliance with this Regulation and shall take all measures necessary to ensure that it is applied; the penalties must be effective, proportionate and dissuasive. Member States were required to notify the Commission of their penalty provisions by 20 June 2010, and must notify without delay any subsequent amendment affecting them. The Regulation does not itself specify fine amounts, leaving these entirely to national implementing legislation."
      zh: "依第47條，會員國應就違反本法規之情形訂定罰則，並採取所有必要措施確保本法規之施行；所定罰則須具備有效性、比例性及嚇阻性。會員國須於2010年6月20日前將其罰則規定通報歐盟執委會，並就其後任何修正立即通報。本法規本身未規定罰鍰金額，完全交由各會員國國內施行立法定之。"
    penalty_range: null
