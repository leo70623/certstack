- id: cn-ccc-catalogue
  parent: null
  superseded_by: null
  jurisdiction: CN
  applies_in: []
  citation: "《强制性产品认证管理规定》（国家市场监督管理总局令第61号，2022年9月29日修订，原国家质量监督检验检疫总局令第117号，2009年9月1日起施行）第四条"
  local_type: "公告"
  instrument_type: administrative_measure
  short_name:
    en: "Catalogue of Products Subject to Compulsory Product Certification (CCC)"
    zh: "強制性產品認證目錄（CCC）"

  product_scope:
    en: "The baseline structural framework, per SAMR Announcement No. 18 of 2020 (effective 2020-04-28, the 'optimized catalogue' superseding the 2014 version), organizes covered products into 17 major categories and roughly 103 types, spanning electrical cables/wires, switches and protective devices, low-voltage electrical equipment, small power motors, power tools, welding machines, household appliances (19 types), electronic products, lighting equipment, vehicles and safety components, agricultural machinery, fire protection products, security devices, building materials, children's products, explosion-proof electrical equipment, and household gas appliances. This structural baseline has since been modified by numerous subsequent adjustment announcements (see notes) that add, remove, or reclassify individual products without replacing the 2020 framework as a whole."
    zh: "依國家市場監督管理總局2020年第18號公告（2020-04-28生效，即廢止2014年版本之「優化目錄」）所定基準架構，涵蓋產品區分為17大類、約103個品種，含電線電纜、開關及保護裝置、低壓電器、小功率電動機、電動工具、焊接機、家用電器（19種）、電子產品、照明設備、車輛及安全附件、農業機械、消防產品、安防產品、建築材料、兒童用品、防爆電氣設備及家用燃氣器具等。此基準架構其後歷經多份修訂公告（詳見notes）就個別產品新增、移除或重新分類，惟未整體取代2020年架構。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - small_appliances
  applies_to:
    - manufacturer
    - importer

  status: in_force

  requirements:
    conformity_assessment: [sdoc, third_party]
    conformity_assessment_note:
      en: "Per SAMR Announcement No. 18 of 2020's implementation detail, products within the catalogue are split between Procedure A (self-declaration of conformity, confirmed for 7 products in that announcement) and Procedure B (mandatory third-party certification via a designated laboratory, confirmed for 12 products in that announcement); the exact procedure assignment differs by specific product entry and has not been mapped item-by-item for the full current catalogue as of last_verified."
      zh: "依2020年第18號公告之實施細節，目錄內產品分為程序A（自我聲明符合性，該公告確認適用於7項產品）與程序B（須經指定實驗室之強制第三方驗證，該公告確認適用於12項產品）；確切程序歸屬依個別產品項目而異，截至last_verified日期為止，尚未就現行完整目錄逐項對應查核。"

  sources:
    - url: "https://www.gov.cn/zhengce/2022-10/08/content_5723510.htm"
      type: primary
      publisher: "中國政府網"
    - url: "https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/rzjgs/art/2023/art_0b9e7843505b4336952d54859217fe2a.html"
      type: primary
      publisher: "國家市場監督管理總局"

  monitoring:
    tier: C
    method: manual
    endpoint: null
    frequency: quarterly

  entry_status: stub
  last_verified: "2026-09-24"
  last_reviewed: "2026-09-24"
  review_status: pending
  confidence: low
  notes:
    en: "This is a stub entry. Confirmed via official sources: the legal basis of the CCC mandatory certification system is the Regulations on the Management of Compulsory Product Certification (SAMR Order No. 61, revised 2022-09-29; originally State Administration for Quality Supervision, Inspection and Quarantine Order No. 117, effective 2009-09-01). Article 4 of that Regulation provides that SAMR, jointly with relevant departments, formulates and adjusts the catalogue of products subject to compulsory certification and publishes it — meaning the catalogue itself is NOT a single standalone law/regulation with one current citation, but a continuously-amended administrative document composed of a baseline announcement plus a long, ongoing series of individual adjustment announcements, none of which references or restates a single governing catalogue text. This session, the SAMR page was successfully re-fetched and confirmed the baseline framework is SAMR Announcement No. 18 of 2020 (effective 2020-04-28): 17 major categories, ~103 types, and a Procedure A (self-declaration, 7 products)/Procedure B (designated-laboratory third-party certification, 12 products) split, used as the basis for the new product_scope and requirements.conformity_assessment fields above. Known further adjustment announcements identified so far: 2019 No. 44 (2019-10-16, removed 18 products, moved 17 to self-declaration — note this predates and was partly superseded by the 2020 No. 18 baseline); 2023 (catalogue adjustment plus the Catalogue Description and Definition Table, 2023 revision); 2024 (at least four separate announcements — Nos. 9, 26, 28, 50 — each adding different product categories); 2025 No. 57 (2025-12-28, effective 2027-01-01, cites only the Regulations on Certification and Accreditation as its legal basis, not any single catalogue document); and further adjustments in 2026. Given this structure, no single 'currently in force' catalogue announcement number exists to cite as THE citation, so citation is deferred rather than guessed, even though the 2020 No. 18 baseline is now usable for scope/procedure description. Confidence remains low, not medium, because the product_scope and conformity_assessment fields reflect the 2020 baseline only and have not been reconciled against the numerous 2023-2026 adjustment announcements to determine what currently applies. Fields still pending: obligations, dates, enforcement and penalties, and full reconciliation of the 2020 baseline against subsequent adjustments."
    zh: "本條目為 stub。已透過官方來源確認：CCC 強制性認證制度之法源為《強制性產品認證管理規定》（國家市場監督管理總局令第61號，2022年9月29日修訂；原國家質量監督檢驗檢疫總局令第117號，2009年9月1日起施行）。該規定第四條規定由市場監管總局會同有關部門制定、調整並公佈強制性產品認證目錄——即目錄本身並非單一、具有唯一現行引用文號之法規文件，而是由一份基準文件加上長期、持續的個別修訂公告所組成的複合行政文件，各修訂公告均未引用或重述單一的「現行目錄」母文件。本次工作階段重新成功擷取市場監管總局網頁，確認基準架構為2020年第18號公告（2020-04-28生效）：17大類、約103品種，並有程序A（自我聲明，7項產品）／程序B（指定實驗室第三方驗證，12項產品）之分工，此即上方新增之product_scope與requirements.conformity_assessment欄位依據。目前另查證到之修訂公告包括：2019年第44號（2019-10-16，移除18項產品、17項改自我聲明——注意此公告早於2020年第18號基準架構，部分內容已為其取代）；2023年目錄調整暨《強制性產品認證目錄描述與界定表（2023年修訂）》；2024年至少4份個別公告（第9號／26號／28號／50號，各自新增不同產品類別）；2025年第57號（2025-12-28發布，2027-01-01生效，僅引用《認證認可條例》為授權依據，未引用任何單一目錄文件）；以及2026年之後續調整。基於此文件結構，並不存在單一「現行有效」的目錄公告文號可作為唯一citation，故此項引用暫緩填寫、而非臆測，惟2020年第18號基準架構已可用於描述適用範圍與程序分工。把握度維持low、未提升為medium，係因product_scope及conformity_assessment僅反映2020年基準架構，尚未與2023-2026年多份修訂公告逐一比對以確認現行實際適用內容。待補欄位：義務、日期、執法與罰則，以及2020年基準架構與後續修訂之完整對照核實。"

