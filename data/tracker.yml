    en: "Added as the third item in the REACH→EUDR→Single-Use Plastics Directive→F-Gas Regulation→CLP Regulation batch of new EU environmental regulations, per the user's instruction to proceed with the EU-level items first. Sourced this session via a full, directly-fetched and read article-by-article text at the UK National Archives' retained-EU-law mirror (legislation.gov.uk/eudr/2019/904), since this Directive predates Brexit and is therefore available in that mirror (unlike the post-Brexit-adopted EUDR and CRA); the official OJ citation (L 155, 12.6.2019, pp. 1-19) was cross-verified via web search since direct EUR-Lex fetch again returned blank content this session, consistent with the pattern observed for other EU instruments this session. Consumer-electronics relevance is narrower than for REACH or the EUDR — mainly relevant via beverage-cup/lid accessory items and plastic packaging components rather than core electronic products, which is reflected in the deliberately narrow component_tags: [packaging] tag (no cable_connector or battery tag, since the Directive's substantive design/marking requirements target beverage containers and specific listed items, not electronics components generally). requirements.marking is true (Art. 7 marking requirement for specific listed products) unlike most other entries in this batch. dates.labelling is set to the same 2021-07-03 date as dates.application since Art. 7's marking obligation applies from the general transposition deadline, not a separately staggered date; dates.transition_end reflects the later 2024-12-31 deadline for extended-producer-responsibility cost-coverage obligations under Art. 8, and Art. 6's tethered-cap requirement's own 2024-07-03 deadline is noted in the obligations text rather than as a separate schema date field, since the schema does not have a field for more than one staggered implementation milestone."
    zh: "本條目係依你「先處理歐盟的」之指示，作為新一批歐盟環保法規（REACH→EUDR→一次性塑膠指令→氟化氣體法規→CLP法規）之第三項新增。本次工作階段係透過完整直接擷取並閱讀英國國家檔案館之歐盟保留法律鏡像網站（legislation.gov.uk/eudr/2019/904）逐條文字取得，因本指令早於脫歐即已通過，故該鏡像網站收錄完整（不同於脫歐後始通過之EUDR及CRA）；官方OJ引註（L 155, 12.6.2019, pp. 1-19）已透過網路搜尋交叉驗證，因本次工作階段直接擷取EUR-Lex仍回傳空白內容，與本次工作階段其他歐盟法規之情形一致。與消費性電子之關聯性較REACH或EUDR為窄——主要透過飲料杯／杯蓋配件及塑膠包裝組件產生關聯，而非核心電子產品本身，此反映於刻意設定較窄之component_tags: [packaging]（未列cable_connector或battery，因本指令之實質設計／標示要求係針對飲料容器及特定列名產品，非泛指電子產品組件）。requirements.marking設為true（第7條特定列名產品標示要求），與本批次其餘條目多數不同。dates.labelling與dates.application採相同之2021-07-03日期，因第7條標示義務自一般轉換期限起適用，並無另行分階段之日期；dates.transition_end反映第8條延伸生產者責任費用負擔義務之較晚期限2024-12-31，第6條瓶蓋栓繫規定本身另有2024-07-03期限，因schema並無容納多重分階段實施里程碑之欄位，故僅於obligations文字中註明。"

