  requirements:
    conformity_assessment: [third_party]
    conformity_assessment_note:
      en: "The CB Scheme's entire function is to make a single set of test results (CB Test Certificate + CB Test Report), produced by a National Certification Body/CB Test Laboratory accredited within the IECEE structure, mutually acceptable to all other participating NCBs — i.e. it is inherently a third-party testing/certification mechanism, not a self-declaration route; there is no sdoc option within the Scheme itself."
      zh: "CB Scheme之核心功能，在於使由IECEE體系內經認可之國家認證機構／CB測試實驗室所產出之單一套測試結果（CB測試證書＋CB測試報告），可為所有其他參與NCB相互接受——換言之，本質上即為第三方測試／驗證機制，而非自我聲明途徑；Scheme本身並無sdoc選項。"

