  confidence: medium
  notes:
    en: "Added at the user's explicit request ('好，先處理法國AGEC') following an exploratory question about the 'garantie label' (garantie légale de conformité invoice-disclosure requirement, Art. 20), which is the first member-state-level (non-EU-harmonised) entry added to this tracker. Required a schema change this session: jurisdiction enum in schema.yml and the hardcoded JURISDICTIONS set in scripts/validate.py were both updated to add 'FR', and vocab.yml's jurisdictions map was updated with a France entry (color #002654) — unlike GCC member states (KW/QA/BH/OM), France is recorded as an independently-tracked jurisdiction rather than only an applies_in value, since AGEC is genuine French national legislation, not a transposition of an EU-level instrument being tracked elsewhere. The site's front-end (site/index.html) reads jurisdiction chips dynamically from vocab.jurisdictions, so no front-end code change was needed for 'FR' to appear correctly in the jurisdiction filter. AGEC itself is a very broad omnibus statute (130 articles across 6 titles, covering food waste, textiles, packaging, batteries, and much more); this entry deliberately scopes product_scope/obligations to only the four provisions most relevant to consumer electronics (Art. 16 repairability/durability index, Art. 19 spare-parts availability, Art. 20 legal-guarantee invoice disclosure — i.e. the 'garantie label' the user asked about — and Art. 35's unsold-goods destruction ban), rather than attempting to model the entire statute, consistent with this tracker's consumer-electronics focus. Sourcing this session was unusually strong for a non-UK-mirror jurisdiction: Légifrance (the official French government legal database) was successfully and directly fetched multiple times this session without the blank-content problems seen with EUR-Lex, yielding full primary-text reads of Art. 16, Art. 19, Décret n° 2021-609 (Art. 20's implementing decree, including verbatim required invoice wording and the exact 12-category list), and the Code de la consommation's Art. L217-3 et seq. (the underlying 2-year guarantee duration). The one weaker point is the exact penalty article number/text for the Art. 16 repairability-index information obligations specifically (Art. 29, per secondary-source summaries only, not independently confirmed against Légifrance primary text this session, unlike Art. 35's penalty text which secondary sources quote directly) — flagged here as a targeted follow-up item for future full human review, though the overall entry still qualifies for confidence: medium given the volume of directly-read primary text underlying the rest of the entry. dates.transition_end is set to 2024-01-01 to mark the durability index's effective date (Art. 16 Part II) rather than a conventional grace-period end. related includes eu-2024-1781-espr (Ecodesign for Sustainable Products Regulation) since ESPR's future EU-wide repairability/durability scoring framework is the most directly analogous and potentially superseding EU-level instrument, though AGEC is not formally superseded by it at this time."
    zh: "本條目係依你明確要求（「好，先處理法國AGEC」）新增，源自你先前對「garantie label」（法定符合性保固發票揭露要求，第20條）之詢問，亦為本tracker首筆會員國層級（非歐盟統一規範）之條目。本次工作階段須進行schema變更：schema.yml之jurisdiction enum，以及scripts/validate.py中寫死之JURISDICTIONS集合，均已新增「FR」；vocab.yml之jurisdictions對照表亦已新增法國項目（顏色代碼#002654）——與GCC會員國（科威特／卡達／巴林／阿曼）不同，法國記為獨立追蹤之jurisdiction，而非僅作為applies_in值，因AGEC屬真正的法國國內立法，非本tracker其他條目所追蹤歐盟法規之國內轉換版本。網站前端（site/index.html）係自vocab.jurisdictions動態讀取jurisdiction篩選標籤，故「FR」無需額外前端程式碼修改即可正確顯示於篩選介面。AGEC本身為極廣泛之綜合性法律（共6編130條，涵蓋食物浪費、紡織品、包裝、電池等諸多領域）；本條目刻意將product_scope／obligations僅聚焦於與消費性電子最相關之四項規定（第16條可修復性／耐用性指數、第19條備用零件供應、第20條法定保固發票揭露——即你所詢問之「garantie label」——及第35條未售出商品銷毀禁令），而非嘗試建模整部法律，以符本tracker之消費性電子聚焦定位。本次工作階段對非英國鏡像網站法域之來源查證強度異常良好：Légifrance（法國政府官方法律資料庫）本次工作階段多次成功直接擷取，未出現EUR-Lex常見之空白內容問題，取得第16條、第19條、第2021-609號法令（第20條施行法令，含逐字必要發票文字及確切12類產品清單）及消費法典第L217-3條以下（保固2年期限之依據）之完整一手文字。唯一較弱之處，在於第16條可修復性指數資訊義務所適用之確切罰則條號及條文內容（第29條，僅依次要來源摘要取得，本次工作階段未能以Légifrance一手文字獨立確認，不同於第35條罰則文字係由次要來源直接引用）——已於此標記為未來完整人工複核之重點待辦項目，惟考量本條目其餘部分已有大量直接讀取之一手文字支撐，整體條目仍符合confidence: medium之標準。dates.transition_end設為2024-01-01，用以標示耐用性指數之生效日期（第16條第二部分），而非傳統寬限期屆滿日。related含eu-2024-1781-espr（永續產品生態設計法規），因ESPR未來之歐盟統一可修復性／耐用性評分框架，係與本條目最直接類比、且可能取代本條目之歐盟層級法規，惟AGEC目前尚未正式被其取代。"
