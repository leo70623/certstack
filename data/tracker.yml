  notes:
    en: "Added at the user's request as the next item in the RoHS→GPSR→WEEE→Battery Regulation→Cyber Resilience Act batch, identified as a gap: this Regulation replaced the old Batteries Directive 2006/66/EC and, unlike RoHS/WEEE which address EEE generally, is battery-specific with its own carbon-footprint-declaration, due-diligence and battery-passport regime layered on top of a CE-marking/conformity-assessment structure closer to RED/EMC in form. This session, EUR-Lex's plain HTML CELEX page (32023R1542) was successfully fetchable for the recitals and Arts. 1-3, 7-8, 38, 42, 44, 52-53, 98 (registration), though repeated fetches of the same URL returned inconsistent results for later-numbered articles — one fetch surfaced Arts. 38/42/44/52/53/98 in full, a later fetch of the same URL for the Penalties/Entry-into-force articles returned only recitals up to (119) and reported truncation, so Art. 93 (Penalties) and the exact application-date schedule (Art. 96) were instead confirmed via independent web search cross-referencing multiple secondary compliance-consultancy sources that agree on the article numbers and dates (18 February 2024 general application; Art. 17/Chapter VI generally from 18 August 2024; Art. 93 penalty-rule deadline of 18 August 2025). requirements.conformity_assessment is set to [sdoc, third_party] (not simply [sdoc] like RoHS) because, unlike RoHS, this Regulation explicitly contemplates notified-body (third-party) involvement for certain higher-risk requirements per Art. 52, alongside self-declaration for most battery categories — the precise module-to-battery-category mapping is in Annex VIII and was not transcribed field-by-field. requirements.registration is true based on the Art. 98 national producer-register obligation (per-Member-State, EPR-style, same pattern as WEEE Art. 16), while requirements.local_representative remains false as no standalone mandatory-authorised-representative obligation independent of the importer/producer registration route was identified. Confidence raised to medium under the schema's rule (entry_status complete, all quoted fields traced to directly-read primary text where fetchable, cross-verified via multiple independent secondary sources for the article numbers/dates that EUR-Lex's own fetch could not surface). NOT yet independently human-reviewed: the exact wording of Art. 93 and Art. 96 (paraphrased from secondary sources rather than directly quoted from the primary text, since EUR-Lex fetches of this specific section were inconsistent/truncated this session — this is the single highest-priority item for a future human pass); the detailed staggered application-date schedule beyond the 2024-02-18 general date (carbon footprint, due diligence, battery passport, removability requirements phase in through 2027 and are not modelled in the schema's single dates.application field); and the Annex VIII conformity-assessment-module-to-category mapping."
    zh: "本條目係依你之要求，作為RoHS→GPSR→WEEE→電池法規→網路韌性法案批次之下一項新增，經辨識為缺口：本法規取代舊有之電池指令2006/66/EC，且與泛指所有EEE之RoHS／WEEE不同，本法規為電池專屬規範，於CE標誌／符合性評鑑架構（形式上較接近RED／EMC）之上，另疊加碳足跡聲明、供應鏈盡職調查及電池護照制度。本次工作階段，EUR-Lex純HTML CELEX頁面（32023R1542）就前言及第1-3、7-8、38、42、44、52-53、98條（登記）成功擷取，惟同一網址之重複擷取對較後段條文結果不一致——一次擷取完整取得第38、42、44、52、53、98條，另一次針對罰則／生效條文之擷取僅回傳前言至第(119)點並回報內容截斷，故第93條（罰則）及確切適用日期時程（第96條）改以獨立網路搜尋、交叉比對多個彼此一致之次要合規顧問來源確認（2024年2月18日一般適用日；第17條／第六章一般自2024年8月18日起適用；第93條罰則規定期限為2025年8月18日）。requirements.conformity_assessment設為[sdoc, third_party]（非僅[sdoc]，與RoHS不同），係因本法規明確規定就特定較高風險要求，依第52條須有公告機構（第三方）參與評鑑，多數電池類別則仍為自我聲明——確切模組對電池類別之對應關係載於附件VIII，本次未逐項轉錄。requirements.registration為true，係依第98條各國生產者登記義務（依會員國別、延伸生產者責任型態，與WEEE第16條相同模式）；requirements.local_representative則維持false，因未發現獨立於進口商／生產者登記途徑之強制性授權代表義務。依schema規則，把握度提升為medium（entry_status為complete，凡可擷取之欄位均追溯至直接讀取之一手文字，就EUR-Lex本身擷取未能取得之條文編號／日期，已以多個獨立次要來源交叉驗證）。尚未經人工獨立複核：第93條及第96條之確切原文（本次係依次要來源改寫而非直接引用一手文字，因本次工作階段對此部分之EUR-Lex擷取結果不一致／遭截斷——此為未來人工複核之最優先項目）；2024-02-18一般適用日以外之分階段適用時程（碳足跡、盡職調查、電池護照、可移除性等要求陸續於2027年前生效，本schema單一dates.application欄位並未建模）；以及附件VIII符合性評鑑模組與電池類別之對應關係。"

- id: eu-2024-2847-cra
  parent: null
  superseded_by: null
  jurisdiction: EU
  applies_in: []
  citation: "Regulation (EU) 2024/2847 of the European Parliament and of the Council of 23 October 2024 on horizontal cybersecurity requirements for products with digital elements and amending Regulations (EU) No 168/2013 and (EU) 2019/1020 and Directive (EU) 2020/1828 (Cyber Resilience Act) (OJ L, 2024/2847, 20.11.2024)"
  local_type: "Regulation"
  instrument_type: regulation
  short_name:
    en: "Cyber Resilience Act (CRA)"
    zh: "網路韌性法案（CRA）"
  category:
    - cybersecurity
    - horizontal_regulation

  product_scope:
    en: "Applies to products with digital elements — software or hardware products and their remote data-processing solutions, including software or hardware components placed on the market separately — whose intended or reasonably foreseeable use includes a direct or indirect logical or physical data connection to a device or network (Art. 2(1), Art. 3(1)). Excludes: products with digital elements covered by sector-specific Union rules that already achieve an equivalent level of protection (e.g. medical devices under Regulations (EU) 2017/745/2017/746, motor vehicles under Regulation (EU) 2019/2144, civil aviation equipment under Regulation (EU) 2018/1139, marine equipment under Directive 2014/90/EU); spare parts placed on the market to replace identical components in products already placed on the market and manufactured to the same specifications; products developed exclusively for national security or military purposes, or specifically designed to process classified information; and, subject to conditions, free and open-source software not made available on the market in the course of a commercial activity (Art. 2)."
    zh: "適用於「內含數位元件之產品」——即軟體或硬體產品及其遠端資料處理解決方案，包含另行單獨投放市場之軟體或硬體元件——其預期或合理可預見之使用方式，包含與設備或網路之直接或間接、邏輯或實體資料連接（第2(1)條、第3(1)條）。排除：已受其他歐盟部門別法規涵蓋且已達相當保護水準之內含數位元件產品（例如依規則(EU) 2017/745／2017/746之醫療器材、依規則(EU) 2019/2144之機動車輛、依規則(EU) 2018/1139之民航設備、依指令2014/90/EU之船舶設備）；為替換已投放市場產品中相同元件、依相同規格製造之備用零件；專為國家安全或軍事目的開發，或專為處理機密資訊而設計之產品；以及（附條件）非以商業活動方式提供市場之自由及開放原始碼軟體（第2條）。"
  product_tags:
    - consumer_electronics
    - it_equipment
    - radio_equipment
  component_tags:
    - software_firmware
  applies_to:
    - manufacturer
    - importer
    - seller

  status: adopted
  dates:
    published: "2024-11-20"
    application: "2027-12-11"
    labelling: null
    transition_end: null

  requirements:
    marking: true
    local_representative: false
    local_testing: false
    registration: false
    conformity_assessment: [sdoc, third_party]
    conformity_assessment_note:
      en: "Art. 32 sets out multiple conformity assessment procedures (based on Decision No 768/2008/EC modules); which procedure is mandatory depends on whether the product falls in the 'default' category (internal production control / self-declaration permitted for most products), the 'important' Class I/II category (Annex III, generally requires either a harmonised-standard-based self-assessment or third-party involvement depending on the sub-class), or the 'critical' category (Annex IV, third-party/European cybersecurity certification scheme conformity assessment mandatory). Most everyday consumer products with digital elements fall into the default, self-declaration category; a smaller subset of higher-risk product types is subject to mandatory third-party assessment."
      zh: "第32條訂有多種符合性評鑑程序（依決定768/2008/EC所定模組）；適用何種程序，取決於產品屬於「預設」類別（多數產品得採內部生產管制／自我聲明）、「重要」第I／II級類別（附件III，依子類別而定，一般須採以協和標準為基礎之自我評鑑或須第三方參與），抑或「關鍵」類別（附件IV，強制須經第三方／歐盟網路安全驗證計畫進行符合性評鑑）。多數日常消費性內含數位元件產品屬預設之自我聲明類別；一部分較高風險產品類型則須強制經第三方評鑑。"

  obligations:
    - actor: manufacturer
      action:
        en: "Ensure the product with digital elements is designed, developed and produced in accordance with the essential cybersecurity requirements of Annex I Part I; carry out a documented cybersecurity risk assessment before placing the product on the market and take its outcome into account throughout planning, design, development, production, delivery and maintenance; determine a 'support period' (at least 5 years, or the expected use period if shorter) during which vulnerabilities must be handled per Annex I Part II, and keep security updates available for at least 10 years or the support period, whichever is longer; exercise due diligence when integrating third-party (including open-source) components; draw up technical documentation, carry out the applicable conformity assessment procedure, draw up the EU declaration of conformity, and affix CE marking; keep the technical documentation and declaration of conformity available to market surveillance authorities for at least 10 years or the support period, whichever is longer; ensure the product bears a type/batch/serial number or other identifying element; indicate name, registered trade name/mark and contact details on the product, packaging or accompanying documentation; designate a single point of contact for vulnerability reporting; provide user information/instructions per Annex II; clearly disclose the end date of the support period; and, upon becoming aware of non-conformity, immediately take corrective action including withdrawal or recall, and cooperate with market surveillance authorities (Art. 13)."
        zh: "確保內含數位元件產品之設計、開發及製造符合附件I第I部分之基本網路安全要求；於投放市場前執行有文件記錄之網路安全風險評估，並於規劃、設計、開發、製造、交付及維護全程納入考量；訂定「支援期間」（至少5年，或如預期使用期較短則以該期間為準），於該期間內須依附件I第II部分處理弱點，並將安全性更新於發布後至少維持提供10年或支援期間（以較長者為準）；整合第三方（含開放原始碼）元件時應盡職調查；編製技術文件、執行適用之符合性評鑑程序、製作歐盟符合性聲明並張貼CE標誌；保存技術文件及符合性聲明供市場監督機關取用達10年或支援期間（以較長者為準）；確保產品標示型號／批號／序號或其他識別元素；於產品、包裝或隨附文件上標示名稱、註冊商號／商標及聯絡資訊；指定單一聯絡窗口以供弱點通報；依附件II提供使用者資訊／說明；明確揭露支援期間屆滿日期；並於得知不合規時，立即採取矯正措施（含下架或召回），配合市場監督機關（第13條）。"
    - actor: importer
      action:
        en: "Place on the market only products with digital elements that comply with the essential cybersecurity requirements of Annex I; before placing on the market, verify that the manufacturer has carried out the appropriate conformity assessment, drawn up technical documentation, and that the product bears CE marking and is accompanied by the EU declaration of conformity and Annex II information in an easily understood language, and that the manufacturer has complied with its identification/contact/single-point-of-contact obligations; where the importer considers or has reason to believe a product is not in conformity, not place it on the market until brought into conformity, and where it presents a significant cybersecurity risk, inform the manufacturer and market surveillance authorities; indicate the importer's own name, trade name/mark and contact details on the product, packaging or accompanying documentation; take immediate corrective action including withdrawal/recall where non-compliance is discovered post-market, and inform the manufacturer of any vulnerability without undue delay; and keep a copy of the declaration of conformity and ensure the technical documentation can be made available to authorities for at least 10 years or the support period, whichever is longer (Art. 19)."
        zh: "僅將符合附件I基本網路安全要求之內含數位元件產品投放市場；投放前應查核製造商已執行適用之符合性評鑑、編製技術文件，產品已張貼CE標誌並備有以易懂語言提供之歐盟符合性聲明及附件II資訊，且製造商已履行其識別／聯絡／單一聯絡窗口義務；如進口商認為或有理由相信產品不合規，於導正合規前不得投放市場，且如產品具重大網路安全風險，應通知製造商及市場監督機關；於產品、包裝或隨附文件上標示進口商自身名稱、商號／商標及聯絡資訊；於投放市場後發現不合規時立即採取矯正措施（含下架／召回），並就任何弱點不遲延通知製造商；並保存符合性聲明副本，確保技術文件可供主管機關取用達10年或支援期間（以較長者為準）（第19條）。"
    - actor: seller
      action:
        en: "Before making a product with digital elements available on the market, act with due care and verify that it bears CE marking and that the manufacturer and importer have complied with their respective identification, information and single-point-of-contact obligations (Art. 13(15),(16),(18),(19),(20) and Art. 19(4)); where a distributor considers or has reason to believe a product is not in conformity, not make it available until brought into conformity, and where it poses a significant cybersecurity risk, inform the manufacturer and market surveillance authorities without undue delay; ensure corrective measures (including withdrawal or recall) are taken where non-compliance is found post-market, and inform the manufacturer of any vulnerability without undue delay; and, upon reasoned request from a market surveillance authority, provide all information/documentation necessary to demonstrate conformity and cooperate on measures taken to eliminate cybersecurity risks (Art. 20)."
        zh: "於使內含數位元件產品可於市場上取得前，應本於注意義務查核其已張貼CE標誌，且製造商與進口商已履行各自之識別、資訊及單一聯絡窗口義務（第13條第15、16、18、19、20項及第19條第4項）；如經銷商認為或有理由相信產品不合規，於導正合規前不得使其可於市場上取得，且如該產品具重大網路安全風險，應不遲延通知製造商及市場監督機關；於投放市場後發現不合規時，確保採取矯正措施（含下架或召回），並就任何弱點不遲延通知製造商；並於市場監督機關提出有理由之請求時，提供證明合規所需之一切資訊／文件，配合消除網路安全風險所採取之措施（第20條）。"

